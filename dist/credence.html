    if (v.n) svg += `<line x1="${r1(x(v.impMed))}" x2="${r1(x(v.impMed))}" y1="${yc - 11}" y2="${yc + 11}" class="s-median"/>`;
    if (v.mine) {
      const mx = r1(x(v.mine.impact));
      svg += `<circle cx="${mx}" cy="${yc}" r="5.5" class="s-me"/>`;
    }
    svg += `<text x="8" y="${H - 1}" class="g-tick">opposes</text><text x="${W - 8}" y="${H - 1}" class="g-tick" text-anchor="end">supports</text>`;
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  /* ------------------------------------------------------------------
   * Step meter: inside the assessment form, where you are and how this
   * finding moves you.
   * ------------------------------------------------------------------ */
  C_.stepMeter = function (el, before, after) {
    const W = Math.max(240, el.clientWidth || 520);
    const padL = 14;
    const padR = 14;
    const H = 58;
    const w = W - padL - padR;
    const x = scaleX(padL, w);
    useTicks(w);
    const y = 30;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(
      'Your belief: ' + M.pctDb(before) + (after != null ? ' to ' + M.pctDb(after) : '')
    )}">`;
    svg += `<line x1="${padL}" x2="${padL + w}" y1="${y}" y2="${y}" class="g-mid"/>`;
    for (const p of TICKS) {
      const xx = r1(x(M.toDb(p)));
      svg += `<line x1="${xx}" x2="${xx}" y1="${y - 4}" y2="${y + 4}" class="g-mid"/><text x="${xx}" y="${H - 2}" class="g-tick" text-anchor="middle">${tickLabel(p)}</text>`;
    }
    const xb = x(before);
    if (after != null && Math.abs(x(after) - xb) >= 3) {
      svg += arrow(xb, x(after), y, after > before ? 'a-for' : 'a-against');
      svg += `<circle cx="${r1(xb)}" cy="${y}" r="5" class="p-none"/>`;
      svg += `<circle cx="${r1(x(after))}" cy="${y}" r="6.5" class="p-end"/>`;
      const xa = x(after);
      const anchor = xa > W - 60 ? 'end' : xa < 60 ? 'start' : 'middle';
      svg += `<text x="${r1(xa)}" y="${y - 13}" class="p-label strong" text-anchor="${anchor}">${M.pctDb(after)}</text>`;
    } else {
      svg += `<circle cx="${r1(xb)}" cy="${y}" r="6.5" class="p-end"/>`;
      const anchor = xb > W - 60 ? 'end' : xb < 60 ? 'start' : 'middle';
      svg += `<text x="${r1(xb)}" y="${y - 13}" class="p-label strong" text-anchor="${anchor}">${M.pctDb(before)}</text>`;
    }
    svg += `</svg>`;
    el.innerHTML = svg;
  };
})();

    <script>
/*
 * Credence — shared interface pieces: badges, avatars, breadcrumbs, the credence input,
 * the strength scale and trust chips, and the panel-summary wording used across views.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const S = C.state;

  const STATUS_BADGE = {
    Retracted: ['retracted', '✕'],
    Contested: ['contested', '!'],
    Replicated: ['replicated', '✓'],
    'Single study': ['single', '1'],
    Replication: ['replication', '↻'],
  };
  C.statusBadge = function (status) {
    if (!status) return '';
    const b = STATUS_BADGE[status] || ['other', '·'];
    return `<span class="badge badge-${b[0]}"><i aria-hidden="true">${b[1]}</i>${esc(status)}</span>`;
  };

  C.initials = (name) =>
    String(name || '?')
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0])
      .join('')
      .toUpperCase();

  C.displayName = (p) => (p && p.isMe ? (S.me.name ? S.me.name + ' (you)' : 'You') : (p && p.name) || 'Assessor');

  C.avatar = function (p, size) {
    const cls = p && p.isMe ? ' av-me' : '';
    return `<span class="av${cls}${size ? ' av-' + size : ''}" aria-hidden="true">${esc(C.initials(p && p.name))}</span>`;
  };

  C.crumbs = function (items) {
    return `<nav class="crumbs" aria-label="Breadcrumb"><ol>${items
      .map((it, i) =>
        i === items.length - 1 ? `<li aria-current="page">${esc(it.label)}</li>` : `<li><a href="${esc(it.href)}">${esc(it.label)}</a></li>`
      )
      .join('')}</ol></nav>`;
  };

  C.sampleNotice = function () {
    if (!C.sampleActive()) return '';
    return `<div class="notice"><span class="notice-ico" aria-hidden="true">!</span><span><b>Sample question.</b> The studies are real. The 20 assessors, their profiles and their ratings are fictional, simulated to show how a panel reads. Turn the sample panel off in <button class="btn-link" data-act="open-data">Data</button> when running with real people.</span></div>`;
  };

  C.evidenceHead = function (e, k) {
    const src = e.source || {};
    const srcText = [src.label, src.year].filter(Boolean).join(', ');
    return `<div class="ev-head">
      <div class="ev-tags">${k != null ? `<span class="tag">Evidence ${k + 1}</span>` : ''}${e.kind ? `<span class="tag">${esc(e.kind)}</span>` : ''}${C.statusBadge(e.status)}</div>
      <h4 class="ev-title">${esc(e.title)}</h4>
      ${e.summary ? `<p class="ev-sum">${esc(e.summary)}</p>` : ''}
      ${
        src.url
          ? `<p class="ev-src"><a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(srcText || 'Source')} ↗</a></p>`
          : srcText
          ? `<p class="ev-src">${esc(srcText)}</p>`
          : ''
      }
    </div>`;
  };

  /* ---------- the credence input (starting belief) ---------- */
  C.credenceHTML = function (prior) {
    const unset = prior == null;
    const v = unset ? 0 : prior;
    const p = M.toP(v);
    const ticks = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]
      .map((t) => `<span style="--t:${(M.toDb(t) + M.D) / (2 * M.D)}">${Math.round(t * 100)}%</span>`)
      .join('');
    const presets = [0.01, 0.1, 0.25, 0.5, 0.75, 0.9, 0.99]
      .map((t) => {
        const on = !unset && Math.abs(M.toDb(t) - v) < 0.3;
        return `<button type="button" class="preset${on ? ' is-on' : ''}" data-p="${t}">${Math.round(t * 100)}%</button>`;
      })
      .join('');
    return `<div class="cred${unset ? ' is-unset' : ''}" id="cred">
      <div class="cred-read" aria-live="polite">
        <span class="cred-big num" id="cred-big">${unset ? '—' : M.pct(p)}</span>
        <span class="cred-words"><span class="cred-verbal" id="cred-verbal">${unset ? 'Not set yet' : esc(M.verbal(p))}</span>
        <span class="cred-freq" id="cred-freq">${unset ? 'Drag the slider or pick a value' : esc(M.chance(p))}</span></span>
      </div>
      <div class="cred-track">
        <input type="range" id="prior-range" min="${-M.D}" max="${M.D}" step="0.5" value="${v}" aria-label="Starting belief" aria-valuetext="${
      unset ? 'Not set' : M.pct(p) + ', ' + M.verbal(p)
    }">
        <div class="cred-ticks" aria-hidden="true">${ticks}</div>
      </div>
      <div class="presets"><span class="presets-label">Quick pick</span>${presets}</div>
    </div>`;
  };

  C.updateCredenceReadout = function (root, v) {
    const p = M.toP(v);
    const cred = root.querySelector('#cred');
    cred.classList.remove('is-unset');
    root.querySelector('#cred-big').textContent = M.pct(p);
    root.querySelector('#cred-verbal').textContent = M.verbal(p);
    root.querySelector('#cred-freq').textContent = M.chance(p);
    root.querySelector('#prior-range').setAttribute('aria-valuetext', M.pct(p) + ', ' + M.verbal(p));
    cred.querySelectorAll('.preset').forEach((b) => b.classList.toggle('is-on', Math.abs(M.toDb(+b.dataset.p) - v) < 0.3));
  };

  /* ---------- strength scale & trust ---------- */
  C.readoutHTML = function (r) {
    if (!r || r.s == null) return r && r.skipped ? 'Skipped: outside your expertise.' : 'Not weighed yet.';
    if (r.s === 0) return '<b>No effect.</b> This finding does not move the claim either way.';
    const t = r.t != null ? r.t : 1;
    const eff = r.s * t;
    let txt = `<b>${esc(M.strengthLabel(r.s))}.</b> If it holds, it ${esc(M.factorText(r.s))}.`;
    if (t < 1) txt += ` Trusted “${esc(M.trustLabel(t))}”, it counts as ${esc(M.strengthLabel(eff).toLowerCase())}.`;
    return txt;
  };

  C.scaleHTML = function (e, r) {
    const sel = r && r.s != null ? r.s : null;
    const segs = M.STEPS.map((s, i) => {
      const dist = Math.abs(i - 6);
      const dir = s > 0 ? 'for' : s < 0 ? 'against' : 'mid';
      const on = sel === s;
      const fill = sel != null && sel !== 0 && Math.sign(s) === Math.sign(sel) && Math.abs(s) <= Math.abs(sel);
      const label = M.strengthLabel(s);
      return `<button type="button" role="radio" aria-checked="${on}" class="seg ${dir} lvl-${dist}${fill ? ' is-fill' : ''}${on ? ' is-on' : ''}" data-s="${s}" data-ev="${esc(
        e.id
      )}" aria-label="${esc(label)}" title="${esc(label)}"></button>`;
    }).join('');
    return `<div class="scale" role="radiogroup" aria-labelledby="ql-${esc(e.id)}">${segs}</div>
      <div class="scale-labels" aria-hidden="true"><span>Decisive</span><span>Strong</span><span>Weak</span><span>None</span><span>Weak</span><span>Strong</span><span>Decisive</span></div>
      <div class="scale-dirs" aria-hidden="true"><span>← Opposes the claim</span><span>Supports the claim →</span></div>`;
  };

  C.trustHTML = function (e, r) {
    const has = r && r.s != null;
    const t = has ? (r.t != null ? r.t : 1) : null;
    const chips = M.TRUST.map((x) => {
      const on = t != null && Math.abs(x.v - t) < 0.01;
      return `<button type="button" role="radio" aria-checked="${on}" class="chip${on ? ' is-on' : ''}" data-t="${x.v}" data-ev="${esc(e.id)}"${
        has ? '' : ' disabled'
      }>${esc(x.label)}<small>${esc(x.hint)}</small></button>`;
    }).join('');
    return `<div class="chips${has ? '' : ' is-disabled'}" role="radiogroup" aria-labelledby="qt-${esc(e.id)}">${chips}</div>`;
  };

  /* ---------- panel wording ---------- */
  C.actionChip = function (s) {
    const st = C.STATUS[s.status];
    let type = s.status;
    let label = st.action;
    if (s.status.startsWith('settled') && s.repl) {
      type = 'replicate';
      label = 'Fund a replication';
    }
    return `<span class="act act-${type}">${esc(label)}</span>`;
  };

  C.shiftText = function (s) {
    if (s.n < 3) return '';
    if (Math.abs(s.shift) < 0.8) return 'Evidence barely moved the panel';
    return `${s.shift > 0 ? 'Up' : 'Down'} from ${M.pctDb(s.priorMed)} before evidence`;
  };

  C.quote = (t) => `<q>${esc(t)}</q>`;
  C.listText = function (arr) {
    if (arr.length <= 1) return arr.join('');
    return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  };

  C.ledeText = function (all) {
    const q = C.quote;
    const by = (s) => all.filter((x) => x.status === s);
    const parts = [];
    const contested = by('contested');
    const open = by('open');
    const yes = by('settled-true');
    const no = by('settled-false');
    if (contested.length) parts.push(`Experts are split on ${C.listText(contested.map((s) => q(s.claim.title)))}.`);
    if (yes.length)
      parts.push(`They consider ${C.listText(yes.map((s) => q(s.claim.title) + ' ' + esc(M.verbalDb(s.postMed).toLowerCase()) + ' (' + M.pctDb(s.postMed) + ')'))}.`);
    if (open.length) parts.push(`They agree that ${C.listText(open.map((s) => q(s.claim.title)))} ${open.length > 1 ? 'remain' : 'remains'} an open question.`);
    if (no.length) parts.push(`They think ${C.listText(no.map((s) => q(s.claim.title)))} ${no.length > 1 ? 'are' : 'is'} unlikely.`);
    if (!parts.length) return 'Not enough assessors have rated these claims yet to draw conclusions.';
    return parts.join(' ');
  };

  C.relationText = function (mine, st) {
    const d = mine - st.postMed;
    if (Math.abs(d) < 3) return 'close to the panel';
    return d > 0 ? 'more convinced than the panel' : 'more sceptical than the panel';
  };

  C.linkChips = function (p) {
    if (p.kind === 'sample') {
      return `<div class="links">${(p.sampleLinks || [])
        .map((l) => `<span class="link-chip is-sample" title="Sample profile: this link is a placeholder">${esc(l)}</span>`)
        .join('')}</div><p class="fine">Sample profile: in a live panel these link to the assessor’s ORCID, publications and social profiles.</p>`;
    }
    const L = p.links || {};
    const out = [];
    if (L.orcid) out.push(['ORCID', 'https://orcid.org/' + L.orcid]);
    if (L.bluesky) out.push(['Bluesky', 'https://bsky.app/profile/' + L.bluesky.replace(/^@/, '')]);
    if (L.scholar) out.push(['Google Scholar', L.scholar]);
    if (L.website) out.push(['Website', L.website]);
    if (!out.length) return `<p class="fine">No links added yet.</p>`;
    return `<div class="links">${out
      .map(([l, u]) => `<a class="link-chip" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`)
      .join('')}</div>`;
  };
})();

/*
 * Credence — the assessment form. A modal that asks one thing at a time:
 * starting belief → each piece of evidence → review and submit.
 * Answers save as you go, so closing the form never loses work.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const S = C.state;

  let W = null; // { cid, step, root, lastFocus }

  function steps(claim) {
    return ['prior', ...claim.evidence.map((e) => e.id), 'review'];
  }

  function stepAnswered(claim, key) {
    const r = S.me.ratings[claim.id];
    if (key === 'prior') return !!(r && r.prior != null);
    if (key === 'review') return false;
    const x = r && r.ev && r.ev[key];
    return !!(x && (x.s != null || x.skipped));
  }

  function cumulativeBefore(claim, uptoIdx) {
    const r = S.me.ratings[claim.id];
    if (!r || r.prior == null) return null;
    let v = r.prior;
    claim.evidence.slice(0, uptoIdx).forEach((e) => {
      const x = r.ev && r.ev[e.id];
      if (x && x.s != null) v += x.s * (x.t != null ? x.t : 1);
    });
    return v;
  }

  C.openWizard = function (cid, startKey) {
    const claim = C.claim(cid);
    if (!claim) return;
    C.myRating(cid, true);
    const list = steps(claim);
    let step = 0;
    if (startKey) step = Math.max(0, list.indexOf(startKey));
    else {
      const firstOpen = list.findIndex((k) => k !== 'review' && !stepAnswered(claim, k));
      step = firstOpen === -1 ? list.length - 1 : firstOpen;
    }
    const host = document.getElementById('modal-root');
    W = { cid, step, lastFocus: document.activeElement };
    host.innerHTML = `<div class="wiz-back"><div class="wiz" role="dialog" aria-modal="true" aria-labelledby="wiz-title" id="wiz"></div></div>`;
    document.body.classList.add('is-taken-over');
    W.root = host.querySelector('#wiz');
    bind(W.root);
    document.addEventListener('keydown', onKey);
    render();
  };

  function close() {
    document.removeEventListener('keydown', onKey);
    document.getElementById('modal-root').innerHTML = '';
    document.body.classList.remove('is-taken-over');
    const back = W && W.lastFocus;
    W = null;
    C.save();
    C.rerender();
    if (back && back.focus && document.body.contains(back)) back.focus();
  }

  function onKey(e) {
    if (!W) return;
    if (e.key === 'Escape') close();
  }

  function render() {
    const claim = C.claim(W.cid);
    const list = steps(claim);
    const key = list[W.step];
    const idx = S.inquiry.claims.indexOf(claim);
    const r = S.me.ratings[claim.id];

    const segs = list
      .map((k, i) => {
        const done = stepAnswered(claim, k);
        const cur = i === W.step;
        const label = k === 'prior' ? 'Starting belief' : k === 'review' ? 'Review' : 'Evidence ' + i;
        return `<button type="button" class="wseg${done ? ' is-done' : ''}${cur ? ' is-cur' : ''}" data-go="${i}" aria-label="${esc(label)}${
          done ? ', answered' : ''
        }"${cur ? ' aria-current="step"' : ''}></button>`;
      })
      .join('');

    let body = '';
    let canNext = stepAnswered(claim, key);
    if (key === 'prior') {
      body = `<h3 class="wq">Before weighing any evidence, how likely is this claim?</h3>
        <p class="step-hint">Your honest starting point from background knowledge. You can come back and change it.</p>
        ${C.credenceHTML(r ? r.prior : null)}`;
    } else if (key === 'review') {
      canNext = r && r.prior != null;
      const answered = claim.evidence.filter((e) => stepAnswered(claim, e.id)).length;
      const rows = claim.evidence
        .map((e, i) => {
          const x = r && r.ev && r.ev[e.id];

          return `<li><span class="rv-title">${esc(e.title)}</span><span class="rv-ans">${esc(txt)}</span><button type="button" class="btn-link" data-go="${i + 1}">Change</button></li>`;
        })
        .join('');
      const res = C.posteriorOf(claim, r);
      body = `<h3 class="wq">Review your assessment</h3>
        <p class="step-hint">${answered} of ${claim.evidence.length} pieces of evidence answered. Check your answers, and the path on the right: where you started, how each finding moved you, where you ended up.</p>
        ${res ? `<div class="rv-fig"><span class="cred-big num">${M.pctDb(res.post)}</span><span><b>${esc(M.verbalDb(res.post))}</b><br><span class="cred-freq">${esc(M.chance(M.toP(res.post)))}</span></span></div>` : ''}
        <ul class="rv-list"><li><span class="rv-title">Starting belief</span><span class="rv-ans">${r && r.prior != null ? M.pctDb(r.prior) : 'Not set'}</span><button type="button" class="btn-link" data-go="0">Change</button></li>${rows}</ul>
        <p class="fine">Once you submit, the panel’s assessments of this claim open to you. You can still edit your answers afterwards.</p>`;
    } else {

      const e = claim.evidence[k];
      const x = r && r.ev && r.ev[e.id];
      body = `${C.evidenceHead(e, k)}
        <div class="ev-q">
          <div class="q-label" id="ql-${esc(e.id)}">If this finding holds, what does it do to the claim?</div>
          ${C.scaleHTML(e, x)}
          <p class="readout">${C.readoutHTML(x)}</p>
        </div>
        <div class="ev-q">
          <div class="q-label" id="qt-${esc(e.id)}">How far do you trust the finding itself?</div>
          ${C.trustHTML(e, x)}
        </div>
        <details class="ev-note"${x && x.note ? ' open' : ''}><summary>Add a note for the panel</summary>
          <textarea class="field" data-note="${esc(e.id)}" rows="2" placeholder="Why? What would change your mind?">${esc((x && x.note) || '')}</textarea></details>`;
    }

    const isReview = key === 'review';
    const isEv = key !== 'prior' && !isReview;
    W.root.innerHTML = `
      <header class="wiz-head"><div class="wiz-in">
        <div class="wiz-top"><p class="eyebrow">Claim ${idx + 1} of ${S.inquiry.claims.length} · ${
      isReview ? 'Review' : key === 'prior' ? 'Starting belief' : 'Evidence ' + W.step + ' of ' + claim.evidence.length
    }</p>
          <button type="button" class="btn-ghost sm" data-wact="close">Save and close ×</button></div>
        <h2 class="wiz-claim" id="wiz-title">${esc(claim.title)}</h2>
        ${claim.statement && key === 'prior' ? `<p class="claim-statement">${esc(claim.statement)}</p>` : ''}
        <div class="wprog">${segs}</div>
      </div></header>
      <div class="wiz-body" id="wiz-body"><div class="wiz-cols">
        <div class="wiz-main">${body}</div>
        <aside class="wiz-side" aria-label="Your belief path"><div class="wiz-side-in">
          <h3 class="sub-h">Your belief path</h3>
          <p class="fine">Updates as you answer. Read from top to bottom: where you started, how each finding moves you, where you end up.</p>
          <div class="path-chart" id="wiz-path"></div>
          <div class="legend"><span class="lg"><i class="lg-for"></i>Supports</span><span class="lg"><i class="lg-against"></i>Opposes</span></div>
        </div></aside>
      </div></div>
      <footer class="wiz-foot"><div class="wiz-in wiz-foot-in">
        <button type="button" class="btn-ghost" data-wact="back"${W.step === 0 ? ' disabled' : ''}>← Back</button>
        <span class="wiz-spacer"></span>
        ${isEv ? `<button type="button" class="btn-link" data-wact="skip">Skip: outside my expertise</button>` : ''}
        ${
          isReview
            ? `<button type="button" class="btn" data-wact="submit"${canNext ? '' : ' disabled'}>${C.isComplete(claim.id) ? 'Save changes' : 'Submit assessment'}</button>`
            : `<button type="button" class="btn" data-wact="next"${canNext ? '' : ' disabled'}>${W.step === list.length - 2 ? 'Review →' : 'Next →'}</button>`
        }
      </div></footer>`;
    drawCharts();
    const body$ = W.root.querySelector('#wiz-body');
    body$.scrollTop = 0;
  }

  function drawCharts() {
    const claim = C.claim(W.cid);
    const key = steps(claim)[W.step];
    const el = W.root.querySelector('#wiz-path');
    if (el) C.charts.beliefPath(el, claim, S.me.ratings[claim.id], null, { hot: key, pending: 'to weigh' });
  }

  function refreshStep(focusSel) {
    render();
    if (focusSel) {
      const el = W.root.querySelector(focusSel);
      if (el) el.focus();
    }
  }

  function updateFooterOnly() {
    const claim = C.claim(W.cid);
    const key = steps(claim)[W.step];
    const next = W.root.querySelector('[data-wact="next"]');
    if (next) next.disabled = !stepAnswered(claim, key);
    W.root.querySelectorAll('.wseg').forEach((b, i) => b.classList.toggle('is-done', stepAnswered(claim, steps(claim)[i])));
  }

  let priorTimer = null;
  function bind(root) {
    root.addEventListener('click', (ev) => {
      const t = ev.target.closest('button');
      if (!t || !W) return;
      const claim = C.claim(W.cid);
      const list = steps(claim);
      const r = C.myRating(claim.id, true);
      if (t.dataset.go != null) {
        W.step = +t.dataset.go;
        render();
        return;
      }
      if (t.dataset.p) {
        const v = M.toDb(+t.dataset.p);
        r.prior = Math.round(v * 2) / 2;
        root.querySelector('#prior-range').value = r.prior;
        C.updateCredenceReadout(root, r.prior);
        updateFooterOnly();
        C.save();
        return;
      }
      if (t.dataset.s != null && t.dataset.ev) {
        const cur = r.ev[t.dataset.ev] || {};
        r.ev[t.dataset.ev] = { s: +t.dataset.s, t: cur.t != null ? cur.t : 0.67, note: cur.note };
        C.save();
        refreshStep(`[data-s="${t.dataset.s}"]`);
        return;
      }
      if (t.dataset.t != null && t.dataset.ev) {
        const cur = r.ev[t.dataset.ev];
        if (!cur || cur.s == null) return;
        cur.t = +t.dataset.t;
        C.save();
        refreshStep(`[data-t="${t.dataset.t}"]`);
        return;
      }
      const act = t.dataset.wact;
      if (act === 'close') close();
      else if (act === 'back' && W.step > 0) {
        W.step--;
        render();
      } else if (act === 'next' && W.step < list.length - 1) {
        W.step++;
        render();
      } else if (act === 'skip') {
        const key = list[W.step];
        const cur = r.ev[key] || {};
        r.ev[key] = { skipped: true, note: cur.note };
        C.save();
        W.step++;
        render();
      } else if (act === 'submit') {
        const first = !r.done;
        r.done = true;
        r.submittedAt = new Date().toISOString();
        C.save();
        const cid = W.cid;
        document.removeEventListener('keydown', onKey);
        document.getElementById('modal-root').innerHTML = '';
        document.body.classList.remove('is-taken-over');
        W = null;
        if (location.hash !== '#claim-' + cid) location.hash = 'claim-' + cid;
        else C.rerender();
        C.toast(first ? 'Assessment submitted. The panel’s views of this claim are now open to you.' : 'Changes saved.');
        setTimeout(() => {
          const el = document.getElementById('you-vs-panel');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 120);
      }
    });

    root.addEventListener('input', (ev) => {
      if (!W) return;
      const t = ev.target;
      const claim = C.claim(W.cid);
      const r = C.myRating(claim.id, true);
      if (t.id === 'prior-range') {
        r.prior = Math.round(+t.value * 2) / 2;
        C.updateCredenceReadout(root, r.prior);
        clearTimeout(priorTimer);
        priorTimer = setTimeout(() => {
          updateFooterOnly();
          C.save();
        }, 120);
      } else if (t.dataset.note) {
        const cur = r.ev[t.dataset.note] || {};
        r.ev[t.dataset.note] = { ...cur, note: t.value };
        C.save();
      }
    });
    root.addEventListener('change', (ev) => {
      if (!W || ev.target.id !== 'prior-range') return;
      const r = C.myRating(W.cid, true);
      r.prior = Math.round(+ev.target.value * 2) / 2;
      C.updateCredenceReadout(root, r.prior);
      updateFooterOnly();
      C.save();
    });
  }
})();

            `<tr><td><a href="#claim-${esc(s.claim.id)}">${esc(s.claim.title)}</a></td><td class="num">${s.n}</td><td class="num">${s.n ? M.pctDb(s.priorMed) : '—'}</td><td class="num">${
              s.n ? M.pctDb(s.postMed) : '—'
            }</td><td class="num">${s.n ? M.pctDb(s.postQ1) + '–' + M.pctDb(s.postQ3) : '—'}</td><td>${esc(C.STATUS[s.status].label)}</td><td>${esc(
              s.status.startsWith('settled') && s.repl ? 'Fund a replication' : C.STATUS[s.status].action
            )}</td></tr>`
        )
        .join('')}</tbody></table></div>`;

    return `<section class="r-intro">
        <p class="eyebrow">Report for funders</p>
        <h2 class="r-title">What ${nPeople} assessor${nPeople === 1 ? '' : 's'} concluded from ${nEv} pieces of evidence</h2>
        <p class="r-lede">${C.ledeText(all)}</p>
        <div class="r-tools"><button class="btn-ghost sm" data-act="copy-summary">Copy summary as text</button></div>
      </section>
      <section class="r-sec">
        <div class="r-sec-head"><h3>Where funding would change minds</h3>
          <p>Money changes the most minds where experts disagree, where an important finding is doubted, or where everyone agrees the question is open. Claims with a consensus gain little from more of the same.</p></div>
        <div class="r-fund-grid">
          <div><div class="r-map" id="r-map"></div>
            <ol class="map-key">${all.map((s, i) => `<li><a href="#claim-${esc(s.claim.id)}"><span class="mk-num">${i + 1}</span>${esc(s.claim.title)}</a></li>`).join('')}</ol></div>
          <div>
            ${opps.length ? `<ol class="opps" aria-label="Funding opportunities, most promising first">${opps.slice(0, 5).map(oppHTML).join('')}</ol>` : '<p class="step-hint">No clear opportunities yet: every claim either has a consensus or too few assessors.</p>'}
            ${
              settled.length
                ? `<p class="low-pri" style="margin-top:10px"><b>Lower priority:</b> ${C.listText(settled.map((s) => C.quote(s.claim.title)))} ${
                    settled.length > 1 ? 'have' : 'has'
                  } a clear consensus. Fund further work there only if it could overturn it.</p>`
                : ''
            }
          </div>
        </div>
      </section>
      <section class="r-sec">
        <div class="r-sec-head"><h3>The numbers</h3><p>Medians and the middle half of the panel, before and after weighing the evidence.</p></div>
        ${table}
      </section>`;
  }

  function oppHTML(o) {
    const s = o.stats;
    const t = s.claim.title;
    const lc = t.charAt(0).toLowerCase() + t.slice(1);
    let kind;
    let title;
    let body;
    if (o.type === 'settle') {
      kind = 'Settle a disagreement';
      title = `Resolve whether ${lc}`;
      body = `The middle half of the panel ranges from ${M.pctDb(s.postQ1)} to ${M.pctDb(s.postQ3)}. ${
        o.ev ? `They disagree most about ${C.quote(o.ev.e.title)}. A study that settles it would move the most minds.` : 'A decisive study would move the most minds.'
      }`;
    } else if (o.type === 'replicate') {
      kind = 'Replicate';
      title = o.ev.e.title;
      body = `If this held up, the panel would count it as ${esc(M.strengthLabel(o.ev.sMed).toLowerCase())}. They trust it “${esc(
        M.trustLabel(o.ev.tMed).toLowerCase()
      )}”, so today it barely counts. An independent replication would show whether it should.`;
    } else {
      kind = 'Explore';
      title = `Explore whether ${lc}`;
      body = `The panel agrees this is unresolved (median ${M.pctDb(s.postMed)}), and no finding yet counts strongly either way. Good ground for curiosity-led work.`;
    }
    const num = S.inquiry.claims.indexOf(s.claim) + 1;
    return `<li class="opp opp-${o.type}"><span class="opp-kind"><span class="opp-claim">Claim ${num}</span>${esc(kind)}</span><h4 class="opp-title">${esc(title)}</h4><p class="opp-body">${body}</p>
      <a class="opp-link" href="#claim-${esc(s.claim.id)}">See the evidence →</a></li>`;
  }

  views.question = function (main, tab) {
    tab = tab || 'claims';
    let body;
    if (tab === 'panel') body = panelTab();
    else if (tab === 'report') body = reportTab();
    else body = claimsTab();
    main.innerHTML = `<div class="page">${header(tab)}<div class="tab-body">${body}</div></div>`;

    document.querySelectorAll('[data-strip]').forEach((el) => {
      const c = C.claim(el.dataset.strip);
      if (c) C.charts.strip(el, C.claimStats(c));
    });
    const map = document.getElementById('r-map');
    if (map) C.charts.map(map, S.inquiry.claims.map((c) => C.claimStats(c)), (cid) => (location.hash = 'claim-' + cid));
  };

  /* ---------- plain-text summaries for memos ---------- */
  C.summaryText = function (cid) {
    const claims = cid ? [C.claim(cid)] : S.inquiry.claims;
    const lines = [S.inquiry.title];
    if (C.sampleActive()) lines.push('(Illustrative panel: assessors and ratings are simulated for this prototype.)');
    lines.push('');
    for (const c of claims) {
      const s = C.claimStats(c);
      lines.push('• ' + c.title);
      if (s.n >= 1) {
        lines.push(
          `  Panel median ${M.pctDb(s.postMed)} (${M.verbalDb(s.postMed).toLowerCase()}), middle half ${M.pctDb(s.postQ1)}–${M.pctDb(s.postQ3)}, ${s.n} assessors. ${C.STATUS[s.status].label}.`
        );
        if (Math.abs(s.shift) >= 0.8) lines.push(`  Evidence moved the panel from ${M.pctDb(s.priorMed)} to ${M.pctDb(s.postMed)}.`);
        if (s.crux) lines.push(`  Most disputed evidence: ${s.crux.e.title}.`);
        if (s.repl) lines.push(`  Worth replicating: ${s.repl.e.title}.`);
        lines.push(`  Suggested action: ${s.status.startsWith('settled') && s.repl ? 'Fund a replication' : C.STATUS[s.status].action}.`);
      } else lines.push('  No assessments yet.');
      lines.push('');
    }
    return lines.join('\n');
  };
})();

</script>
    <script>
/*
 * Credence — claim page.
 * Experts who have not yet assessed the claim see the evidence and a prompt to assess it.
 * Funders, and experts who have submitted, see the panel's results and every individual assessment.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const S = C.state;
  const views = (C.views = C.views || {});

  function lockedBody(claim) {
    const a = C.answered(claim);
    return `<section class="r-sec cta-card">
        <div class="r-sec-head"><h3>${a.n ? 'Finish your assessment' : 'Assess this claim'}</h3>
        <p>You’ll give a starting belief, then weigh ${claim.evidence.length} pieces of evidence one at a time. It takes about ${Math.max(
      2,
      Math.round((claim.evidence.length + 1) * 0.6)
    )} minutes, and your answers save as you go. The panel’s assessments of this claim open once you submit.</p></div>
        <div class="next-row"><button type="button" class="btn" data-assess="${esc(claim.id)}">${a.n ? `Continue (${a.n} of ${a.total} answered) →` : 'Start assessment →'}</button></div>
      </section>
      <section class="r-sec">
        <div class="r-sec-head"><h3>The evidence</h3><p>Read ahead if you like. You’ll weigh each finding in the assessment.</p></div>
        <ol class="ev-preview">${claim.evidence.map((e, k) => `<li class="ev">${C.evidenceHead(e, k)}</li>`).join('')}</ol>
        <button type="button" class="btn-dashed" data-act="add-ev">+ Add a piece of evidence</button>
      </section>
      <section class="r-sec locked-sec"><div class="locked"><span class="lock-ico" aria-hidden="true">🔒</span>
        <p><b>Panel results are hidden.</b> They open when you submit, so other people’s views can’t anchor yours.</p></div></section>`;
  }

  function compareSection(claim, s) {
    const mineRes = C.posteriorOf(claim, S.me.ratings[claim.id]);
    if (!mineRes) return '';
    const others = C.claimStats(claim, { includeMe: false });
    let rank = '';
    if (others.n) {
      const below = others.rows.filter((r) => r.post < mineRes.post - 0.25).length;
      const above = others.rows.filter((r) => r.post > mineRes.post + 0.25).length;
      if (above > below) rank = `You are more sceptical than ${above} of ${others.n} other assessors.`;
      else if (below > above) rank = `You are more convinced than ${below} of ${others.n} other assessors.`;
      else rank = 'You sit in the middle of the panel.';
    }
    const diffs = others.ev
      .filter((v) => v.mine && v.n >= 3)
      .map((v) => ({ v, d: v.mine.impact - v.impMed }))
      .filter((x) => Math.abs(x.d) >= 2)
      .sort((a, b) => Math.abs(b.d) - Math.abs(a.d))
      .slice(0, 3);
    return `<section class="r-sec" id="you-vs-panel">
      <div class="r-sec-head"><h3>You and the panel</h3><p>Where you ended up, how you got there, and where your weighting differs most from everyone else’s.</p></div>
      <div class="yvp">
        <div class="yvp-main">
          <div class="cmp-figs">
            <div class="cmp-fig"><span>You</span><b>${M.pctDb(mineRes.post)}</b><em>${esc(M.verbalDb(mineRes.post))}</em></div>
            <div class="cmp-fig"><span>Panel median</span><b>${others.n ? M.pctDb(others.postMed) : '—'}</b><em>${others.n ? esc(M.verbalDb(others.postMed)) : 'No other assessors yet'}</em></div>
          </div>
          ${rank ? `<p>${esc(rank)}</p>` : ''}
          <div id="yvp-strip"></div>
          <div class="legend"><span class="lg"><i class="lg-dot"></i>One assessor</span><span class="lg"><i class="lg-band"></i>Middle half</span><span class="lg"><i class="lg-med"></i>Median</span><span class="lg"><i class="lg-me"></i>You</span></div>
          <h4 class="sub-h">Where you differ most</h4>
          ${
            diffs.length
              ? `<ul class="diffs">${diffs
                  .map(
                    (x) =>
                      `<li><span class="d-title">${esc(x.v.e.title)}</span><span class="d-vs">You: ${esc(M.strengthLabel(x.v.mine.impact))} · Panel: ${esc(
                        M.strengthLabel(x.v.impMed)
                      )}</span></li>`
                  )
                  .join('')}</ul>`
              : '<p class="step-hint">You weighed every piece of evidence much as the panel did.</p>'
          }
          <div class="next-row"><button type="button" class="btn-ghost sm" data-assess="${esc(claim.id)}" data-step="review">Edit your assessment</button>${nextClaimButton(claim)}</div>
        </div>
        <div class="yvp-path"><h4 class="sub-h">Your belief path</h4><p class="fine">Grey shows the panel’s median path.</p><div class="path-chart" id="yvp-path"></div></div>
      </div>
    </section>`;
  }

  function nextClaimButton(claim) {
    const claims = S.inquiry.claims;
    const next = claims.find((c) => !C.isComplete(c.id));
    if (!next) return `<a class="btn sm" href="#question">All claims assessed: back to the question</a>`;
    return `<button type="button" class="btn sm" data-assess="${esc(next.id)}">Next: assess claim ${claims.indexOf(next) + 1} →</button>`;
  }

  function assessmentsSection(claim, s) {
    const rows = [...s.rows].sort((a, b) => (b.isMe ? 1 : 0) - (a.isMe ? 1 : 0) || b.post - a.post);
    const people = C.people(true);
    const items = rows
      .map((r) => {
        const p = people.find((x) => x.id === r.id) || r;
        const rt = (p.ratings && p.ratings[claim.id]) || {};
        const notes = claim.evidence.filter((e) => rt.ev && rt.ev[e.id] && rt.ev[e.id].note).length;
        const ev = claim.evidence
          .map((e) => {
            const x = rt.ev && rt.ev[e.id];
            if (!x) return `<tr><td>${esc(e.title)}</td><td colspan="2" class="mute">Not rated</td></tr>`;
            if (x.skipped || x.s == null) return `<tr><td>${esc(e.title)}</td><td colspan="2" class="mute">Skipped: outside their expertise</td></tr>`;
            const t = x.t != null ? x.t : 1;
            return `<tr><td>${esc(e.title)}${x.note ? `<p class="as-note">“${esc(x.note)}”</p>` : ''}</td><td>${esc(M.strengthLabel(x.s))}</td><td>${esc(M.trustLabel(t))}</td></tr>`;
          })
          .join('');
        return `<li><details class="as-item${r.isMe ? ' is-me' : ''}">
          <summary>${C.avatar(p)}
            <span class="as-who"><span class="as-name">${esc(C.displayName(p))}</span><span class="as-sub">${esc(p.discipline || '')}</span></span>
            <span class="as-path num">${M.pctDb(r.prior)} → <b>${M.pctDb(r.post)}</b></span>
            <span class="as-rel">${esc(C.relationText(r.post, s))}</span>
            <span class="as-notes">${notes ? notes + (notes === 1 ? ' note' : ' notes') : ''}</span>
          </summary>
          <div class="as-body">
            <div class="tbl-wrap"><table><thead><tr><th>Evidence</th><th>Weighed as (if true)</th><th>Trust</th></tr></thead><tbody>${ev}</tbody></table></div>
            <a class="btn-link" href="#assessor-${esc(p.id)}">View ${esc(p.isMe ? 'your' : p.name + '’s')} profile →</a>
          </div>
        </details></li>`;
      })
      .join('');
    return `<section class="r-sec" id="assessments">
      <div class="r-sec-head"><h3>Individual assessments</h3><p>Every submitted assessment of this claim, most convinced first. Open one to see how that assessor weighed each finding, with their notes.</p></div>
      <ul class="as-list">${items || '<li class="step-hint">No assessments yet.</li>'}</ul>
    </section>`;
  }

  function unlockedBody(claim) {
    const s = C.claimStats(claim);
    const funder = C.isFunder();
    const narrowed = s.postIqr < s.priorIqr - 1;
    const widened = s.postIqr > s.priorIqr + 1;

    let sentence = 'Too few assessors have rated this claim to summarise it.';
    if (s.n >= 3) {
      sentence = `The panel thinks this is ${esc(M.verbalDb(s.postMed).toLowerCase())} (median ${M.pctDb(s.postMed)}). `;
      if (Math.abs(s.shift) >= 0.8)
        sentence += `Weighing the evidence moved them ${s.shift > 0 ? 'up' : 'down'} from ${M.pctDb(s.priorMed)}${
          narrowed ? ' and brought their views closer together.' : widened ? ', but their views spread further apart.' : '.'
        }`;
      else sentence += 'The evidence barely moved them overall.';
      if (s.status === 'contested') sentence += ' Assessors remain split.';
    }
    let actionBody = '';
    if (s.status === 'contested')
      actionBody = s.crux ? `Experts disagree most about ${C.quote(s.crux.e.title)}. Work that settles it would move the most minds.` : 'A decisive study would move the most minds.';
    else if (s.status === 'open') actionBody = 'The panel agrees this is unresolved. Exploratory, curiosity-led work could move it either way.';
    else if (s.status.startsWith('settled'))
      actionBody = s.repl
        ? `The panel agrees, but ${C.quote(s.repl.e.title)} would matter if it held up. Only a replication is likely to change minds here.`
        : 'More confirmatory work is unlikely to change minds. Fund work here only if it could overturn the consensus.';
    else actionBody = 'Recruit at least three assessors before drawing conclusions.';

    const sorted = [...s.ev].sort((a, b) => Math.abs(b.impMed || 0) - Math.abs(a.impMed || 0));
    const rows = sorted
      .map((v) => {
        const isCrux = s.crux && s.crux.e.id === v.e.id;
        const isRepl = s.repl && s.repl.e.id === v.e.id;
        const src = v.e.source || {};
        return `<div class="imp-row${isCrux ? ' is-crux' : ''}${isRepl ? ' is-repl' : ''}">
          <div class="imp-text"><p class="imp-title">${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(v.e.title)}</a>` : esc(v.e.title)}</p>
            <p class="imp-meta">${v.e.kind ? `<span class="tag">${esc(v.e.kind)}</span>` : ''}${C.statusBadge(v.e.status)}<span>${v.n} rated</span>${
          v.n ? `<span>· trusted “${esc(M.trustLabel(v.tMed).toLowerCase())}”</span>` : ''
        }</p></div>
          <div class="imp-chart" data-imp="${esc(v.e.id)}"></div>
          <div class="imp-word">${v.n ? esc(M.strengthLabel(v.impMed)) : 'Not rated'}${
          v.n && Math.abs(v.sMed - v.impMed) >= 3 ? `<small>${esc(M.strengthLabel(v.sMed))} if fully trusted</small>` : ''
        }${isCrux ? '<span class="flag flag-crux">Most disputed</span>' : ''}${isRepl ? '<span class="flag flag-repl">Replicate</span>' : ''}</div>
        </div>`;
      })
      .join('');

    const callouts = [];
    if (s.crux)
      callouts.push(`<div class="callout c-crux"><h4>Where experts disagree most</h4><p>${C.quote(s.crux.e.title)}. Most assessors weigh it somewhere between ${esc(
        M.strengthLabel(s.crux.impP10).toLowerCase()
      )} and ${esc(M.strengthLabel(s.crux.impP90).toLowerCase())}. Settling this finding would do most to bring the panel together.</p></div>`);
    if (s.repl)
      callouts.push(`<div class="callout c-repl"><h4>Important but doubted</h4><p>${C.quote(s.repl.e.title)} would count as ${esc(
        M.strengthLabel(s.repl.sMed).toLowerCase()
      )} if it held up, but the panel trusts it “${esc(M.trustLabel(s.repl.tMed).toLowerCase())}”. An independent replication would show whether it should count.</p></div>`);
    if (s.n >= 3)
      callouts.push(`<div class="callout c-conv"><h4>${narrowed ? 'Evidence brought the panel together' : widened ? 'Evidence pulled the panel apart' : 'Spread of views'}</h4>
        <p>Before weighing evidence, the middle half of the panel sat between ${M.pctDb(s.priorQ1)} and ${M.pctDb(s.priorQ3)}. Afterwards: ${M.pctDb(s.postQ1)} to ${M.pctDb(s.postQ3)}.</p></div>`);

    return `<section class="r-sec">
        <div class="rd-top">
          <div style="display:grid;gap:12px">
            <div class="rd-num">${
              s.n
                ? `<span class="rc-big num">${M.pctDb(s.postMed)}</span><span class="rd-verbal">${esc(M.verbalDb(s.postMed))} · panel median</span><span class="rd-range">Middle half of the panel: ${M.pctDb(
                    s.postQ1
                  )} to ${M.pctDb(s.postQ3)} · ${esc(C.agreementWord(s.postIqr).toLowerCase())} · ${s.n} assessors</span>`
                : '<span class="rd-verbal">No assessments yet</span>'
            }</div>
            <p class="rd-sentence">${sentence}</p>
          </div>
          ${funder ? `<div class="rd-action">${C.actionChip(s)}<p>${actionBody}</p></div>` : `<div class="rd-action"><span class="pill pill-${C.STATUS[s.status].tone}">${esc(C.STATUS[s.status].label)}</span><p>${actionBody}</p></div>`}
        </div>
      </section>
      ${!funder || C.isComplete(claim.id) ? compareSection(claim, s) : ''}
      <section class="r-sec">
        <div class="r-sec-head"><h3>How the evidence moved the panel</h3>
          <p>Each line is one assessor, from their starting belief (top) to their conclusion after weighing the evidence (bottom). The thick line is the median. Shaded bars show the middle half of the panel.</p></div>
        <div id="rd-slope"></div>
        <div class="legend"><span class="lg"><i class="lg-panel"></i>One assessor</span><span class="lg"><i class="lg-med" style="width:16px;height:3px"></i>Median</span>${
          s.rows.some((r) => r.isMe) ? '<span class="lg"><i class="lg-me"></i>You</span>' : ''
        }</div>
      </section>
      <section class="r-sec">
        <div class="r-sec-head"><h3>What moved the panel</h3>
          <p>Solid bars show how much each finding counts once the panel’s trust in it is applied. Outlines show how much it would count if fully trusted: a big gap marks a finding that matters but is doubted. Whiskers show the middle half of assessors.</p></div>
        <div class="legend"><span class="lg"><i class="lg-fill"></i>Counts as weighed</span><span class="lg"><i class="lg-pot"></i>If fully trusted</span>${
          s.ev.some((v) => v.mine) ? '<span class="lg"><i class="lg-me" style="border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%)"></i>You</span>' : ''
        }</div>
        <div class="imp-list"><div class="imp-head"><div></div><div id="imp-axis"></div><div></div></div>${rows || '<p class="step-hint">No evidence yet.</p>'}</div>
        <button type="button" class="btn-dashed" data-act="add-ev">+ Add a piece of evidence</button>
      </section>
      ${callouts.length ? `<section class="callouts">${callouts.join('')}</section>` : ''}
      ${assessmentsSection(claim, s)}
      <div class="r-tools"><a class="btn-ghost" href="#question">← All claims</a><button class="btn-ghost" data-act="copy-claim" data-claim-id="${esc(claim.id)}">Copy this summary</button></div>`;
  }

  views.claim = function (main, cid) {
    const claim = C.claim(cid);
    if (!claim) {
      location.hash = 'question';
      return;
    }
    const claims = S.inquiry.claims;
    const idx = claims.indexOf(claim);
    const unlocked = C.canSeePanel(claim.id);
    main.innerHTML = `<div class="page">
      ${C.crumbs([{ label: 'Questions', href: '#home' }, { label: S.inquiry.title || 'Question', href: '#question' }, { label: 'Claim ' + (idx + 1) }])}
      <section class="claim-hero">
        <p class="eyebrow">Claim ${idx + 1} of ${claims.length}${C.isComplete(claim.id) ? ' · assessed by you' : ''}</p>
        <h1 class="ov-title">${esc(claim.title)}</h1>
        ${claim.statement ? `<p class="claim-statement">${esc(claim.statement)}</p>` : ''}
        <div class="claim-tools"><span class="fine">${claim.evidence.length} pieces of evidence</span><button class="btn-link" data-act="edit-claim">Edit claim</button><button class="btn-link" data-act="del-claim">Delete claim</button></div>
      </section>
      ${C.sampleNotice()}
      ${unlocked ? unlockedBody(claim) : lockedBody(claim)}
    </div>`;

    if (!unlocked) return;
    const s = C.claimStats(claim);
    const slope = document.getElementById('rd-slope');
    if (slope) C.charts.slope(slope, s);
    const axis = document.getElementById('imp-axis');
    if (axis) C.charts.impactHeader(axis);
    document.querySelectorAll('[data-imp]').forEach((el) => {
      const v = s.ev.find((x) => x.e.id === el.dataset.imp);
      if (v) C.charts.impactRow(el, v);
    });
    const strip = document.getElementById('yvp-strip');
    if (strip) C.charts.strip(strip, s, { compact: true });
    const path = document.getElementById('yvp-path');
    if (path) {
      const others = C.claimStats(claim, { includeMe: false });
      C.charts.beliefPath(path, claim, S.me.ratings[claim.id], others.n ? others : null);
    }
  };
})();

</script>
    <script>
/*
 * Credence — assessor profile, and the form for editing your own.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const S = C.state;
  const views = (C.views = C.views || {});

  views.assessor = function (main, aid) {
    const crumbs = C.crumbs([
      { label: 'Questions', href: '#home' },
      { label: S.inquiry.title || 'Question', href: '#question' },
      { label: 'Panel', href: '#question-panel' },
      { label: 'Profile' },
    ]);
    const isMe = aid === S.me.id;
    if (!C.canSeeProfiles() && !isMe) {
      main.innerHTML = `<div class="page">${crumbs}<div class="empty"><h3>Profiles open after your first assessment</h3>

      return;
    }
    const p = C.assessor(aid);
    if (!p) {
      main.innerHTML = `<div class="page">${crumbs}<div class="empty"><h3>Assessor not found</h3><p>They may have been removed from the panel.</p><a class="btn" href="#question-panel">Back to the panel</a></div></div>`;
      return;
    }

    const claims = S.inquiry.claims;
    const rows = claims
      .map((c, i) => {
        const r = p.ratings && p.ratings[c.id];

          <span class="pa-path num">${M.pctDb(res.prior)} → <b>${M.pctDb(res.post)}</b></span>
          <span class="pa-rel">${st.n ? `Panel ${M.pctDb(st.postMed)} · ${esc(C.relationText(res.post, st).replace(" than the panel", ""))}` : ''}</span>
          <span class="pa-n">${res.n} of ${c.evidence.length} weighed</span>
          ${
            notes.length
              ? `<ul class="pa-notes">${notes.map((e) => `<li><span class="pa-note-ev">${esc(e.title)}</span>“${esc(r.ev[e.id].note)}”</li>`).join('')}</ul>`
              : ''
          }

      })
      .join('');

    main.innerHTML = `<div class="page">
      ${crumbs}
      <section class="r-sec prof">

            <p class="prof-sub">${esc([p.discipline, [p.role, p.affiliation].filter(Boolean).join(', ')].filter(Boolean).join(' · ') || 'No details yet')}</p>

        </div>
        <div class="prof-grid">
          <div class="prose">
            ${p.bio ? `<p>${esc(p.bio)}</p>` : ''}
            ${p.expertise && p.expertise.length ? `<div class="ev-tags">${p.expertise.map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : ''}
            <h4 class="sub-h">Links</h4>
            ${C.linkChips(p)}
          </div>
          <div class="interests ${p.interests ? 'has' : ''}">
            <h4 class="sub-h">Declared interests</h4>
            <p>${p.interests ? esc(p.interests) : 'None declared.'}</p>
            <p class="fine">Funders can weigh an assessor’s views in light of what they declare.</p>
          </div>
        </div>
      </section>
      <section class="r-sec">
        <div class="r-sec-head"><h3>Assessments on this question</h3><p>Starting belief → conclusion for each claim, compared with the panel median.</p></div>
        <ul class="pa-list">${rows}</ul>
      </section>
    </div>`;
  };

  C.editProfile = function () {
    const L = S.me.links || {};
    C.modal({
      title: 'Your profile',
      body: `<p class="step-hint">Funders and fellow assessors see this next to your assessments. Links help them check your expertise.</p>
        <div class="form-grid">
          <div class="form-row"><label for="p-name">Name</label><input class="field" id="p-name" value="${esc(S.me.name)}" autocomplete="name"></div>
          <div class="form-row"><label for="p-disc">Field</label><input class="field" id="p-disc" value="${esc(S.me.discipline)}" placeholder="e.g. Neuropathology"></div>
          <div class="form-row"><label for="p-role">Role</label><input class="field" id="p-role" value="${esc(S.me.role)}" placeholder="e.g. Senior lecturer"></div>
          <div class="form-row"><label for="p-aff">Institution</label><input class="field" id="p-aff" value="${esc(S.me.affiliation)}"></div>
        </div>
        <div class="form-row"><label for="p-bio">One line about your work</label><input class="field" id="p-bio" maxlength="200" value="${esc(S.me.bio)}"></div>
        <div class="form-grid">
          <div class="form-row"><label for="p-orcid">ORCID iD</label><input class="field" id="p-orcid" value="${esc(L.orcid || '')}" placeholder="0000-0000-0000-0000"></div>
          <div class="form-row"><label for="p-bsky">Bluesky handle</label><input class="field" id="p-bsky" value="${esc(L.bluesky || '')}" placeholder="name.bsky.social"></div>
          <div class="form-row"><label for="p-scholar">Google Scholar link</label><input class="field" id="p-scholar" type="url" value="${esc(L.scholar || '')}" placeholder="https://"></div>
          <div class="form-row"><label for="p-web">Website</label><input class="field" id="p-web" type="url" value="${esc(L.website || '')}" placeholder="https://"></div>
        </div>
        <div class="form-row"><label for="p-int">Declared interests</label><textarea class="field" id="p-int" rows="2" placeholder="Funding, employment, consultancy or patents related to this question. Leave empty if none.">${esc(
          S.me.interests
        )}</textarea></div>`,
      actions: [
        { label: 'Cancel' },
        {
          label: 'Save profile',
          primary: true,
          onClick: (el) => {
            const v = (id) => el.querySelector(id).value.trim();
            const orcid = v('#p-orcid').replace(/^https?:\/\/orcid\.org\//i, '');
            if (orcid && !/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/i.test(orcid)) throw new Error('An ORCID iD looks like 0000-0002-1825-0097.');
            for (const [id, label] of [
              ['#p-scholar', 'Google Scholar link'],
              ['#p-web', 'Website'],
            ])
              if (v(id) && !/^https?:\/\//i.test(v(id))) throw new Error(label + ' must start with http:// or https://');
            Object.assign(S.me, {
              name: v('#p-name'),
              discipline: v('#p-disc'),
              role: v('#p-role'),
              affiliation: v('#p-aff'),
              bio: v('#p-bio'),
              interests: v('#p-int'),
              links: { orcid, bluesky: v('#p-bsky').replace(/^@/, ''), scholar: v('#p-scholar'), website: v('#p-web') },
            });
            C.save();
            C.rerender();
            C.toast('Profile saved.');
          },
        },
      ],
    });
  };
})();

/*
 * Credence — Method page: how to read the numbers, how to run it at a jam, and open questions.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const views = (C.views = C.views || {});

  views.method = function (main) {
    const ladder = [0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]
      .map((p) => {
        const db = M.toDb(p);
        return `<tr><td class="num">${M.pct(p)}</td><td>${esc(M.verbal(p))}</td><td>${esc(M.chance(p))}</td><td class="num">${db > 0 ? '+' : ''}${db.toFixed(1)} dB</td></tr>`;
      })
      .join('');
    const steps = M.STEPS.filter((s) => s > 0)
      .map((s) => `<tr><td>${esc(M.strengthWord(s))}</td><td class="num">×${M.factor(s) >= 10 ? Math.round(M.factor(s)) : M.factor(s).toFixed(1)}</td><td class="num">${s} dB</td></tr>`)
      .join('');

    main.innerHTML = `<div class="page method">
      ${C.crumbs([{ label: 'Questions', href: '#home' }, { label: 'Method' }])}
      <section class="r-intro">
        <p class="eyebrow">Method</p>
        <h1 class="r-title">How Credence turns expert judgement into a decision</h1>
        <p class="r-lede">Science doesn’t prove claims; evidence shifts how credible they are. Credence asks experts two simple questions about each claim and each finding, combines their answers with Bayes’ rule, and shows funders where the field stands and where money would change minds.</p>
      </section>

      <section class="r-sec two-col">
        <div class="prose">
          <h3>Two views</h3>
          <p><b>Expert.</b> For each claim, an expert gives a starting belief, then weighs each piece of evidence, one at a time: which way it pushes, how hard, and how far they trust it. Only after submitting do they see how the rest of the panel assessed that claim, and who the other assessors are.</p>
          <p><b>Funder.</b> A funder sees every claim’s panel result, every individual assessment and every assessor’s profile, and a report showing where a study would change the most minds.</p>
        </div>
        <div class="prose">
          <h3>How the numbers combine</h3>
          <p>Evidence multiplies the odds of a claim. Credence keeps score in <b>decibans</b>, Alan Turing’s codebreaking unit: ten times the logarithm of the odds. In decibans, evidence simply adds up.</p>
          <div class="formula">conclusion = starting belief<br>&nbsp;&nbsp;+ Σ (strength if true × trust)</div>
          <p>Trust simplifies the way the existing evidence diagrams weight a premise by its credibility: a finding you trust “mostly” counts for two thirds of its strength.</p>
        </div>
      </section>

      <section class="r-sec two-col">
        <div class="prose">
          <h3>Reading credence</h3>
          <p>Every number comes with words from the IPCC’s calibrated scale and a natural frequency, so nobody has to interpret percentages alone.</p>
          <div class="tbl-wrap"><table><thead><tr><th class="num">Credence</th><th>In words</th><th>As a frequency</th><th class="num">Decibans</th></tr></thead><tbody>${ladder}</tbody></table></div>
        </div>
        <div class="prose">
          <h3>Strength of evidence</h3>
          <p>Experts pick a band, not a number. Each band multiplies the odds by roughly the amount shown; opposition divides them.</p>
          <div class="tbl-wrap"><table><thead><tr><th>Band</th><th class="num">Odds ×</th><th class="num">Decibans</th></tr></thead><tbody>${steps}</tbody></table></div>
        </div>
      </section>

      <section class="r-sec prose" style="max-width:none">
        <h3>How the panel is summarised</h3>
        <ul>
          <li><b>Median</b>: half the panel is above, half below. Robust to one extreme assessor.</li>
          <li><b>Middle half</b>: the range holding the central 50% of assessors. Its width measures disagreement.</li>
          <li><b>Split</b>: the middle half is wider than 20%–80% (12 dB). <b>Mixed</b>: 5–12 dB. <b>Broad agreement</b>: under 5 dB.</li>
          <li><b>Open question</b>: assessors agree, and the median sits between 25% and 75%.</li>
          <li><b>Most disputed evidence</b>: the finding whose weighting varies most across assessors. Settling it would do most to close the gap.</li>
          <li><b>Worth replicating</b>: a finding the panel would count as at least moderate if true, but whose median trust is “doubtful” or lower.</li>
        </ul>
      </section>

      <section class="r-sec two-col">
        <div class="prose">
          <h3>Design choices</h3>
          <ul>
            <li><b>Blind first, then compare.</b> An expert sees the panel’s view of a claim, and the assessors’ profiles, only after committing their own assessment.</li>
            <li><b>One thing at a time.</b> The assessment asks for one judgement per screen, with a meter showing how each answer moves you.</li>
            <li><b>One point, not a range.</b> Each assessor gives a single answer. Uncertainty shows up as disagreement across the panel, where it is easiest to read.</li>
            <li><b>Words before decibans.</b> The maths stays underneath; the interface speaks in percentages, frequencies and plain labels.</li>
            <li><b>Colour-blind safe.</b> Blue supports and orange opposes, instead of green and red. Every colour also has a label.</li>
          </ul>
        </div>
        <div class="prose">
          <h3>Running it at a science jam</h3>
          <ol>
            <li>A team writes its question, claims and evidence (start a new question from the home page, or import one from Data).</li>
            <li>Turn off the illustrative panel in Data so only real assessments count.</li>
            <li>Each expert completes their profile, assesses each claim on their own device, then uses <b>Export my ratings</b> and sends the file to the facilitator.</li>
            <li>The facilitator imports every file. Claims, panel and report update with the real panel.</li>
            <li>Discuss the most disputed evidence first: it is where minds are most likely to move.</li>
          </ol>
        </div>
      </section>

      <section class="r-sec prose" style="max-width:none">
        <h3>Open questions for the Bycelium team</h3>
        <ul>
          <li><b>Who should add claims and evidence?</b> In this prototype both experts and funders can. Options include experts only, a question’s organiser, or anyone with a moderation step.</li>
          <li><b>When should the panel open to an expert?</b> Here it opens claim by claim, after each assessment. It could instead open only once every claim is assessed.</li>
          <li><b>How are profiles verified?</b> Signing in with ORCID would confirm identity and pull publications automatically.</li>
          <li><b>Named or anonymous?</b> Should funders see who said what, or disciplines only?</li>
          <li><b>Scoring.</b> Should the jam show contribution, expertise or inquiry scores, or is the panel view enough for a first test?</li>
        </ul>
      </section>

      <section class="r-sec prose" style="max-width:none">
        <h3>Limits of this prototype</h3>
        <ul>
          <li>The 20 assessors in the sample, their profiles and their ratings are fictional. The studies cited are real.</li>
          <li>Ratings live in this browser and move between people as files. A shared live panel would need a small backend.</li>
          <li>Trust is applied as a simple weight. A full model would treat each premise as a claim with its own credence, as the existing evidence diagrams do.</li>
        </ul>
      </section>
    </div>`;
  };
})();

</script>

 * Credence — app shell: persona switch, routing, modal, tooltip, toast,

 */
(function () {
  const C = (window.C = window.C || {});
  const esc = C.esc;
  const S = C.state;
  const main = document.getElementById('main');

  C.ui = { route: 'home', claimId: null };

  /* ---------- persona ---------- */
  function syncPersona() {
    const p = S.settings.persona;
    document.querySelectorAll('.persona-switch [data-persona]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.persona === p)));
    document.body.dataset.viewAs = p;
  }
  C.setPersona = function (p) {
    if (p !== 'expert' && p !== 'funder') return;
    S.settings.persona = p;
    C.save();
    syncPersona();
    // the report is for funders: send experts back to the claims
    if (p === 'expert' && location.hash === '#question-report') location.hash = 'question';
    else route();
    C.toast(p === 'funder' ? 'Funder view: panel results, profiles and the report are open.' : 'Expert view: assess claims; each claim’s panel opens after you submit.');
  };

  /* ---------- routing ---------- */
  function route() {
    let h = (location.hash || '#home').slice(1);
    // links from the first version of the prototype
    if (h === 'assess') h = 'question';
    else if (h === 'report') h = 'question-report';
    else if (h.startsWith('report-')) h = 'claim-' + h.slice(7);

    syncPersona();
    hideTip();
    let nav = 'home';
    if (h === 'question' || h === 'question-panel' || h === 'question-report') {
      C.views.question(main, h === 'question' ? 'claims' : h.slice(9));
      nav = 'question';
    } else if (h.startsWith('claim-')) {
      C.ui.claimId = h.slice(6);
      C.views.claim(main, C.ui.claimId);
      nav = 'question';
    } else if (h.startsWith('assessor-')) {
      C.views.assessor(main, h.slice(9));
      nav = 'question';
    } else if (h === 'method') {
      C.views.method(main);
      nav = 'method';
    } else {
      C.views.home(main);
    }
    document.querySelectorAll('.top-link').forEach((a) => {
      if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    if (C.ui.route !== h) window.scrollTo(0, 0);
    C.ui.route = h;
  }
  C.rerender = route;
  window.addEventListener('hashchange', route);

  let resizeTimer = null;
  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (Math.abs(window.innerWidth - lastW) < 8) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(route, 160);
  });

  /* ---------- tooltip ---------- */
  const tip = document.getElementById('tooltip');
  function hideTip() {
    tip.hidden = true;
  }
  document.addEventListener('mousemove', (ev) => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (!t) return hideTip();
    tip.innerHTML = t.getAttribute('data-tip');
    tip.hidden = false;
    const pad = 14;
    const r = tip.getBoundingClientRect();
    let x = ev.clientX + pad;
    let y = ev.clientY + pad;
    if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  });
  document.addEventListener('scroll', hideTip, { passive: true });

  /* ---------- toast ---------- */
  let toastTimer = null;
  C.toast = function (msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.hidden = true), 3400);
  };

  C.copyText = function (text, okMsg) {
    const fallback = () => C.showText('Copy this text', text);

      navigator.clipboard.writeText(text).then(() => C.toast(okMsg || 'Copied.'), fallback);
    } catch (e) {
      fallback();
    }
  };

  /* ---------- modal ---------- */
  const modalRoot = document.getElementById('modal-root');
  C.modal = function (opts) {
    const lastFocus = document.activeElement;
    modalRoot.innerHTML = `<div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">${esc(opts.title)}</h2>
        <div class="modal-body">${opts.body}</div>
        <p class="err" id="modal-err" hidden></p>
        <div class="modal-actions">${(opts.actions || [])
          .map((a, i) => `<button type="button" class="${a.primary ? 'btn' : 'btn-ghost'}" data-mact="${i}">${esc(a.label)}</button>`)
          .join('')}</div>
      </div></div>`;
    const back = modalRoot.firstElementChild;
    const close = () => {
      modalRoot.innerHTML = '';
      document.removeEventListener('keydown', onKey);
      if (lastFocus && lastFocus.focus && document.body.contains(lastFocus)) lastFocus.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
    };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', (e) => {
      if (e.target === back) return close();
      const b = e.target.closest('[data-mact]');
      if (!b) return;
      const a = opts.actions[+b.dataset.mact];
      if (!a.onClick) return close();
      try {
        const keep = a.onClick(back);
        if (keep !== true && modalRoot.firstElementChild === back) close();
      } catch (err) {
        const el = back.querySelector('#modal-err');
        el.textContent = err.message;
        el.hidden = false;
      }
    });
    if (opts.onOpen) opts.onOpen(back);
    const first = back.querySelector('input, textarea, select, button');
    if (first) first.focus();
    return { close, el: back };

  C.showText = function (title, text) {
    C.modal({

  /* ---------- editors ---------- */
  const KINDS = ['Clinical trial', 'Cohort', 'Observational', 'Natural experiment', 'Meta-analysis', 'Genetics', 'Imaging', 'Pathology', 'Lab / animal', 'Review', 'Methods', 'Other'];

  C.editClaim = function (claim) {

        claim ? claim.title : ''
      )}" placeholder="e.g. Compound X slows disease Y in humans"></div>

          claim ? claim.statement : ''
        )}</textarea></div>
        ${isNew ? '<p class="fine">Who should be able to add claims is still an open question for the Bycelium team. In this prototype, experts and funders both can.</p>' : ''}`,
      actions: [
        { label: 'Cancel' },
        {
          label: isNew ? 'Add claim' : 'Save',
          primary: true,
          onClick: (el) => {
            const title = el.querySelector('#f-title').value.trim();
            if (!title) throw new Error('Write the claim first.');

              claim.title = title;
              claim.statement = statement;
              C.save();
              route();
            }
          },
        },
      ],
