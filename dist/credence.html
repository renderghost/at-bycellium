    svg += `</svg>`;
    el.innerHTML = svg;
    if (onPick) {
      el.querySelectorAll('.m-pt').forEach((g) => {
        g.addEventListener('click', () => onPick(g.dataset.claim));
        g.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            onPick(g.dataset.claim);
          }
        });
      });
    }
  };

  /* ------------------------------------------------------------------
   * Slopegraph: each assessor's start → conclusion.
   * ------------------------------------------------------------------ */
  C_.slope = function (el, st) {
    const W = Math.max(280, el.clientWidth || 520);
    const padL = 12;
    const padR = 12;
    const H = 232;
    const yA = 44;
    const yB = 178;
    const x = scaleX(padL, W - padL - padR);
    useTicks(W - padL - padR);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="How each assessor moved from starting belief to conclusion">`;
    svg += `<text x="${padL}" y="14" class="g-cap strong">Before weighing evidence</text>`;
    svg += `<text x="${padL}" y="${H - 4}" class="g-cap strong">After weighing evidence</text>`;
    for (const p of TICKS) {
      const xx = r1(x(M.toDb(p)));
      svg += `<line x1="${xx}" x2="${xx}" y1="${yA}" y2="${yB}" class="${p === 0.5 ? 'g-mid' : 'g-line'}"/>`;
      svg += `<text x="${xx}" y="${yA - 14}" class="g-tick" text-anchor="middle">${tickLabel(p)}</text>`;
      svg += `<text x="${xx}" y="${yB + 22}" class="g-tick" text-anchor="middle">${tickLabel(p)}</text>`;
    }
    if (st.n >= 2) {
      svg += `<rect x="${r1(x(st.priorQ1))}" y="${yA - 7}" width="${r1(Math.max(2, x(st.priorQ3) - x(st.priorQ1)))}" height="14" rx="7" class="s-band"/>`;
      svg += `<rect x="${r1(x(st.postQ1))}" y="${yB - 7}" width="${r1(Math.max(2, x(st.postQ3) - x(st.postQ1)))}" height="14" rx="7" class="s-band"/>`;
    }
    const rows = [...st.rows].sort((a, b) => (a.isMe ? 1 : 0) - (b.isMe ? 1 : 0));
    for (const r of rows) {
      const tip = `<b>${esc(r.name)}</b>${r.discipline ? ' · ' + esc(r.discipline) : ''}<br>${M.pctDb(r.prior)} → ${M.pctDb(r.post)}`;
      svg += `<g data-tip="${esc(tip)}" class="${r.isMe ? 'sl-me' : 'sl-row'}">`;
      svg += `<line x1="${r1(x(r.prior))}" y1="${yA}" x2="${r1(x(r.post))}" y2="${yB}"/>`;
      svg += `<circle cx="${r1(x(r.prior))}" cy="${yA}" r="${r.isMe ? 5 : 3.5}"/><circle cx="${r1(x(r.post))}" cy="${yB}" r="${r.isMe ? 5 : 3.5}"/>`;
      svg += `</g>`;
    }
    if (st.n >= 1) {
      svg += `<g class="sl-med"><line x1="${r1(x(st.priorMed))}" y1="${yA}" x2="${r1(x(st.postMed))}" y2="${yB}"/>`;
      svg += `<circle cx="${r1(x(st.priorMed))}" cy="${yA}" r="6"/><circle cx="${r1(x(st.postMed))}" cy="${yB}" r="6"/></g>`;
    }
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  /* ------------------------------------------------------------------
   * Evidence impact: one row per piece of evidence.
   * Outline = weight if fully trusted; fill = weight as the panel trusts it.
   * ------------------------------------------------------------------ */
  const IMP_D = 25;
  C_.impactScale = function (W) {
    const padL = 8;
    const padR = 8;
    return scaleX(padL, W - padL - padR, IMP_D);
  };

  C_.impactHeader = function (el) {
    const W = Math.max(200, el.clientWidth || 320);
    const x = C_.impactScale(W);
    const H = 34;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`;
    svg += `<text x="8" y="12" class="g-cap">← opposes</text><text x="${W - 8}" y="12" class="g-cap" text-anchor="end">supports →</text>`;
    const marks = [
      [-20, 'Decisive'],
      [-10, 'Strong'],
      [0, 'None'],
      [10, 'Strong'],
      [20, 'Decisive'],
    ];
    for (const [v, l] of marks) svg += `<text x="${r1(x(v))}" y="29" class="g-tick" text-anchor="middle">${l}</text>`;
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  C_.impactRow = function (el, v, opts) {
    opts = opts || {};
    const W = Math.max(200, el.clientWidth || 320);
    const x = C_.impactScale(W);
    const H = 34;
    const yc = 13;
    const x0 = x(0);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(
      v.n ? 'Panel weighs it as ' + M.strengthLabel(v.impMed) : 'Not rated by the panel'
    )}">`;
    for (const g of [-20, -10, -5, 5, 10, 20]) svg += `<line x1="${r1(x(g))}" x2="${r1(x(g))}" y1="0" y2="${H}" class="g-line"/>`;
    svg += `<line x1="${r1(x0)}" x2="${r1(x0)}" y1="0" y2="${H}" class="g-mid"/>`;
    if (v.n) {
      const cls = v.sMed >= 0 ? 'for' : 'against';
      const pa = Math.min(x0, x(v.sMed));
      const pw = Math.abs(x(v.sMed) - x0);
      svg += `<rect x="${r1(pa)}" y="${yc - 7}" width="${r1(Math.max(1, pw))}" height="14" rx="3" class="i-pot i-${cls}"/>`;
      const ia = Math.min(x0, x(v.impMed));
      const iw = Math.abs(x(v.impMed) - x0);
      const icls = v.impMed >= 0 ? 'for' : 'against';
      if (iw >= 1) svg += `<rect x="${r1(ia)}" y="${yc - 7}" width="${r1(iw)}" height="14" rx="3" class="i-fill i-${icls}"/>`;
      if (v.n >= 3) {
        const a = x(v.impQ1);
        const b = x(v.impQ3);
        svg += `<line x1="${r1(a)}" x2="${r1(b)}" y1="${yc + 13}" y2="${yc + 13}" class="i-iqr"/>`;
        svg += `<line x1="${r1(a)}" x2="${r1(a)}" y1="${yc + 9}" y2="${yc + 17}" class="i-iqr"/><line x1="${r1(b)}" x2="${r1(b)}" y1="${yc + 9}" y2="${yc + 17}" class="i-iqr"/>`;
      }
    }
    if (v.mine && opts.showMine !== false) {
      const mx = r1(x(v.mine.impact));
      svg += `<path d="M${mx},${yc - 8} l-5,-6 h10 z" class="i-me"/>`;
    }
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  /* ------------------------------------------------------------------
   * Mini comparison inside an evidence card (after you have rated it).
   * ------------------------------------------------------------------ */
  C_.miniCompare = function (el, v) {
    const W = Math.max(200, el.clientWidth || 300);
    const x = C_.impactScale(W);
    const H = 40;
    const yc = 16;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Your weighting compared with the panel">`;
    svg += `<line x1="${r1(x(0))}" x2="${r1(x(0))}" y1="2" y2="${H - 12}" class="g-mid"/>`;
    for (const g of [-20, -10, 10, 20]) svg += `<line x1="${r1(x(g))}" x2="${r1(x(g))}" y1="2" y2="${H - 12}" class="g-line"/>`;
    if (v.n >= 2) {
      svg += `<rect x="${r1(x(v.impQ1))}" y="${yc - 9}" width="${r1(Math.max(2, x(v.impQ3) - x(v.impQ1)))}" height="18" rx="5" class="s-band"/>`;
    }
    const placed = [];
    for (const imp of [...v.impacts].sort((a, b) => a - b)) {
      const cx = x(imp);
      let cy = yc;
      for (const o of [0, -6, 6, -11, 11]) {
        if (!placed.some((p) => Math.abs(p[0] - cx) < 6.5 && Math.abs(p[1] - (yc + o)) < 6.5)) {
          cy = yc + o;
          break;
        }
      }
      placed.push([cx, cy]);
      svg += `<circle cx="${r1(cx)}" cy="${cy}" r="3.2" class="s-dot"/>`;
    }
    if (v.n) svg += `<line x1="${r1(x(v.impMed))}" x2="${r1(x(v.impMed))}" y1="${yc - 11}" y2="${yc + 11}" class="s-median"/>`;
    if (v.mine) {
      const mx = r1(x(v.mine.impact));
      svg += `<circle cx="${mx}" cy="${yc}" r="5.5" class="s-me"/>`;
    }
    svg += `<text x="8" y="${H - 1}" class="g-tick">opposes</text><text x="${W - 8}" y="${H - 1}" class="g-tick" text-anchor="end">supports</text>`;
    svg += `</svg>`;
    el.innerHTML = svg;
  };
})();

</script>
    <script>
/*
 * Credence — Assess view (for assessors / experts).
 * One claim at a time: starting belief → weigh each piece of evidence → compare with the panel.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const S = C.state;
  const views = (C.views = C.views || {});

  const STATUS_BADGE = {
    Retracted: ['retracted', '✕'],
    Contested: ['contested', '!'],
    Replicated: ['replicated', '✓'],
    'Single study': ['single', '1'],
    Replication: ['replication', '↻'],
  };
  C.statusBadge = function (status) {
    if (!status) return '';
    const b = STATUS_BADGE[status] || ['other', '·'];
    return `<span class="badge badge-${b[0]}"><i aria-hidden="true">${b[1]}</i>${esc(status)}</span>`;
  };

  function progress(claim) {
    const r = S.me.ratings[claim.id];
    let done = r && r.prior != null ? 1 : 0;
    for (const e of claim.evidence) if (r && r.ev && r.ev[e.id] && r.ev[e.id].s != null) done++;
    return { done, total: claim.evidence.length + 1, rated: done - (r && r.prior != null ? 1 : 0) };
  }

  const isRevealed = (cid) => !!S.settings.revealed[cid];

  function maybeAutoReveal(claim) {
    const p = progress(claim);
    if (p.done === p.total && !isRevealed(claim.id)) {
      S.settings.revealed[claim.id] = true;
      C.save();
      return true;
    }
    return false;
  }

  /* ---------- markup ---------- */
  function railHTML(current) {
    const items = S.inquiry.claims
      .map((c, i) => {
        const p = progress(c);
        const res = C.posteriorOf(c, S.me.ratings[c.id]);
        return `<li><button class="claim-btn" data-claim="${esc(c.id)}" aria-current="${c.id === current ? 'true' : 'false'}">
          <span class="cb-num">${i + 1}</span>
          <span class="cb-body"><span class="cb-title">${esc(c.title)}</span>
            <span class="cb-meta"><span class="cb-prog" aria-hidden="true"><i style="width:${Math.round((p.done / p.total) * 100)}%"></i></span>${p.rated} of ${c.evidence.length} weighed</span></span>
          <span class="cb-val">${res ? M.pctDb(res.post) : ''}</span>
        </button></li>`;
      })
      .join('');
    return `<div class="rail-head"><h2 class="rail-title">Claims</h2><button class="btn-link" data-act="add-claim">+ Add claim</button></div>
      <ol class="claim-list">${items}</ol>
      <div class="you-card">
        <label for="me-name">Assessing as</label>
        <input class="field" id="me-name" placeholder="Your name" value="${esc(S.me.name)}" autocomplete="name">
        <input class="field" id="me-disc" placeholder="Your field, e.g. Neuropathology" value="${esc(S.me.discipline)}">
        <button class="btn-ghost sm" data-act="export-mine">Export my ratings</button>
      </div>`;
  }

  function credenceHTML(prior) {
    const unset = prior == null;
    const v = unset ? 0 : prior;
    const p = M.toP(v);
    const ticks = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]
      .map((t) => `<span style="--t:${(M.toDb(t) + M.D) / (2 * M.D)}">${Math.round(t * 100)}%</span>`)
      .join('');
    const presets = [0.01, 0.1, 0.25, 0.5, 0.75, 0.9, 0.99]
      .map((t) => {
        const on = !unset && Math.abs(M.toDb(t) - v) < 0.3;
        return `<button type="button" class="preset${on ? ' is-on' : ''}" data-p="${t}">${Math.round(t * 100)}%</button>`;
      })
      .join('');
    return `<div class="cred${unset ? ' is-unset' : ''}" id="cred">
      <div class="cred-read" aria-live="polite">
        <span class="cred-big num" id="cred-big">${unset ? '—' : M.pct(p)}</span>
        <span class="cred-words"><span class="cred-verbal" id="cred-verbal">${unset ? 'Not set yet' : esc(M.verbal(p))}</span>
        <span class="cred-freq" id="cred-freq">${unset ? 'Drag the slider or pick a value' : esc(M.chance(p))}</span></span>
      </div>
      <div class="cred-track">
        <input type="range" id="prior-range" min="${-M.D}" max="${M.D}" step="0.5" value="${v}" aria-label="Starting belief" aria-valuetext="${unset ? 'Not set' : M.pct(p) + ', ' + M.verbal(p)}">
        <div class="cred-ticks" aria-hidden="true">${ticks}</div>
      </div>
      <div class="presets"><span class="presets-label">Quick pick</span>${presets}</div>
    </div>`;
  }

  function readoutHTML(r) {
    if (!r || r.s == null) return 'Not weighed yet.';
    if (r.s === 0) return '<b>No effect.</b> This finding does not move the claim either way.';
    const t = r.t != null ? r.t : 1;
    const eff = r.s * t;
    let txt = `<b>${esc(M.strengthLabel(r.s))}.</b> If it holds, it ${esc(M.factorText(r.s))}.`;
    if (t < 1) txt += ` Trusted “${esc(M.trustLabel(t))}”, it counts as ${esc(M.strengthLabel(eff).toLowerCase())}.`;
    return txt;
  }

  function scaleHTML(e, r) {
    const sel = r && r.s != null ? r.s : null;
    const segs = M.STEPS.map((s, i) => {
      const dist = Math.abs(i - 6);
      const dir = s > 0 ? 'for' : s < 0 ? 'against' : 'mid';
      const on = sel === s;
      const fill = sel != null && sel !== 0 && Math.sign(s) === Math.sign(sel) && Math.abs(s) <= Math.abs(sel);
      const label = M.strengthLabel(s);
      return `<button type="button" role="radio" aria-checked="${on}" class="seg ${dir} lvl-${dist}${fill ? ' is-fill' : ''}${on ? ' is-on' : ''}" data-s="${s}" data-ev="${esc(
        e.id
      )}" aria-label="${esc(label)}" title="${esc(label)}"></button>`;
    }).join('');
    return `<div class="scale" role="radiogroup" aria-labelledby="ql-${esc(e.id)}">${segs}</div>
      <div class="scale-labels" aria-hidden="true"><span>Decisive</span><span>Strong</span><span>Weak</span><span class="sl-mid">None</span><span>Weak</span><span>Strong</span><span>Decisive</span></div>
      <div class="scale-dirs" aria-hidden="true"><span>← Opposes the claim</span><span>Supports the claim →</span></div>`;
  }

  function trustHTML(e, r) {
    const has = r && r.s != null;
    const t = has ? (r.t != null ? r.t : 1) : null;
    const chips = M.TRUST.map((x) => {
      const on = t != null && Math.abs(x.v - t) < 0.01;
      return `<button type="button" role="radio" aria-checked="${on}" class="chip${on ? ' is-on' : ''}" data-t="${x.v}" data-ev="${esc(e.id)}"${
        has ? '' : ' disabled'
      }>${esc(x.label)}<small>${esc(x.hint)}</small></button>`;
    }).join('');
    return `<div class="chips${has ? '' : ' is-disabled'}" role="radiogroup" aria-labelledby="qt-${esc(e.id)}">${chips}</div>`;
  }

  function compareMiniHTML(claim, e, r, st) {
    if (!isRevealed(claim.id) || !r || r.s == null || !st) return '';
    const v = st.ev.find((x) => x.e.id === e.id);
    if (!v || !v.n) return `<div class="ev-compare"><p>No one else on the panel has weighed this yet.</p></div>`;
    const mine = r.s * (r.t != null ? r.t : 1);
    const diff = mine - v.impMed;
    let rel = 'You weigh it about the same as the panel.';
    if (Math.abs(diff) >= 3) rel = diff > 0 ? 'You read it as more supportive than most of the panel.' : 'You read it as more damaging to the claim than most of the panel.';
    return `<div class="ev-compare"><div class="mini" data-mini="${esc(e.id)}"></div>
      <p><b>Panel median:</b> ${esc(M.strengthLabel(v.impMed))} (${v.n} assessors). ${rel}</p></div>`;
  }

  function cardHTML(claim, e, k, st) {
    const r = S.me.ratings[claim.id] && S.me.ratings[claim.id].ev[e.id];
    const rated = r && r.s != null;
    const src = e.source || {};
    const srcText = [src.label, src.year].filter(Boolean).join(', ');
    return `<article class="ev${rated ? ' is-rated' : ''}" id="ev-${esc(e.id)}" data-card="${esc(e.id)}">
      <div class="ev-top">
        <span class="ev-num" aria-hidden="true">${rated ? '✓' : k + 1}</span>
        <div class="ev-head">
          <div class="ev-tags">${e.kind ? `<span class="tag">${esc(e.kind)}</span>` : ''}${C.statusBadge(e.status)}</div>
          <h4 class="ev-title">${esc(e.title)}</h4>
          ${e.summary ? `<p class="ev-sum">${esc(e.summary)}</p>` : ''}
          ${src.url ? `<p class="ev-src"><a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(srcText || 'Source')} ↗</a></p>` : srcText ? `<p class="ev-src">${esc(srcText)}</p>` : ''}
        </div>
      </div>
      <div class="ev-q">
        <div class="q-label" id="ql-${esc(e.id)}">If this finding holds, what does it do to the claim?</div>
        ${scaleHTML(e, r)}
        <p class="readout" id="ro-${esc(e.id)}">${readoutHTML(r)}</p>
      </div>
      <div class="ev-q">
        <div class="q-label" id="qt-${esc(e.id)}">How far do you trust the finding itself?</div>
        ${trustHTML(e, r)}
      </div>
      <details class="ev-note"${r && r.note ? ' open' : ''}><summary>Note for the panel</summary>
        <textarea class="field" data-note="${esc(e.id)}" rows="2" placeholder="Why? What would change your mind?">${esc((r && r.note) || '')}</textarea></details>
      ${compareMiniHTML(claim, e, r, st)}
      <div class="ev-tools"><button class="btn-link" data-act="edit-ev" data-ev="${esc(e.id)}">Edit</button><button class="btn-link" data-act="del-ev" data-ev="${esc(
      e.id
    )}">Remove</button></div>
    </article>`;
  }

  function compareHTML(claim, st) {
    const p = progress(claim);
    const mineRes = C.posteriorOf(claim, S.me.ratings[claim.id]);
    if (!isRevealed(claim.id)) {
      return `<h3 class="step-title"><span class="step-n">3</span>Compare with the panel</h3>
        <div class="locked"><p>The panel’s views stay hidden until you have weighed everything (${p.done} of ${p.total} answers so far), so they don’t anchor yours.</p>
        <button class="btn-ghost sm" data-act="reveal">Show the panel now</button></div>`;
    }
    if (!st || st.n === 0) {
      return `<h3 class="step-title"><span class="step-n">3</span>Compare with the panel</h3>
        <div class="locked"><p>No other assessors have rated this claim yet. Import their ratings from the Data menu, or share yours with the facilitator.</p></div>`;
    }
    const idx = S.inquiry.claims.findIndex((c) => c.id === claim.id);
    const next = S.inquiry.claims[idx + 1];
    let rank = '';
    if (mineRes) {
      const below = st.rows.filter((r) => r.post < mineRes.post - 0.25).length;
      const above = st.rows.filter((r) => r.post > mineRes.post + 0.25).length;
      if (above > below) rank = `You are more sceptical than ${above} of ${st.n} assessors.`;
      else if (below > above) rank = `You are more convinced than ${below} of ${st.n} assessors.`;
      else rank = `You sit in the middle of the panel.`;
    }
    const diffs = st.ev
      .filter((v) => v.mine && v.n >= 3)
      .map((v) => ({ v, d: v.mine.impact - v.impMed }))
      .filter((x) => Math.abs(x.d) >= 2)
      .sort((a, b) => Math.abs(b.d) - Math.abs(a.d))
      .slice(0, 3);
    const diffList = diffs.length
      ? `<ul class="diffs">${diffs
          .map(
            (x) => `<li><span class="d-title">${esc(x.v.e.title)}</span><span class="d-vs">You: ${esc(M.strengthLabel(x.v.mine.impact))} · Panel: ${esc(
              M.strengthLabel(x.v.impMed)
            )}</span></li>`
          )
          .join('')}</ul>`
      : `<p class="step-hint">You weighed every piece of evidence much as the panel did.</p>`;
    return `<h3 class="step-title"><span class="step-n">3</span>Compare with the panel</h3>
      <div class="cmp-figs">
        <div class="cmp-fig"><span>You</span><b>${mineRes ? M.pctDb(mineRes.post) : '—'}</b><em>${mineRes ? esc(M.verbalDb(mineRes.post)) : 'Set a starting belief'}</em></div>
        <div class="cmp-fig"><span>Panel median</span><b>${M.pctDb(st.postMed)}</b><em>${esc(M.verbalDb(st.postMed))} · ${esc(C.agreementWord(st.postIqr).toLowerCase())}</em></div>
      </div>
      ${rank ? `<p>${esc(rank)}</p>` : ''}
      <div class="strip-host" id="cmp-strip"></div>
      <div class="legend"><span class="lg"><i class="lg-dot"></i>One assessor’s conclusion</span><span class="lg"><i class="lg-band"></i>Middle half</span><span class="lg"><i class="lg-med"></i>Median</span><span class="lg"><i class="lg-me"></i>You</span></div>
      <h4 style="font-size:15px;margin-top:6px">Where you differ most</h4>
      ${diffList}
      <p class="step-hint">Differences are where the conversation should start: add a note to explain your weighting.</p>
      <div class="next-row">${next ? `<button class="btn" data-claim="${esc(next.id)}">Next claim →</button>` : `<a class="btn" href="#report">See the funder report →</a>`}
      <button class="btn-ghost" data-act="export-mine">Export my ratings</button></div>`;
  }

  function pathboxHTML(claim) {
    const revealed = isRevealed(claim.id);
    return `<div class="pb-head"><h3>Your belief path</h3><p class="pb-sub">Read from top to bottom: where you started, how each finding moved you, where you ended up.</p></div>
      <div class="path-chart" id="path-chart"></div>
      <div class="legend"><span class="lg"><i class="lg-for"></i>Supports</span><span class="lg"><i class="lg-against"></i>Opposes</span>${
        revealed ? '<span class="lg"><i class="lg-panel"></i>Panel median path</span>' : ''
      }</div>
      ${
        revealed
          ? `<button class="btn-link" data-act="hide-panel" style="justify-self:start">Hide the panel</button>`
          : `<div class="reveal-box">The panel’s path is hidden while you rate, so it doesn’t anchor you.<button class="btn-ghost sm" data-act="reveal">Show it anyway</button></div>`
      }`;
  }

  function miniBarHTML(claim) {
    const res = C.posteriorOf(claim, S.me.ratings[claim.id]);
    const p = progress(claim);
    return `<span>${res ? `Your conclusion <b>${M.pctDb(res.post)}</b> · ${esc(M.verbalDb(res.post))}` : 'Set your starting belief'}</span>
      <span class="num" style="color:var(--ink-3)">${p.done}/${p.total}</span>
      <button class="btn-ghost sm" data-act="to-path">Path ↓</button>`;
  }

  /* ---------- render ---------- */
  views.assess = function (main) {
    const claims = S.inquiry.claims;
    if (!claims.length) {
      main.innerHTML = `<div class="empty"><h3>No claims yet</h3><p>Start by writing down a claim your team wants to test, such as “Compound X slows disease Y in humans”.</p>
        <button class="btn" data-act="add-claim">Add the first claim</button></div>`;
      bind(main);
      return;
    }
    if (!C.ui.claimId || !C.claim(C.ui.claimId)) C.ui.claimId = claims[0].id;
    const claim = C.claim(C.ui.claimId);
    const idx = claims.indexOf(claim);
    const st = C.claimStats(claim, { includeMe: false });
    const r = S.me.ratings[claim.id];
    const p = progress(claim);

    main.innerHTML = `<div class="assess">
      <aside class="rail" aria-label="Claims" id="rail">${railHTML(claim.id)}</aside>
      <section class="work" id="work">
        <header class="claim-head">
          <p class="eyebrow">Claim ${idx + 1} of ${claims.length}</p>
          <h2 class="claim-title">${esc(claim.title)}</h2>
          ${claim.statement ? `<p class="claim-statement">${esc(claim.statement)}</p>` : ''}
          <div class="claim-tools"><button class="btn-link" data-act="edit-claim">Edit claim</button><button class="btn-link" data-act="del-claim">Delete claim</button></div>
        </header>
        <section class="step" id="step-prior">
          <h3 class="step-title"><span class="step-n">1</span>Before weighing the evidence, how likely is this claim?</h3>
          <p class="step-hint">Your honest starting point from background knowledge. The scale stretches near 0% and 100% because moving there takes ten times more evidence per step.</p>
          ${credenceHTML(r ? r.prior : null)}
        </section>
        <section class="step" id="step-evidence">
          <div class="step-row"><h3 class="step-title"><span class="step-n">2</span>Weigh each piece of evidence</h3><span class="step-count" id="ev-count">${p.rated} of ${claim.evidence.length} weighed</span></div>
          <p class="step-hint">First: if the finding holds, which way does it push the claim, and how hard? Then: how far do you trust the finding itself? A strong finding you doubt counts for less.</p>
          <div class="ev-list" id="ev-list">${claim.evidence.map((e, k) => cardHTML(claim, e, k, st)).join('') || '<p class="step-hint">No evidence yet.</p>'}</div>
          <button class="btn-dashed" data-act="add-ev">+ Add a piece of evidence</button>
        </section>
        <section class="step" id="step-compare">${compareHTML(claim, C.claimStats(claim, { includeMe: true }))}</section>
      </section>
      <aside class="pathbox" aria-label="Your belief path" id="pathbox"><div class="pathbox-inner" id="pathbox-inner">${pathboxHTML(claim)}</div></aside>
    </div>
    <div class="mini-bar" id="mini-bar">${miniBarHTML(claim)}</div>`;

    drawCharts(claim, st);
    bind(main);
  };

  function drawCharts(claim, st) {
    st = st || C.claimStats(claim, { includeMe: false });
    const pathEl = document.getElementById('path-chart');
    if (pathEl) C.charts.beliefPath(pathEl, claim, S.me.ratings[claim.id], isRevealed(claim.id) && st.n ? st : null);
    document.querySelectorAll('[data-mini]').forEach((el) => {
      const v = st.ev.find((x) => x.e.id === el.dataset.mini);
      if (v) C.charts.miniCompare(el, v);
    });
    const strip = document.getElementById('cmp-strip');
    if (strip) C.charts.strip(strip, C.claimStats(claim, { includeMe: true }), { compact: true });
  }

  /* Partial refresh after a rating change, keeping focus where it was. */
  function refresh(claim, evId) {
    const revealedNow = maybeAutoReveal(claim);
    const st = C.claimStats(claim, { includeMe: false });
    const active = document.activeElement;
    const focusKey = active && (active.dataset.s != null ? 's' : active.dataset.t != null ? 't' : null);
    const focusVal = focusKey && active.dataset[focusKey];

    if (evId) {
      const card = document.querySelector(`[data-card="${CSS.escape(evId)}"]`);
      const e = claim.evidence.find((x) => x.id === evId);
      if (card && e) {
        const k = claim.evidence.indexOf(e);
        card.outerHTML = cardHTML(claim, e, k, st);
        if (focusKey) {
          const again = document.querySelector(`[data-card="${CSS.escape(evId)}"] [data-${focusKey}="${focusVal}"]`);
          if (again) again.focus();
        }
      }
    }
    if (revealedNow) {
      // re-render every card so they all show the comparison
      document.getElementById('ev-list').innerHTML = claim.evidence.map((e, k) => cardHTML(claim, e, k, st)).join('');
      C.toast('All weighed. The panel’s views are now shown for comparison.');
    }
    const p = progress(claim);
    document.getElementById('rail').innerHTML = railHTML(claim.id);
    document.getElementById('ev-count').textContent = `${p.rated} of ${claim.evidence.length} weighed`;
    document.getElementById('step-compare').innerHTML = compareHTML(claim, C.claimStats(claim, { includeMe: true }));
    document.getElementById('pathbox-inner').innerHTML = pathboxHTML(claim);
    document.getElementById('mini-bar').innerHTML = miniBarHTML(claim);
    drawCharts(claim, st);
    C.save();
    C.renderHeader();
  }

  function updatePriorReadout(v) {
    const p = M.toP(v);
    const cred = document.getElementById('cred');
    cred.classList.remove('is-unset');
    document.getElementById('cred-big').textContent = M.pct(p);
    document.getElementById('cred-verbal').textContent = M.verbal(p);
    document.getElementById('cred-freq').textContent = M.chance(p);
    const range = document.getElementById('prior-range');
    range.setAttribute('aria-valuetext', M.pct(p) + ', ' + M.verbal(p));
    cred.querySelectorAll('.preset').forEach((b) => b.classList.toggle('is-on', Math.abs(M.toDb(+b.dataset.p) - v) < 0.3));
  }

  let priorTimer = null;
  function setPrior(claim, v, live) {
    const r = C.myRating(claim.id, true);
    r.prior = Math.round(v * 2) / 2;
    updatePriorReadout(r.prior);
    const pathEl = document.getElementById('path-chart');
    const st = C.claimStats(claim, { includeMe: false });
    if (pathEl) C.charts.beliefPath(pathEl, claim, r, isRevealed(claim.id) && st.n ? st : null);
    clearTimeout(priorTimer);
    priorTimer = setTimeout(() => refreshLight(claim), live ? 250 : 0);
  }
  function refreshLight(claim) {
    maybeAutoReveal(claim);
    document.getElementById('rail').innerHTML = railHTML(claim.id);
    document.getElementById('mini-bar').innerHTML = miniBarHTML(claim);
    document.getElementById('step-compare').innerHTML = compareHTML(claim, C.claimStats(claim, { includeMe: true }));
    const strip = document.getElementById('cmp-strip');
    if (strip) C.charts.strip(strip, C.claimStats(claim, { includeMe: true }), { compact: true });
    C.save();
    C.renderHeader();
  }

  function bind(main) {
    if (main._assessBound) return;
    main._assessBound = true;

    main.addEventListener('click', (ev) => {
      if (C.ui.view !== 'assess') return;
      const t = ev.target.closest('button, [data-claim]');
      if (!t) return;
      const claim = C.claim(C.ui.claimId);

      if (t.dataset.claim && !t.closest('.m-pt')) {
        C.ui.claimId = t.dataset.claim;
        views.assess(main);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      if (t.dataset.s != null && t.dataset.ev) {
        const r = C.myRating(claim.id, true);
        const cur = r.ev[t.dataset.ev] || {};
        const s = +t.dataset.s;
        r.ev[t.dataset.ev] = { ...cur, s, t: cur.t != null ? cur.t : 0.67 };
        refresh(claim, t.dataset.ev);
        return;
      }
      if (t.dataset.t != null && t.dataset.ev) {
        const r = C.myRating(claim.id, true);
        const cur = r.ev[t.dataset.ev];
        if (!cur) return;
        cur.t = +t.dataset.t;
        refresh(claim, t.dataset.ev);
        return;
      }
      if (t.dataset.p) {
        const v = M.toDb(+t.dataset.p);
        document.getElementById('prior-range').value = v;
        setPrior(claim, v, false);
        return;
      }
      const act = t.dataset.act;
      if (!act) return;
      if (act === 'reveal') {
        S.settings.revealed[claim.id] = true;
        C.save();
        views.assess(main);
      } else if (act === 'hide-panel') {
        S.settings.revealed[claim.id] = false;
        C.save();
        views.assess(main);
      } else if (act === 'add-claim') C.editClaim(null);
      else if (act === 'edit-claim') C.editClaim(claim);
      else if (act === 'del-claim') C.deleteClaim(claim);
      else if (act === 'add-ev') C.editEvidence(claim, null);
      else if (act === 'edit-ev') C.editEvidence(claim, claim.evidence.find((e) => e.id === t.dataset.ev));
      else if (act === 'del-ev') C.deleteEvidence(claim, claim.evidence.find((e) => e.id === t.dataset.ev));
      else if (act === 'export-mine') C.openExport('mine');
      else if (act === 'to-path') document.getElementById('pathbox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    main.addEventListener('input', (ev) => {
      if (C.ui.view !== 'assess') return;
      const t = ev.target;
      const claim = C.claim(C.ui.claimId);
      if (t.id === 'prior-range') setPrior(claim, +t.value, true);
      else if (t.dataset.note) {
        const r = C.myRating(claim.id, true);
        const cur = r.ev[t.dataset.note] || {};
        r.ev[t.dataset.note] = { ...cur, note: t.value };
        C.save();
      } else if (t.id === 'me-name') {
        S.me.name = t.value;
        C.save();
      } else if (t.id === 'me-disc') {
        S.me.discipline = t.value;
        C.save();
      }
    });

    // first touch on an unset slider should count as setting it
    main.addEventListener('change', (ev) => {
      if (C.ui.view !== 'assess') return;
      if (ev.target.id === 'prior-range') setPrior(C.claim(C.ui.claimId), +ev.target.value, false);
    });

    // hovering a row of the belief path highlights the matching card
    main.addEventListener('mouseover', (ev) => {
      const g = ev.target.closest && ev.target.closest('.p-row');
      document.querySelectorAll('.ev.is-focus').forEach((x) => x.classList.remove('is-focus'));
      if (g) {
        const card = document.querySelector(`[data-card="${CSS.escape(g.dataset.ev)}"]`);
        if (card) card.classList.add('is-focus');
      }
    });
    main.addEventListener('click', (ev) => {
      const g = ev.target.closest && ev.target.closest('.p-row');
      if (!g) return;
      const card = document.querySelector(`[data-card="${CSS.escape(g.dataset.ev)}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }
})();

</script>
    <script>
/*
 * Credence — Report view (for funders and other non-experts).
 * Overview: where the panel stands, and where funding would change minds.
 * Claim detail: how the evidence moved the panel, and what moved it.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;
  const esc = C.esc;
  const S = C.state;
  const views = (C.views = C.views || {});

  const q = (t) => `<q>${esc(t)}</q>`;

  function listText(arr) {
    if (arr.length <= 1) return arr.join('');
    return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  }

  function lede(all) {
    const by = (s) => all.filter((x) => x.status === s);
    const parts = [];
    const contested = by('contested');
    const open = by('open');
    const yes = by('settled-true');
    const no = by('settled-false');
    if (contested.length) parts.push(`Experts are split on ${listText(contested.map((s) => q(s.claim.title)))}.`);
    if (yes.length)
      parts.push(
        `They consider ${listText(yes.map((s) => q(s.claim.title) + ' ' + esc(M.verbalDb(s.postMed).toLowerCase()) + ' (' + M.pctDb(s.postMed) + ')'))}.`
      );
    if (open.length) parts.push(`They agree that ${listText(open.map((s) => q(s.claim.title)))} ${open.length > 1 ? 'remain' : 'remains'} an open question.`);
    if (no.length) parts.push(`They think ${listText(no.map((s) => q(s.claim.title)))} ${no.length > 1 ? 'are' : 'is'} unlikely.`);
    if (!parts.length) return 'Not enough assessors have rated these claims yet to draw conclusions.';
    return parts.join(' ');
  }

  function actionFor(s) {
    const st = C.STATUS[s.status];
    let type = s.status;
    let label = st.action;
    if (s.status.startsWith('settled') && s.repl) {
      type = 'replicate';
      label = 'Fund a replication';
    }
    return `<span class="act act-${type}">${esc(label)}</span>`;
  }

  function shiftText(s) {
    if (s.n < 3) return '';
    if (Math.abs(s.shift) < 0.8) return 'Evidence barely moved the panel';
    return `${s.shift > 0 ? 'Up' : 'Down'} from ${M.pctDb(s.priorMed)} before evidence`;
  }

  function oppHTML(o) {
    const s = o.stats;
    const t = s.claim.title;
    let kind;
    let title;
    let body;
    if (o.type === 'settle') {
      kind = 'Settle a disagreement';
      title = `Resolve whether ${t.charAt(0).toLowerCase() + t.slice(1)}`;
      body = `The middle half of the panel ranges from ${M.pctDb(s.postQ1)} to ${M.pctDb(s.postQ3)}. ${
        o.ev ? `They disagree most about ${q(o.ev.e.title)}. A study that settles it would move the most minds.` : 'A decisive study would move the most minds.'
      }`;
    } else if (o.type === 'replicate') {
      kind = 'Replicate';
      title = o.ev.e.title;
      body = `If this held up, the panel would count it as ${esc(M.strengthLabel(o.ev.sMed).toLowerCase())}. They trust it “${esc(
        M.trustLabel(o.ev.tMed).toLowerCase()
      )}”, so today it barely counts. An independent replication would show whether it should.`;
    } else {
      kind = 'Explore';
      title = `Explore whether ${t.charAt(0).toLowerCase() + t.slice(1)}`;
      body = `The panel agrees this is unresolved (median ${M.pctDb(s.postMed)}), and no finding yet counts strongly either way. Good ground for curiosity-led work.`;
    }
    const num = S.inquiry.claims.indexOf(s.claim) + 1;
    return `<li class="opp opp-${o.type}"><span class="opp-kind"><span class="opp-claim">Claim ${num}</span>${esc(kind)}</span><h4 class="opp-title">${esc(title)}</h4><p class="opp-body">${body}</p>
      <a class="opp-link" href="#report-${esc(s.claim.id)}">See the evidence →</a></li>`;
  }

  /* ---------- overview ---------- */
  function overview(main) {
    const claims = S.inquiry.claims;
    if (!claims.length) {
      main.innerHTML = `<div class="empty"><h3>Nothing to report yet</h3><p>Add claims and evidence in Assess, then gather ratings from your panel.</p><a class="btn" href="#assess">Go to Assess</a></div>`;
      return;
    }
    const all = claims.map((c) => C.claimStats(c));
    const nPeople = new Set(all.flatMap((s) => s.rows.map((r) => r.id))).size;
    const nEv = claims.reduce((a, c) => a + c.evidence.length, 0);
    const opps = C.opportunities(all);
    const counts = {};
    all.forEach((s) => (counts[s.status] = (counts[s.status] || 0) + 1));
    const settled = all.filter((s) => s.status.startsWith('settled') && !s.repl);

    const statusChips = Object.entries(C.STATUS)
      .filter(([k]) => counts[k])
      .map(([k, v]) => `<span class="pill pill-${v.tone}">${counts[k]} ${esc(v.short)}</span>`)
      .join('');

    const rows = all
      .map((s, i) => {
        const st = C.STATUS[s.status];
        return `<li class="rc"><a class="rc-link" href="#report-${esc(s.claim.id)}">
          <div class="rc-text"><span class="rc-num">${i + 1}</span><div><h4 class="rc-title">${esc(s.claim.title)}</h4>
            <p class="rc-meta"><span class="pill pill-${st.tone}">${esc(st.label)}</span><span class="pill-plain">${esc(C.agreementWord(s.postIqr))} · ${s.n} assessors</span></p></div></div>
          <div class="rc-fig">${s.n ? `<span class="rc-big num">${M.pctDb(s.postMed)}</span><span class="rc-verbal">${esc(M.verbalDb(s.postMed))}</span><span class="rc-shift">${esc(shiftText(s))}</span>` : '<span class="rc-verbal">No ratings yet</span>'}</div>
          <div class="rc-strip" data-strip="${esc(s.claim.id)}"></div>
          <div class="rc-act">${actionFor(s)}</div>
        </a></li>`;
      })
      .join('');

    const table = `<details class="r-table"><summary>Show the numbers as a table</summary><div class="tbl-wrap"><table>
      <thead><tr><th>Claim</th><th class="num">Assessors</th><th class="num">Before evidence</th><th class="num">After evidence</th><th class="num">Middle half</th><th>Status</th></tr></thead>
      <tbody>${all
        .map(
          (s) =>
            `<tr><td>${esc(s.claim.title)}</td><td class="num">${s.n}</td><td class="num">${s.n ? M.pctDb(s.priorMed) : '—'}</td><td class="num">${
              s.n ? M.pctDb(s.postMed) : '—'
            }</td><td class="num">${s.n ? M.pctDb(s.postQ1) + '–' + M.pctDb(s.postQ3) : '—'}</td><td>${esc(C.STATUS[s.status].label)}</td></tr>`
        )
        .join('')}</tbody></table></div></details>`;

    main.innerHTML = `<div class="report">
      <section class="r-intro">
        <p class="eyebrow">Report for funders</p>
        <h2 class="r-title">What ${nPeople} assessor${nPeople === 1 ? '' : 's'} concluded from ${nEv} pieces of evidence</h2>
        <p class="r-lede">${lede(all)}</p>
        <div class="r-status">${statusChips}</div>
        <div class="r-tools"><button class="btn-ghost sm" data-act="copy-summary">Copy summary as text</button></div>
      </section>

      <section class="r-sec">
        <div class="r-sec-head"><h3>Where the panel stands</h3>
          <p>Each dot is one assessor’s conclusion after weighing all the evidence. A tight cluster means agreement; a wide spread means experts disagree. Select a claim to see what drove it.</p></div>
        <div class="legend"><span class="lg"><i class="lg-dot"></i>One assessor</span><span class="lg"><i class="lg-band"></i>Middle half of the panel</span><span class="lg"><i class="lg-med"></i>Median</span><span class="lg"><i class="lg-for"></i>Shift from before evidence</span>${
          Object.keys(S.me.ratings).length ? '<span class="lg"><i class="lg-me"></i>You</span>' : ''
        }</div>
        <ol class="r-claims">${rows}</ol>
        ${table}
      </section>

      <section class="r-sec">
        <div class="r-sec-head"><h3>Where funding would change minds</h3>
          <p>Money changes the most minds where experts disagree, where an important finding is doubted, or where everyone agrees the question is open. Settled claims gain little from more of the same.</p></div>
        <div class="r-fund-grid">
          <div><div class="r-map" id="r-map"></div>
            <ol class="map-key">${all.map((s, i) => `<li><a href="#report-${esc(s.claim.id)}"><span class="mk-num">${i + 1}</span>${esc(s.claim.title)}</a></li>`).join('')}</ol></div>
          <div>
            ${opps.length ? `<ol class="opps" aria-label="Funding opportunities, most promising first">${opps.slice(0, 5).map(oppHTML).join('')}</ol>` : '<p class="step-hint">No clear opportunities yet: every claim is either settled or has too few assessors.</p>'}
            ${
              settled.length
                ? `<p class="low-pri" style="margin-top:10px"><b>Lower priority:</b> ${listText(settled.map((s) => q(s.claim.title)))} ${
                    settled.length > 1 ? 'look' : 'looks'
                  } settled. Fund further work there only if it could overturn the consensus.</p>`
                : ''
            }
          </div>
        </div>
      </section>
    </div>`;

    drawOverview(all);
  }

  function drawOverview(all) {
    document.querySelectorAll('[data-strip]').forEach((el) => {
      const s = all.find((x) => x.claim.id === el.dataset.strip);
      if (s) C.charts.strip(el, s);
    });
    const map = document.getElementById('r-map');
    if (map) C.charts.map(map, all, (cid) => (location.hash = 'report-' + cid));
  }

  /* ---------- claim detail ---------- */
  function detail(main, cid) {
    const claim = C.claim(cid);
    if (!claim) {
      location.hash = 'report';
      return;
    }
    const idx = S.inquiry.claims.indexOf(claim);
    const s = C.claimStats(claim);
    const st = C.STATUS[s.status];
    const narrowed = s.postIqr < s.priorIqr - 1;
    const widened = s.postIqr > s.priorIqr + 1;

    let sentence = 'Too few assessors have rated this claim to summarise it.';
    if (s.n >= 3) {
      sentence = `The panel thinks this is ${esc(M.verbalDb(s.postMed).toLowerCase())} (median ${M.pctDb(s.postMed)}). `;
      if (Math.abs(s.shift) >= 0.8)
        sentence += `Weighing the evidence moved them ${s.shift > 0 ? 'up' : 'down'} from ${M.pctDb(s.priorMed)}${
          narrowed ? ' and brought their views closer together.' : widened ? ', but their views spread further apart.' : '.'
        }`;
      else sentence += 'The evidence barely moved them overall.';
      if (s.status === 'contested') sentence += ' Assessors remain split.';
    }

    let actionBody = '';
    if (s.status === 'contested')
      actionBody = s.crux
        ? `Experts disagree most about ${q(s.crux.e.title)}. Work that settles it would move the most minds.`
        : 'A decisive study would move the most minds.';
    else if (s.status === 'open') actionBody = 'The panel agrees this is unresolved. Exploratory, curiosity-led work could move it either way.';
    else if (s.status.startsWith('settled'))
      actionBody = s.repl
        ? `The view looks settled, but ${q(s.repl.e.title)} would matter if it held up. Only a replication is likely to change minds here.`
        : 'More confirmatory work is unlikely to change minds. Fund work here only if it could overturn the consensus.';
    else actionBody = 'Recruit at least three assessors before drawing conclusions.';

    const sorted = [...s.ev].sort((a, b) => Math.abs(b.impMed || 0) - Math.abs(a.impMed || 0));
    const rows = sorted
      .map((v) => {
        const isCrux = s.crux && s.crux.e.id === v.e.id;
        const isRepl = s.repl && s.repl.e.id === v.e.id;
        return `<div class="imp-row${isCrux ? ' is-crux' : ''}${isRepl ? ' is-repl' : ''}">
          <div class="imp-text"><p class="imp-title">${esc(v.e.title)}</p>
            <p class="imp-meta">${v.e.kind ? `<span class="tag">${esc(v.e.kind)}</span>` : ''}${C.statusBadge(v.e.status)}<span>${v.n} rated</span>${
          v.n ? `<span>· trusted “${esc(M.trustLabel(v.tMed).toLowerCase())}”</span>` : ''
        }</p></div>
          <div class="imp-chart" data-imp="${esc(v.e.id)}"></div>
          <div class="imp-word">${v.n ? esc(M.strengthLabel(v.impMed)) : 'Not rated'}${
          v.n && Math.abs(v.sMed - v.impMed) >= 3 ? `<small>${esc(M.strengthLabel(v.sMed))} if fully trusted</small>` : ''
        }${isCrux ? '<span class="flag flag-crux">Most disputed</span>' : ''}${isRepl ? '<span class="flag flag-repl">Replicate</span>' : ''}</div>
        </div>`;
      })
      .join('');

    const callouts = [];
    if (s.crux)
      callouts.push(`<div class="callout c-crux"><h4>Where experts disagree most</h4><p>${q(s.crux.e.title)}. Most assessors weigh it somewhere between ${esc(
        M.strengthLabel(s.crux.impP10).toLowerCase()
      )} and ${esc(M.strengthLabel(s.crux.impP90).toLowerCase())}. Settling this finding would do most to bring the panel together.</p></div>`);
    if (s.repl)
      callouts.push(`<div class="callout c-repl"><h4>Important but doubted</h4><p>${q(s.repl.e.title)} would count as ${esc(
        M.strengthLabel(s.repl.sMed).toLowerCase()
      )} if it held up, but the panel trusts it “${esc(M.trustLabel(s.repl.tMed).toLowerCase())}”. An independent replication would show whether it should count.</p></div>`);
    if (s.n >= 3)
      callouts.push(`<div class="callout c-conv"><h4>${narrowed ? 'Evidence brought the panel together' : widened ? 'Evidence pulled the panel apart' : 'Spread of views'}</h4>
        <p>Before weighing evidence, the middle half of the panel sat between ${M.pctDb(s.priorQ1)} and ${M.pctDb(s.priorQ3)}. Afterwards: ${M.pctDb(s.postQ1)} to ${M.pctDb(
        s.postQ3
      )}.</p></div>`);

    main.innerHTML = `<div class="report">
      <a class="back" href="#report">← All claims</a>
      <section class="r-intro">
        <p class="eyebrow">Claim ${idx + 1} · ${esc(st.label)}</p>
        <h2 class="r-title">${esc(claim.title)}</h2>
        ${claim.statement ? `<p class="claim-statement">${esc(claim.statement)}</p>` : ''}
        <div class="rd-top" style="margin-top:8px">
          <div style="display:grid;gap:12px">
            <div class="rd-num">${s.n ? `<span class="rc-big num">${M.pctDb(s.postMed)}</span><span class="rd-verbal">${esc(M.verbalDb(s.postMed))}</span><span class="rd-range">Middle half of the panel: ${M.pctDb(s.postQ1)} to ${M.pctDb(
      s.postQ3
    )} · ${esc(C.agreementWord(s.postIqr).toLowerCase())} · ${s.n} assessors</span>` : '<span class="rd-verbal">No ratings yet</span>'}</div>
            <p class="rd-sentence">${sentence}</p>
          </div>
          <div class="rd-action">${actionFor(s)}<p>${actionBody}</p></div>
        </div>
      </section>

      <section class="r-sec">
        <div class="r-sec-head"><h3>How the evidence moved the panel</h3>
          <p>Each line is one assessor, from their starting belief (top) to their conclusion after weighing the evidence (bottom). The thick line is the median. Shaded bars show the middle half of the panel.</p></div>
        <div id="rd-slope"></div>
        <div class="legend"><span class="lg"><i class="lg-panel"></i>One assessor</span><span class="lg"><i class="lg-med" style="width:16px;height:3px"></i>Median</span>${
          s.rows.some((r) => r.isMe) ? '<span class="lg"><i class="lg-me"></i>You</span>' : ''
        }</div>
      </section>

      <section class="r-sec">
        <div class="r-sec-head"><h3>What moved the panel</h3>
          <p>Solid bars show how much each finding counts once the panel’s trust in it is applied. Outlines show how much it would count if fully trusted: a big gap marks a finding that matters but is doubted. Whiskers show the middle half of assessors.</p></div>
        <div class="legend"><span class="lg"><i class="lg-fill"></i>Counts as weighed</span><span class="lg"><i class="lg-pot"></i>If fully trusted</span>${
          s.ev.some((v) => v.mine) ? '<span class="lg"><i class="lg-me" style="border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%)"></i>You</span>' : ''
        }</div>
        <div class="imp-list">
          <div class="imp-head"><div></div><div id="imp-axis"></div><div></div></div>
          ${rows || '<p class="step-hint">No evidence yet.</p>'}
        </div>
      </section>

      ${callouts.length ? `<section class="callouts">${callouts.join('')}</section>` : ''}

      <div class="r-tools"><a class="btn-ghost" href="#report">← All claims</a><button class="btn-ghost" data-act="copy-claim" data-claim-id="${esc(
        claim.id
      )}">Copy this summary</button><button class="btn" data-act="assess-claim" data-claim-id="${esc(claim.id)}">Rate this claim yourself</button></div>
    </div>`;

    const slope = document.getElementById('rd-slope');
    if (slope) C.charts.slope(slope, s);
    const axis = document.getElementById('imp-axis');
    if (axis) C.charts.impactHeader(axis);
    document.querySelectorAll('[data-imp]').forEach((el) => {
      const v = s.ev.find((x) => x.e.id === el.dataset.imp);
      if (v) C.charts.impactRow(el, v);
    });
  }

  views.report = function (main, cid) {
    if (cid) detail(main, cid);
    else overview(main);
    bind(main);
  };

  /* ---------- plain-text summaries for memos ---------- */
  C.summaryText = function (cid) {
    const claims = cid ? [C.claim(cid)] : S.inquiry.claims;
    const lines = [];
    lines.push(S.inquiry.title);
    if (C.sampleActive()) lines.push('(Illustrative panel: ratings are simulated for this prototype.)');
    lines.push('');
    for (const c of claims) {
      const s = C.claimStats(c);
      lines.push('• ' + c.title);
      if (s.n >= 1) {
        lines.push(
          `  Panel median ${M.pctDb(s.postMed)} (${M.verbalDb(s.postMed).toLowerCase()}), middle half ${M.pctDb(s.postQ1)}–${M.pctDb(s.postQ3)}, ${s.n} assessors. ${C.STATUS[s.status].label}.`
        );
        if (Math.abs(s.shift) >= 0.8) lines.push(`  Evidence moved the panel from ${M.pctDb(s.priorMed)} to ${M.pctDb(s.postMed)}.`);
        if (s.crux) lines.push(`  Most disputed evidence: ${s.crux.e.title}.`);
        if (s.repl) lines.push(`  Worth replicating: ${s.repl.e.title}.`);
        lines.push(`  Suggested action: ${C.STATUS[s.status].action}.`);
      } else lines.push('  No ratings yet.');
      lines.push('');
    }
    return lines.join('\n');
  };

  function bind(main) {
    if (main._reportBound) return;
    main._reportBound = true;
    main.addEventListener('click', (ev) => {
      if (C.ui.view !== 'report') return;
      const t = ev.target.closest('button');
      if (!t) return;
      if (t.dataset.act === 'copy-summary') C.copyText(C.summaryText(), 'Summary copied. Paste it into your memo.');
      else if (t.dataset.act === 'copy-claim') C.copyText(C.summaryText(t.dataset.claimId), 'Claim summary copied.');
      else if (t.dataset.act === 'assess-claim') {
        C.ui.claimId = t.dataset.claimId;
        location.hash = 'assess';
      }
    });
  }
})();

</script>

      <section class="r-intro">
        <p class="eyebrow">Method</p>
        <h2 class="r-title">How Credence turns expert judgement into a decision</h2>
        <p class="r-lede">Science doesn’t prove claims; evidence shifts how credible they are. Credence asks experts two simple questions about each claim and each finding, combines their answers with Bayes’ rule, and shows non-experts where the field stands and where money would change minds.</p>
      </section>

      <section class="r-sec two-col">
        <div class="prose">
          <h3>Two roles</h3>
          <p><b>Assessors</b> are the experts. For each claim they give a starting belief, then weigh each piece of evidence: which way it pushes, how hard, and how far they trust it. They see how each answer moves them, and only then how the rest of the panel answered.</p>
          <p><b>Funders</b> read the report. It shows what the panel concluded, how much they agree, which evidence carried the most weight, and where a study would change the most minds.</p>
        </div>
        <div class="prose">
          <h3>How the numbers combine</h3>
          <p>Evidence multiplies the odds of a claim. Credence keeps score in <b>decibans</b>, Alan Turing’s codebreaking unit: ten times the logarithm of the odds. In decibans, evidence simply adds up.</p>
          <div class="formula">conclusion = starting belief<br>&nbsp;&nbsp;+ Σ (strength if true × trust)</div>

        </div>
      </section>

      <section class="r-sec two-col">
        <div class="prose">
          <h3>Reading credence</h3>
          <p>Every number comes with words from the IPCC’s calibrated scale and a natural frequency, so non-experts don’t have to interpret percentages alone.</p>
          <div class="tbl-wrap"><table><thead><tr><th class="num">Credence</th><th>In words</th><th>As a frequency</th><th class="num">Decibans</th></tr></thead><tbody>${ladder}</tbody></table></div>
        </div>
        <div class="prose">
          <h3>Strength of evidence</h3>
          <p>Assessors pick a band, not a number. Each band multiplies the odds by roughly the amount shown; opposition divides them.</p>

      <section class="r-sec prose" style="max-width:none">
        <h3>How the panel is summarised</h3>
        <ul>
          <li><b>Median</b>: half the panel is above, half below. Robust to one extreme assessor.</li>
          <li><b>Middle half</b>: the range holding the central 50% of assessors. Its width is the measure of disagreement.</li>
          <li><b>Split</b>: the middle half is wider than 20%–80% (12 dB). <b>Mixed</b>: 5–12 dB. <b>Broad agreement</b>: under 5 dB.</li>
          <li><b>Open question</b>: assessors agree, and the median sits between 25% and 75%.</li>
          <li><b>Most disputed evidence</b>: the finding whose weighting varies most across assessors. Settling it would do most to close the gap.</li>
          <li><b>Worth replicating</b>: a finding the panel would count as at least moderate if true, but whose median trust is “doubtful” or lower. The gap between the outline and the solid bar is what a replication could unlock.</li>

            <li><b>Blind first, then compare.</b> The panel stays hidden until you have weighed everything, so early views can’t anchor later ones.</li>
            <li><b>One point, not a range.</b> Each assessor gives a single answer. Uncertainty shows up as disagreement across the panel, where it is easiest to read.</li>
            <li><b>Top to bottom.</b> The belief path reads in the order you reason: start, each finding, conclusion.</li>
            <li><b>Words before decibans.</b> The maths stays underneath; the interface speaks in percentages, frequencies and plain labels.</li>
            <li><b>Colour-blind safe.</b> Blue supports and orange opposes, instead of green and red. Every colour also has a label.</li>
          </ul>

        <div class="prose">

      <section class="r-sec prose" style="max-width:none">
        <h3>Limits of this prototype</h3>
        <ul>
          <li>The 20 assessors in the sample are fictional, and their ratings are simulated. The studies cited are real.</li>

/*
 * Credence — app shell: routing, inquiry header, data menu, editors, tooltip and toast.
 */

  const C = (window.C = window.C || {});

  const esc = C.esc;

  const main = document.getElementById('main');

  C.ui = { view: 'assess', claimId: null, reportClaim: null };

  /* ---------- header ---------- */
  C.renderHeader = function () {
    const el = document.getElementById('inq');
    const claims = S.inquiry.claims;
    const nEv = claims.reduce((a, c) => a + c.evidence.length, 0);
    const people = C.people(Object.keys(S.me.ratings).length > 0).length;
    const mine = claims.filter((c) => {
      const r = S.me.ratings[c.id];
      return r && r.prior != null;
    }).length;
    el.innerHTML = `<div class="wrap inq">
      <div class="inq-row">
        <div class="inq-main">
          <p class="eyebrow">${esc(S.inquiry.field || 'Inquiry')}</p>
          <h1 class="inq-title">${esc(S.inquiry.title || 'Untitled inquiry')}</h1>
          ${S.inquiry.description ? `<p class="inq-desc">${esc(S.inquiry.description)}</p>` : ''}
        </div>
        <div class="inq-meta">
          <span><b class="num">${claims.length}</b>claims</span>
          <span><b class="num">${nEv}</b>pieces of evidence</span>
          <span><b class="num">${people}</b>assessors</span>
          <span><b class="num">${mine}/${claims.length}</b>rated by you</span>
        </div>
      </div>
      ${
        C.sampleActive()
          ? `<div class="notice"><span class="notice-ico" aria-hidden="true">!</span><span><b>Sample inquiry.</b> The studies are real; the 20 assessors and their ratings are fictional, simulated to show how a panel reads. Turn the sample panel off in <button class="btn-link" data-act="open-data">Data</button> when running with real people.</span></div>`
          : ''
      }
    </div>`;
  };

  /* ---------- routing ---------- */
  function route() {
    const h = (location.hash || '#assess').slice(1);
    let view = 'assess';
    let arg = null;
    if (h === 'report') view = 'report';
    else if (h.startsWith('report-')) {
      view = 'report';
      arg = h.slice(7);
    } else if (h === 'method') view = 'method';
    C.ui.view = view;
    document.querySelectorAll('.tab').forEach((t) => {
      if (t.dataset.view === view) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
    hideTip();
    C.renderHeader();
    if (view === 'report') C.views.report(main, arg);
    else if (view === 'method') C.views.method(main);
    else C.views.assess(main);
    if (!C._firstRoute) window.scrollTo(0, 0);
    C._firstRoute = false;
  }
  C.rerender = route;
  C._firstRoute = true;
  window.addEventListener('hashchange', route);

  let resizeTimer = null;
  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (Math.abs(window.innerWidth - lastW) < 8) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(route, 160);
  });

  /* ---------- tooltip ---------- */
  const tip = document.getElementById('tooltip');
  function hideTip() {
    tip.hidden = true;
  }
  document.addEventListener('mousemove', (ev) => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (!t) return hideTip();
    tip.innerHTML = t.getAttribute('data-tip');
    tip.hidden = false;
    const pad = 14;
    const r = tip.getBoundingClientRect();
    let x = ev.clientX + pad;
    let y = ev.clientY + pad;
    if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  });
  document.addEventListener('scroll', hideTip, { passive: true });

  /* ---------- toast ---------- */
  let toastTimer = null;
  C.toast = function (msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.hidden = true), 3200);
  };

  C.copyText = function (text, okMsg) {
    const fallback = () => C.showText('Copy this text', text);
    try {
      navigator.clipboard.writeText(text).then(() => C.toast(okMsg || 'Copied.'), fallback);
    } catch (e) {
      fallback();
    }
  };

  /* ---------- modal ---------- */
  const modalRoot = document.getElementById('modal-root');
  let lastFocus = null;
  C.modal = function (opts) {
    lastFocus = document.activeElement;
    modalRoot.innerHTML = `<div class="modal-back" data-close>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">${esc(opts.title)}</h2>
        <div class="modal-body">${opts.body}</div>
        <p class="err" id="modal-err" hidden></p>
        <div class="modal-actions">${(opts.actions || [])
          .map((a, i) => `<button type="button" class="${a.primary ? 'btn' : 'btn-ghost'}" data-mact="${i}">${esc(a.label)}</button>`)
          .join('')}</div>
      </div></div>`;
    const back = modalRoot.firstElementChild;
    const close = () => {
      modalRoot.innerHTML = '';
      document.removeEventListener('keydown', onKey);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
    };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', (e) => {
      if (e.target === back) close();
      const b = e.target.closest('[data-mact]');
      if (!b) return;
      const a = opts.actions[+b.dataset.mact];
      if (!a.onClick) return close();
      try {
        const keep = a.onClick(back);
        if (keep !== true) close();
      } catch (err) {
        const el = back.querySelector('#modal-err');
        el.textContent = err.message;
        el.hidden = false;
      }
    });
    if (opts.onOpen) opts.onOpen(back);
    const first = back.querySelector('input, textarea, select, button');
    if (first) first.focus();
    return { close, el: back };
  };

  C.showText = function (title, text) {
    C.modal({
      title,

      onOpen: (el) => el.querySelector('#show-text').select(),

  /* ---------- editors ---------- */
  const KINDS = ['Clinical trial', 'Cohort', 'Observational', 'Natural experiment', 'Meta-analysis', 'Genetics', 'Imaging', 'Pathology', 'Lab / animal', 'Review', 'Methods', 'Other'];
  const STATUSES = ['Single study', 'Replicated', 'Replication', 'Contested', 'Retracted'];

  C.editClaim = function (claim) {
    const isNew = !claim;
    C.modal({
      title: isNew ? 'Add a claim' : 'Edit claim',
      body: `<div class="form-row"><label for="f-title">Claim, in one short sentence</label><input class="field" id="f-title" maxlength="140" value="${esc(
        claim ? claim.title : ''
      )}" placeholder="e.g. Compound X slows disease Y in humans"></div>
        <div class="form-row"><label for="f-stmt">Precise statement (optional)</label><textarea class="field" id="f-stmt" rows="3" placeholder="What exactly would have to be true?">${esc(
          claim ? claim.statement : ''
        )}</textarea></div>`,
      actions: [
        { label: 'Cancel' },
        {
          label: isNew ? 'Add claim' : 'Save',
          primary: true,
          onClick: (el) => {
            const title = el.querySelector('#f-title').value.trim();

            if (isNew) {
              const c = { id: C.uid('c-'), title, statement, evidence: [] };

              claim.statement = statement;

            C.save();
            if (location.hash !== '#assess' && location.hash !== '') location.hash = 'assess';
            else route();
          },
        },
      ],
    });
  };

    C.modal({
      title: isNew ? 'Add a piece of evidence' : 'Edit evidence',
      body: `<div class="form-row"><label for="f-title">Finding, in one sentence</label><input class="field" id="f-title" maxlength="160" value="${esc(
        e ? e.title : ''
      )}" placeholder="What did the study find?"></div>
        <div class="form-row"><label for="f-sum">Summary (optional)</label><textarea class="field" id="f-sum" rows="3" placeholder="Design, size, key numbers">${esc(

        )}</textarea></div>

            const data = {

  /* ---------- export / import ---------- */
  function download(name, text) {

  C.openExport = function (what) {

  C.openImport = function () {
    C.modal({
      title: 'Import ratings or an inquiry',

        <input type="file" id="i-files" accept="application/json,.json" multiple class="field">

      actions: [
        { label: 'Cancel' },
        {
          label: 'Import',

            };

                obj = JSON.parse(text);

            }
            if (!files.length) return finish();
            let left = files.length;
            [...files].forEach((f) => {
              const rd = new FileReader();
              rd.onload = () => {
                try {
                  msgs.push(C.importData(JSON.parse(rd.result)));
                } catch (e) {
                  msgs.push(f.name + ': ' + e.message);
                }
                if (--left === 0) finish();
              };
              rd.readAsText(f);
            });
          },
        },
      ],
    });
  };

  C.openData = function () {
    const sampleInq = S.inquiry.sample;
    const nImp = S.imported.assessors.length;
    C.modal({
      title: 'Data',
      body: `<div class="menu-list">
        ${
          sampleInq
            ? `<div class="menu-item"><div><h4>Illustrative panel</h4><p>20 fictional assessors with simulated ratings. Turn off when your real panel is in.</p></div>
          <button class="switch" role="switch" aria-checked="${S.settings.useSample}" id="d-sample" aria-label="Include illustrative panel"></button></div>`
            : ''
        }
        <div class="menu-item"><div><h4>Export my ratings</h4><p>A small file to send to your facilitator.</p></div><button class="btn-ghost sm" id="d-exp-mine">Export</button></div>
        <div class="menu-item"><div><h4>Import ratings or an inquiry</h4><p>${nImp} imported assessor${nImp === 1 ? '' : 's'} so far.</p></div><button class="btn-ghost sm" id="d-imp">Import</button></div>
        <div class="menu-item"><div><h4>Export the whole inquiry</h4><p>Claims, evidence and all ratings, to hand to another team.</p></div><button class="btn-ghost sm" id="d-exp-all">Export</button></div>
        <div class="menu-item"><div><h4>Start a blank inquiry</h4><p>For your own field. Removes the sample claims from this browser.</p></div><button class="btn-ghost sm" id="d-blank">Start</button></div>
        <div class="menu-item"><div><h4>Restore the sample</h4><p>Bring back the Alzheimer’s inquiry and clear your ratings and imports.</p></div><button class="btn-ghost sm" id="d-reset">Restore</button></div>
      </div>`,
      actions: [{ label: 'Done', primary: true }],
      onOpen: (el) => {
        const sw = el.querySelector('#d-sample');
        if (sw)
          sw.addEventListener('click', () => {
            S.settings.useSample = !S.settings.useSample;
            sw.setAttribute('aria-checked', S.settings.useSample);
            C.save();
            route();
          });
        el.querySelector('#d-exp-mine').addEventListener('click', () => C.openExport('mine'));
        el.querySelector('#d-exp-all').addEventListener('click', () => C.openExport('all'));
        el.querySelector('#d-imp').addEventListener('click', () => C.openImport());
        el.querySelector('#d-blank').addEventListener('click', () => confirmBlank());
        el.querySelector('#d-reset').addEventListener('click', () => confirmReset());
      },
    });
  };

  function confirmBlank() {
    C.modal({
      title: 'Start a blank inquiry?',
      body: `<div class="form-row"><label for="b-title">Question your panel will examine</label><input class="field" id="b-title" placeholder="e.g. Is the gut–brain axis a real driver of Parkinson’s?"></div>
        <div class="form-row"><label for="b-field">Field</label><input class="field" id="b-field" placeholder="e.g. Neurodegeneration · Life sciences"></div>
        <p class="step-hint">The sample claims and your ratings of them will be removed from this browser. You can restore the sample later.</p>`,
      actions: [
        { label: 'Cancel' },
        {
          label: 'Start blank inquiry',
          primary: true,
          onClick: (el) => {
            const title = el.querySelector('#b-title').value.trim() || 'Untitled inquiry';
            S.inquiry = { id: C.uid('inq-'), sample: false, field: el.querySelector('#b-field').value.trim() || 'Inquiry', title, description: '', claims: [] };
            S.me.ratings = {};
            S.imported = { assessors: [], ratings: {} };
            S.settings.revealed = {};
            C.ui.claimId = null;
            C.save();
            location.hash = 'assess';
            route();
          },
        },
      ],
    });
  }

  function confirmReset() {
    C.modal({
      title: 'Restore the sample inquiry?',
      body: `<p class="step-hint">Your ratings, imported assessors and any claims you added will be removed from this browser.</p>`,
      actions: [
        { label: 'Cancel' },
        {
          label: 'Restore sample',
          primary: true,
          onClick: () => {
            C.resetAll();
            C.ui.claimId = null;
            route();
            C.toast('Sample inquiry restored.');
          },
        },
      ],
    });
  }

  /* ---------- global actions ---------- */
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    if (t.dataset.act === 'open-data') C.openData();
  });

  route();
})();

</script>
  </body>
</html>
