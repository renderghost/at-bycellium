<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Credence</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <meta name="description" content="Credence: experts weigh evidence for scientific claims; funders see where the field stands and where money would change minds." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
/*
 * Credence — design tokens
 * Layout concept: a working instrument. Claims on the left, the evidence you are weighing in the middle,
 * your belief path pinned on the right, so cause (rating) and effect (movement) are always side by side.
 */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --sunk: #eaeef2;
  --ink: #111823;
  --ink-2: #455060;
  --ink-3: #646e7d;
  --line: #dfe4ea;
  --line-2: #c5ccd6;

  --for: #2a78d6;
  --for-soft: #e3eefb;
  --against: #eb6834;
  --against-soft: #fdeae2;
  --panel: #8d96a3;
  --panel-soft: rgba(141, 150, 163, 0.2);
  --me: #6250d6;
  --me-soft: #ece9fb;
  --accent: #4f3fc4;

  --warn: #e09b00;
  --warn-soft: #fff3d6;
  --crit: #d03b3b;
  --crit-soft: #fbe4e4;
  --good: #0a8a0a;
  --good-soft: #e2f3e2;
  --info-soft: #e5ebf6;

  --f-display: 'Instrument Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --shadow: 0 1px 2px rgba(17, 24, 35, 0.05), 0 4px 16px rgba(17, 24, 35, 0.05);
  --top-h: 56px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0e1217;
    --surface: #161b22;
    --surface-2: #1b212a;
    --sunk: #0b0e12;
    --ink: #eef1f5;
    --ink-2: #b6bfcb;
    --ink-3: #8f99a7;
    --line: #262e38;
    --line-2: #37414d;
    --for: #3987e5;
    --for-soft: #16273d;
    --against: #d95926;
    --against-soft: #36211a;
    --panel: #788290;
    --panel-soft: rgba(140, 150, 165, 0.2);
    --me: #9085e9;
    --me-soft: #262246;
    --accent: #a59cf0;
    --warn: #f0b429;
    --warn-soft: #362c12;
    --crit: #e06464;
    --crit-soft: #3a1b1b;
    --good: #2fb52f;
    --good-soft: #14301a;
    --info-soft: #1a2335;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0e1217;
  --surface: #161b22;
  --surface-2: #1b212a;
  --sunk: #0b0e12;
  --ink: #eef1f5;
  --ink-2: #b6bfcb;
  --ink-3: #8f99a7;
  --line: #262e38;
  --line-2: #37414d;
  --for: #3987e5;
  --for-soft: #16273d;
  --against: #d95926;
  --against-soft: #36211a;
  --panel: #788290;
  --panel-soft: rgba(140, 150, 165, 0.2);
  --me: #9085e9;
  --me-soft: #262246;
  --accent: #a59cf0;
  --warn: #f0b429;
  --warn-soft: #362c12;
  --crit: #e06464;
  --crit-soft: #3a1b1b;
  --good: #2fb52f;
  --good-soft: #14301a;
  --info-soft: #1a2335;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

/* ---------- base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-body);
  font-feature-settings: 'cv11', 'ss01';
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
h1,
h2,
h3,
h4 {
  font-family: var(--f-display);
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
p {
  margin: 0;
}
a {
  color: var(--accent);
  text-underline-offset: 2px;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
[hidden] {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) {
  .wrap {
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: max(28px, env(safe-area-inset-right, 0px));
  }
}
.eyebrow {
  font: 600 12px/1.3 var(--f-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.num {
  font-variant-numeric: tabular-nums;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--bg);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 600;
  font-size: 14px;
  line-height: 1.2;
  text-decoration: none;
}
.btn:hover {
  opacity: 0.88;
}
.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 14px;
  font-weight: 500;
  font-size: 14px;
  line-height: 1.2;
  text-decoration: none;
}
.btn-ghost:hover {
  border-color: var(--ink-3);
}
.btn-ghost.sm,
.btn.sm {
  padding: 5px 11px;
  font-size: 13px;
}
.btn-link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--ink-3);
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.btn-link:hover {
  color: var(--ink);
}
.btn-dashed {
  width: 100%;
  border: 1.5px dashed var(--line-2);
  background: transparent;
  border-radius: var(--r-md);
  padding: 14px;
  color: var(--ink-2);
  font-weight: 500;
}
.btn-dashed:hover {
  border-color: var(--ink-3);
  color: var(--ink);
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: var(--top-h);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  color: var(--ink);
  font: 700 18px/1 var(--f-display);
  letter-spacing: -0.02em;
}
.brand svg {
  flex: none;
}
.brand-tag {
  font: 500 11px/1 var(--f-mono);
  color: var(--ink-3);
  border: 1px solid var(--line-2);
  border-radius: 4px;
  padding: 3px 5px;
  letter-spacing: 0.02em;
}
.tabs {
  display: flex;
  gap: 4px;
  margin-left: auto;
  background: var(--sunk);
  padding: 3px;
  border-radius: 999px;
}
.tab {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tab[aria-current='page'] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}
.tab-sub {
  font-weight: 500;
  color: var(--ink-3);
  font-size: 12px;
}
.top-actions {
  display: flex;
  gap: 8px;
}
/* ---------- inquiry header ---------- */
.inq {
  padding-block: 22px 18px;
}
.inq-row {
  display: flex;
  gap: 24px;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
}
.inq-main {
  min-width: 0;
  max-width: 78ch;
  display: grid;
  gap: 6px;
}
.inq-title {
  font-size: clamp(22px, 2.6vw, 30px);
  font-weight: 600;
}
.inq-desc {
  color: var(--ink-2);
  max-width: 70ch;
}
.inq-meta {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  color: var(--ink-2);
  font-size: 13px;
}
.inq-meta b {
  font-family: var(--f-display);
  font-size: 20px;
  color: var(--ink);
  font-weight: 600;
  display: block;
  line-height: 1.1;
}
.notice {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: var(--r-md);
  background: var(--warn-soft);
  color: var(--ink);
  font-size: 13.5px;
  max-width: 100%;
}
.notice-ico {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--warn);
  color: #111;
  font-weight: 700;
  font-size: 12px;
}

/* ---------- work column ---------- */
.work {
  display: grid;
  gap: 18px;
  min-width: 0;
}
.claim-head {
  display: grid;
  gap: 8px;
  padding-top: 4px;
}
.claim-title {
  font-size: clamp(22px, 2.3vw, 28px);
  font-weight: 600;
}
.claim-statement {
  color: var(--ink-2);
  max-width: 68ch;
  font-size: 15.5px;
}
.claim-tools {
  display: flex;
  gap: 14px;
}
.step {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.step-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.step-title {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: 18px;
  font-weight: 600;
}
.step-n {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font: 600 13px/1 var(--f-body);
  background: var(--ink);
  color: var(--bg);
  transform: translateY(-1px);
}
.step-hint {
  color: var(--ink-2);
  font-size: 14px;
  max-width: 70ch;
}
.step-count {
  font-size: 13px;
  color: var(--ink-3);
}

/* credence input */
.cred {
  display: grid;
  gap: 12px;
}
.cred-read {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
.cred-big {
  font: 600 40px/1 var(--f-display);
  letter-spacing: -0.02em;
  min-width: 3.2ch;
}
.cred-words {
  display: grid;
  gap: 2px;
}
.cred-verbal {
  font-weight: 600;
}
.cred-freq {
  color: var(--ink-3);
  font-size: 13.5px;
}
.cred.is-unset .cred-big {
  color: var(--ink-3);
}
.cred-track {
  position: relative;
  padding-bottom: 22px;
}
.cred-track input[type='range'] {
  width: 100%;
  margin: 0;
  height: 30px;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
}
.cred-track input[type='range']::-webkit-slider-runnable-track {
  height: 8px;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--against-soft), var(--sunk) 50%, var(--for-soft));
  border: 1px solid var(--line);
}
.cred-track input[type='range']::-moz-range-track {
  height: 8px;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--against-soft), var(--sunk) 50%, var(--for-soft));
  border: 1px solid var(--line);
}
.cred-track input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  margin-top: -8px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--surface);
  box-shadow: 0 0 0 1px var(--ink), 0 2px 6px rgba(0, 0, 0, 0.2);
}
.cred-track input[type='range']::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--surface);
  box-shadow: 0 0 0 1px var(--ink);
}
.cred.is-unset input[type='range']::-webkit-slider-thumb {
  background: var(--surface);
  box-shadow: 0 0 0 1.5px var(--ink-3);
}
.cred.is-unset input[type='range']::-moz-range-thumb {
  background: var(--surface);
  box-shadow: 0 0 0 1.5px var(--ink-3);
}
.cred-ticks {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 18px;
  pointer-events: none;
}
.cred-ticks span {
  position: absolute;
  transform: translateX(-50%);
  left: calc(var(--t) * (100% - 22px) + 11px);
  font: 500 11px/1 var(--f-mono);
  color: var(--ink-3);
}
.presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.presets-label {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-right: 2px;
}
.preset {
  border: 1px solid var(--line-2);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 10px;
  font: 500 12.5px/1.4 var(--f-mono);
  color: var(--ink-2);
}
.preset:hover {
  border-color: var(--ink-3);
  color: var(--ink);
}
.preset.is-on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* evidence cards */
.ev-list {
  display: grid;
  gap: 12px;
}
.ev {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px;
  display: grid;
  gap: 14px;
  background: var(--surface);
  transition: border-color 0.2s;
  scroll-margin-top: calc(var(--top-h) + 20px);
}
.ev.is-rated {
  background: var(--surface-2);
}
.ev.is-focus {
  border-color: var(--me);
  box-shadow: 0 0 0 3px var(--me-soft);
}
.ev-top {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 12px;
}
.ev-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--line-2);
  display: grid;
  place-items: center;
  font: 600 12px/1 var(--f-body);
  color: var(--ink-2);
}
.ev.is-rated .ev-num {
  background: var(--me);
  border-color: var(--me);
  color: #fff;
}
.ev-head {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.ev-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tag {
  font: 500 11.5px/1 var(--f-body);
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--sunk);
  color: var(--ink-2);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 600 11.5px/1 var(--f-body);
  padding: 4px 8px 4px 5px;
  border-radius: 999px;
  color: var(--ink);
}
.badge i {
  font-style: normal;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  color: #fff;
}
.badge-retracted {
  background: var(--crit-soft);
}
.badge-retracted i {
  background: var(--crit);
}
.badge-contested {
  background: var(--warn-soft);
}
.badge-contested i {
  background: var(--warn);
  color: #111;
}
.badge-replicated {
  background: var(--good-soft);
}
.badge-replicated i {
  background: var(--good);
}
.badge-single,
.badge-replication,
.badge-other {
  background: var(--info-soft);
}
.badge-single i,
.badge-replication i,
.badge-other i {
  background: var(--ink-3);
}
.ev-title {
  font-size: 16px;
  font-weight: 600;
}
.ev-sum {
  color: var(--ink-2);
  font-size: 14px;
}
.ev-src {
  font-size: 13px;
}
.ev-q {
  display: grid;
  gap: 8px;
}
.q-label {
  font-size: 13.5px;
  font-weight: 600;
}

/* strength scale: a diverging segmented control */
.scale {
  display: grid;
  grid-template-columns: repeat(13, minmax(0, 1fr));
  gap: 3px;
}
.seg {
  height: 32px;
  border-radius: 5px;
  border: 1px solid var(--line);
  padding: 0;
  background: var(--surface);
  position: relative;
}
.seg.mid {
  background: var(--sunk);
}
.seg.for {
  background: color-mix(in srgb, var(--for) var(--mix), var(--surface));
  border-color: color-mix(in srgb, var(--for) calc(var(--mix) + 10%), var(--surface));
}
.seg.against {
  background: color-mix(in srgb, var(--against) var(--mix), var(--surface));
  border-color: color-mix(in srgb, var(--against) calc(var(--mix) + 10%), var(--surface));
}
.seg.lvl-1 {
  --mix: 8%;
}
.seg.lvl-2 {
  --mix: 13%;
}
.seg.lvl-3 {
  --mix: 18%;
}
.seg.lvl-4 {
  --mix: 23%;
}
.seg.lvl-5 {
  --mix: 28%;
}
.seg.lvl-6 {
  --mix: 33%;
}
.seg.is-fill.for {
  background: var(--for);
  border-color: var(--for);
}
.seg.is-fill.against {
  background: var(--against);
  border-color: var(--against);
}
.seg.is-on {
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink);
  z-index: 1;
}
.seg.mid.is-on {
  background: var(--ink-3);
}
.seg:hover {
  filter: brightness(0.95);
}
.scale-labels,
.scale-dirs {
  display: grid;
  grid-template-columns: repeat(13, minmax(0, 1fr));
  font: 500 10.5px/1.2 var(--f-body);
  color: var(--ink-3);
  gap: 3px;
}
.scale-labels span {
  text-align: center;
  white-space: nowrap;
  grid-row: 1;
}
.scale-labels span:nth-child(1) {
  grid-column: 1;
  text-align: left;
}
.scale-labels span:nth-child(2) {
  grid-column: 3;
}
.scale-labels span:nth-child(3) {
  grid-column: 5;
}
.scale-labels span:nth-child(4) {
  grid-column: 7;
}
.scale-labels span:nth-child(5) {
  grid-column: 9;
}
.scale-labels span:nth-child(6) {
  grid-column: 11;
}
.scale-labels span:nth-child(7) {
  grid-column: 13;
  text-align: right;
}
.scale-dirs {
  grid-template-columns: 1fr 1fr;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.scale-dirs span:last-child {
  text-align: right;
}
.readout {
  font-size: 13.5px;
  color: var(--ink-2);
  min-height: 1.5em;
}
.readout b {
  color: var(--ink);
}

/* trust chips */
.chips {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  background: var(--sunk);
  padding: 3px;
  border-radius: var(--r-sm);
  max-width: 520px;
}
.chip {
  border: 0;
  background: transparent;
  border-radius: 4px;
  padding: 7px 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  display: grid;
  gap: 1px;
  text-align: center;
}
.chip small {
  font-size: 10.5px;
  color: var(--ink-3);
  font-weight: 400;
}
.chip.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  font-weight: 600;
}
.chips.is-disabled {
  opacity: 0.55;
}
.ev-note summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-3);
  width: max-content;
}
.ev-note textarea {
  margin-top: 8px;
}
.ev-compare {
  border-top: 1px dashed var(--line-2);
  padding-top: 12px;
  display: grid;
  gap: 6px;
}
.ev-compare p {
  font-size: 13px;
  color: var(--ink-2);
}
.ev-tools {
  display: flex;
  gap: 14px;
  justify-content: flex-end;
}

/* pathbox */
.pathbox-inner {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 14px 14px;
  display: grid;
  gap: 10px;
}
.pb-head h3 {
  font-size: 16px;
  font-weight: 600;
}
.pb-sub {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 2px;
}
.path-chart {
  min-height: 120px;
}
.path-empty {
  border: 1.5px dashed var(--line-2);
  border-radius: var(--r-md);
  padding: 22px 16px;
  color: var(--ink-3);
  font-size: 13.5px;
  text-align: center;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.lg {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.lg i {
  display: inline-block;
  width: 16px;
  height: 3px;
  border-radius: 2px;
}
.lg .lg-for {
  background: var(--for);
}
.lg .lg-against {
  background: var(--against);
}
.lg .lg-panel {
  background: var(--panel);
}
.lg .lg-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--panel);
}
.lg .lg-me {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--me);
}
.lg .lg-band {
  width: 18px;
  height: 10px;
  border-radius: 3px;
  background: var(--panel-soft);
  border: 1px solid var(--line-2);
}
.lg .lg-med {
  width: 2px;
  height: 14px;
  background: var(--ink);
}
.lg .lg-pot {
  width: 18px;
  height: 10px;
  border-radius: 3px;
  border: 1.5px solid var(--for);
  background: transparent;
}
.lg .lg-fill {
  width: 18px;
  height: 10px;
  border-radius: 3px;
  background: var(--for);
}
.reveal-box {
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--sunk);
  font-size: 12.5px;
  color: var(--ink-2);
}
.reveal-box .btn-ghost {
  justify-self: start;
}

/* compare step */
.cmp-head {
  display: grid;
  gap: 4px;
}
.cmp-figs {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
}
.cmp-fig {
  display: grid;
  gap: 2px;
}
.cmp-fig span {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.cmp-fig b {
  font: 600 28px/1.1 var(--f-display);
}
.cmp-fig em {
  font-style: normal;
  font-size: 13px;
  color: var(--ink-2);
}
.diffs {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.diffs li {
  display: grid;
  gap: 3px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 13.5px;
}
.diffs .d-title {
  font-weight: 600;
}
.diffs .d-vs {
  color: var(--ink-2);
}
.locked {
  display: grid;
  gap: 10px;
  justify-items: start;
  color: var(--ink-2);
  font-size: 14px;
}
.next-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* ---------- report ---------- */
.report {
  display: grid;
  gap: 22px;
  padding-bottom: 80px;
}
.r-intro {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 24px;
  display: grid;
  gap: 12px;
}
.r-title {
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 600;
}
.r-lede {
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  max-width: 72ch;
}
.r-lede q {
  quotes: '“' '”';
  font-weight: 600;
}
.r-status {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.r-tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.r-sec {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px 24px;
  display: grid;
  gap: 16px;
  min-width: 0;
}
.r-sec-head {
  display: grid;
  gap: 6px;
}
.r-sec-head h3 {
  font-size: 20px;
  font-weight: 600;
}
.r-sec-head p {
  color: var(--ink-2);
  font-size: 14px;
  max-width: 78ch;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 12px/1 var(--f-body);
  padding: 5px 10px 5px 8px;
  border-radius: 999px;
  background: var(--sunk);
  color: var(--ink);
  white-space: nowrap;
}
.pill::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-3);
}
.pill-warn {
  background: var(--warn-soft);
}
.pill-warn::before {
  background: var(--warn);
}
.pill-info {
  background: var(--info-soft);
}
.pill-info::before {
  background: var(--for);
}
.pill-calm {
  background: var(--good-soft);
}
.pill-calm::before {
  background: var(--good);
}
.pill-mute::before {
  background: var(--ink-3);
}
.pill-plain {
  font-size: 12.5px;
  color: var(--ink-2);
}

.r-claims {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.rc {
  border-top: 1px solid var(--line);
}
.rc:last-child {
  border-bottom: 1px solid var(--line);
}
.rc-link {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) 150px minmax(0, 1.6fr) 170px;
  gap: 18px;
  align-items: center;
  padding: 16px 8px;
  color: inherit;
  text-decoration: none;
  border-radius: var(--r-sm);
}
.rc-link:hover {
  background: var(--surface-2);
}
.rc-text {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.rc-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 600 12.5px/1 var(--f-body);
  background: var(--ink);
  color: var(--bg);
}
.rc-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}
.rc-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  align-items: center;
}
.rc-fig {
  display: grid;
  gap: 1px;
}
.rc-big {
  font: 600 30px/1 var(--f-display);
  letter-spacing: -0.02em;
}
.rc-verbal {
  font-size: 13px;
  font-weight: 600;
}
.rc-shift {
  font-size: 12.5px;
  color: var(--ink-3);
}
.rc-strip {
  min-width: 0;
}
.act {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 13px/1.25 var(--f-body);
  padding: 8px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-2);
  background: var(--surface);
}
.act::before {
  content: '→';
  color: var(--ink-3);
}
.act-settle,
.act-contested {
  border-color: var(--warn);
  background: var(--warn-soft);
}
.act-explore,
.act-open {
  border-color: var(--for);
  background: var(--for-soft);
}
.act-replicate {
  border-color: var(--crit);
  background: var(--crit-soft);
}
@media (max-width: 1100px) {
  .rc-link {
    grid-template-columns: minmax(0, 1fr) 140px;
  }
  .rc-strip {
    grid-column: 1 / -1;
  }
  .rc-act {
    grid-column: 1 / -1;
  }
}
@media (max-width: 560px) {
  .rc-link {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }
  .rc-fig {
    grid-template-columns: auto 1fr;
    column-gap: 10px;
    align-items: baseline;
  }
  .rc-big {
    grid-row: span 2;
  }
  .r-intro,
  .r-sec {
    padding: 18px 16px;
  }
}

.r-fund-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
@media (max-width: 980px) {
  .r-fund-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.r-map {
  min-width: 0;
}
.map-key {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  gap: 4px;
  font-size: 13px;
}
.map-key a {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--ink);
  text-decoration: none;
}
.map-key a:hover {
  text-decoration: underline;
}
.mk-num {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--bg);
  font: 700 11px/1 var(--f-body);
}
.opps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
  counter-reset: opp;
}
.opp {
  counter-increment: opp;
  display: grid;
  gap: 6px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  position: relative;
}
.opp-kind {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 600 11.5px/1 var(--f-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.opp-claim {
  font: 600 11px/1 var(--f-body);
  letter-spacing: 0;
  text-transform: none;
  padding: 4px 7px;
  border-radius: 4px;
  background: var(--ink);
  color: var(--bg);
}
.opp-settle {
  border-left: 4px solid var(--warn);
}
.opp-replicate {
  border-left: 4px solid var(--crit);
}
.opp-explore {
  border-left: 4px solid var(--for);
}
.opp-title {
  font-size: 15.5px;
  font-weight: 600;
}
.opp-body {
  font-size: 13.5px;
  color: var(--ink-2);
}
.opp-link {
  font-size: 13px;
  font-weight: 600;
}
.low-pri {
  font-size: 13px;
  color: var(--ink-2);
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--sunk);
}

/* claim detail */
.back {
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  justify-self: start;
}
.rd-top {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
@media (max-width: 900px) {
  .rd-top {
    grid-template-columns: minmax(0, 1fr);
  }
}
.rd-num {
  display: grid;
  gap: 2px;
}
.rd-num .rc-big {
  font-size: 56px;
}
.rd-verbal {
  font-weight: 600;
  font-size: 16px;
}
.rd-range {
  color: var(--ink-2);
  font-size: 14px;
}
.rd-sentence {
  font-size: 16px;
  line-height: 1.55;
  max-width: 64ch;
}
.rd-action {
  display: grid;
  gap: 8px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.rd-action p {
  font-size: 14px;
  color: var(--ink-2);
}
.imp-list {
  display: grid;
}
.imp-row,
.imp-head {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) 150px;
  gap: 16px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.imp-head {
  border-top: 0;
  padding: 0 0 4px;
}
.imp-row.is-crux {
  background: linear-gradient(90deg, var(--warn-soft), transparent 70%);
}
.imp-row.is-repl {
  background: linear-gradient(90deg, var(--crit-soft), transparent 70%);
}
.imp-title {
  font-weight: 600;
  font-size: 14px;
  line-height: 1.35;
}
.imp-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 6px;
  font-size: 12px;
  color: var(--ink-3);
}
.imp-word {
  font-size: 13px;
  font-weight: 600;
  display: grid;
  gap: 4px;
  justify-items: start;
}
.imp-word small {
  font-weight: 400;
  color: var(--ink-3);
  font-size: 12px;
}
.flag {
  font: 700 10.5px/1 var(--f-body);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 4px 7px;
  border-radius: 4px;
}
.flag-crux {
  background: var(--warn);
  color: #111;
}
.flag-repl {
  background: var(--crit);
  color: #fff;
}
@media (max-width: 760px) {
  .imp-row,
  .imp-head {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .imp-head > :first-child,
  .imp-head > :last-child {
    display: none;
  }
}
.callouts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}
.callout {
  display: grid;
  gap: 6px;
  padding: 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 14px;
  color: var(--ink-2);
}
.callout h4 {
  font-size: 15px;
  color: var(--ink);
  font-weight: 600;
}
.callout.c-crux {
  border-left: 4px solid var(--warn);
}
.callout.c-repl {
  border-left: 4px solid var(--crit);
}
.callout.c-conv {
  border-left: 4px solid var(--for);
}

/* tables */
.tbl-wrap {
  overflow-x: auto;
}
details.r-table summary {
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-2);
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  margin-top: 10px;
}
th,
td {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td.num,
th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
th {
  font-weight: 600;
  color: var(--ink-2);
  font-size: 12px;
}

/* ---------- method ---------- */
.method {
  display: grid;
  gap: 22px;
  padding-bottom: 80px;
  max-width: 980px;
}
.prose {
  display: grid;
  gap: 12px;
  max-width: 72ch;
  align-content: start;
}
.prose p,
.prose li {
  color: var(--ink-2);
}
.prose ol,
.prose ul {
  margin: 0;
  padding-left: 1.2em;
  display: grid;
  gap: 6px;
}
.formula {
  font: 500 14.5px/1.6 var(--f-mono);
  background: var(--sunk);
  border-radius: var(--r-md);
  padding: 14px 16px;
  overflow-x: auto;
  color: var(--ink);
}
.two-col {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 22px;
}

/* ---------- modal, tooltip, toast ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 20, 0.45);
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal {
  width: min(620px, 100%);
  max-height: calc(100vh - 32px);
  overflow: auto;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  display: grid;
  gap: 16px;
  padding: 22px;
}
.modal h2 {
  font-size: 20px;
}
.modal-body {
  display: grid;
  gap: 14px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.form-row {
  display: grid;
  gap: 6px;
}
.form-row label {
  font-size: 13px;
  font-weight: 600;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 520px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}
.menu-list {
  display: grid;
  gap: 8px;
}
.menu-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.menu-item p {
  font-size: 13px;
  color: var(--ink-2);
}
.menu-item h4 {
  font-size: 14.5px;
  font-weight: 600;
  margin-bottom: 2px;
}
.switch {
  position: relative;
  width: 42px;
  height: 24px;
  border-radius: 999px;
  border: 0;
  background: var(--line-2);
  padding: 0;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--surface);
  transition: transform 0.15s;
}
.switch[aria-checked='true'] {
  background: var(--me);
}
.switch[aria-checked='true']::after {
  transform: translateX(18px);
}
.code {
  width: 100%;
  min-height: 160px;
  font: 12px/1.45 var(--f-mono);
}
.err {
  color: var(--crit);
  font-size: 13px;
  font-weight: 600;
}
#tooltip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  max-width: 280px;
  background: var(--ink);
  color: var(--bg);
  font-size: 12.5px;
  line-height: 1.45;
  padding: 8px 10px;
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 70;
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  max-width: min(560px, calc(100% - 32px));
  border-radius: 14px;
  text-align: center;
}
@media (max-width: 860px) {
  .toast {
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  }
}
.empty {
  background: var(--surface);
  border: 1.5px dashed var(--line-2);
  border-radius: var(--r-lg);
  padding: 40px 24px;
  display: grid;
  gap: 12px;
  justify-items: center;
  text-align: center;
  color: var(--ink-2);
}
.empty h3 {
  color: var(--ink);
  font-size: 20px;
}
footer.foot {
  padding-block: 18px 40px;
  color: var(--ink-3);
  font-size: 12.5px;
}

/* ---------- SVG chart styles ---------- */
svg {
  display: block;
  max-width: 100%;
  overflow: visible;
}
.g-line {
  stroke: var(--line);
  stroke-width: 1;
}
.g-mid {
  stroke: var(--line-2);
  stroke-width: 1;
}
.g-tick {
  fill: var(--ink-3);
  font: 500 10.5px var(--f-mono);
}
.g-cap {
  fill: var(--ink-3);
  font: 500 11px var(--f-body);
}
.g-cap.strong {
  fill: var(--ink-2);
  font-weight: 600;
}
.p-label {
  fill: var(--ink-2);
  font: 500 11.5px var(--f-body);
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.p-label.strong {
  fill: var(--ink);
  font-weight: 600;
}
.p-label.mute {
  fill: var(--ink-3);
}
.p-dot {
  fill: var(--ink);
  stroke: var(--surface);
  stroke-width: 2;
}
.p-end {
  fill: var(--me);
  stroke: var(--surface);
  stroke-width: 2.5;
}
.p-none {
  fill: var(--surface);
  stroke: var(--ink-3);
  stroke-width: 1.5;
}
.p-conn {
  stroke: var(--ink-3);
  stroke-width: 1;
  stroke-dasharray: 2 3;
}
.p-hit {
  fill: transparent;
}
.p-row:hover .p-hit,
.p-row.is-hot .p-hit {
  fill: var(--me-soft);
}
.p-row {
  cursor: pointer;
}
.p-panel {
  fill: none;
  stroke: var(--panel);
  stroke-width: 2;
  stroke-opacity: 0.75;
  stroke-linejoin: round;
}
.p-panel-end {
  fill: var(--surface);
  stroke: var(--panel);
  stroke-width: 2;
}
.a-for-line {
  stroke: var(--for);
  stroke-width: 2.5;
  stroke-linecap: round;
}
.a-for-head {
  fill: var(--for);
}
.a-against-line {
  stroke: var(--against);
  stroke-width: 2.5;
  stroke-linecap: round;
}
.a-against-head {
  fill: var(--against);
}
.s-band {
  fill: var(--panel-soft);
}
.s-dot {
  fill: var(--panel);
  stroke: var(--surface);
  stroke-width: 1.5;
}
.s-me {
  fill: var(--me);
  stroke: var(--surface);
  stroke-width: 2;
}
.s-me-label {
  fill: var(--ink);
  font: 600 10.5px var(--f-body);
}
.s-median {
  stroke: var(--ink);
  stroke-width: 2;
}
.s-prior {
  fill: var(--surface);
  stroke: var(--ink-3);
  stroke-width: 1.5;
}
.z-contested {
  fill: var(--warn-soft);
}
.z-false,
.z-true {
  fill: var(--surface-2);
}
.z-open {
  fill: var(--for-soft);
  fill-opacity: 0.6;
}
.z-label {
  fill: var(--ink-2);
  font: 600 11.5px var(--f-body);
}
.m-pt {
  cursor: pointer;
}
.m-dot {
  fill: var(--ink);
  stroke: var(--surface);
  stroke-width: 2.5;
}
.m-pt:hover .m-dot,
.m-pt:focus .m-dot {
  fill: var(--me);
}
.m-pt:focus {
  outline: none;
}
.m-num {
  fill: var(--bg);
  font: 700 11px var(--f-body);
  pointer-events: none;
}
.m-label {
  fill: var(--ink);
  font: 600 12px var(--f-body);
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 3px;
  stroke-linejoin: round;
}
.sl-row line {
  stroke: var(--panel);
  stroke-width: 1.2;
  stroke-opacity: 0.55;
}
.sl-row circle {
  fill: var(--panel);
}
.sl-row:hover line {
  stroke: var(--ink);
  stroke-opacity: 1;
  stroke-width: 2;
}
.sl-me line {
  stroke: var(--me);
  stroke-width: 2.5;
}
.sl-me circle {
  fill: var(--me);
  stroke: var(--surface);
  stroke-width: 2;
}
.sl-med line {
  stroke: var(--ink);
  stroke-width: 3;
}
.sl-med circle {
  fill: var(--ink);
  stroke: var(--surface);
  stroke-width: 2;
}
.i-pot {
  fill: none;
  stroke-width: 1.5;
}
.i-pot.i-for {
  stroke: var(--for);
  fill: var(--for-soft);
  fill-opacity: 0.5;
}
.i-pot.i-against {
  stroke: var(--against);
  fill: var(--against-soft);
  fill-opacity: 0.5;
}
.i-fill.i-for {
  fill: var(--for);
}
.i-fill.i-against {
  fill: var(--against);
}
.i-iqr {
  stroke: var(--ink-2);
  stroke-width: 1.5;
}
.i-me {
  fill: var(--me);
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
@media (forced-colors: active) {
  .seg.is-on {
    outline: 3px solid CanvasText;
  }
}

/* ================================================================
 * Page architecture: top bar persona switch, index, question, claim,
 * assessment form and profiles.
 * ================================================================ */
.persona-switch {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  background: var(--sunk);
  padding: 3px;
  border-radius: 999px;
}
.ps-label {
  font-size: 12px;
  color: var(--ink-3);
  padding: 0 6px 0 10px;
  font-weight: 500;
}
.ps-btn {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
}
.ps-btn[aria-pressed='true'] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}
.top-nav {
  display: flex;
  gap: 4px;
}
.top-link {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font-weight: 500;
  font-size: 14px;
  padding: 7px 10px;
  border-radius: 8px;
  text-decoration: none;
}
.top-link:hover {
  background: var(--sunk);
  color: var(--ink);
}
.top-link[aria-current='page'] {
  color: var(--ink);
  font-weight: 600;
}
@media (max-width: 760px) {
  .brand-tag,
  .ps-label {
    display: none;
  }
  .topbar-inner {
    gap: 8px;
    flex-wrap: wrap;
    padding-block: 8px;
  }
  .persona-switch {
    order: 3;
    width: 100%;
    margin-left: 0;
  }
  .ps-btn {
    flex: 1;
  }
  .top-nav {
    margin-left: auto;
  }
}

.page {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  padding-block: 18px 80px;
  min-width: 0;
}
.crumbs ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
  color: var(--ink-3);
}
.crumbs li + li::before {
  content: '/';
  margin-right: 6px;
  color: var(--line-2);
}
.crumbs a {
  color: var(--ink-2);
  text-decoration: none;
}
.crumbs a:hover {
  text-decoration: underline;
}
.crumbs ol,
.crumbs li {
  min-width: 0;
}
.crumbs [aria-current] {
  color: var(--ink);
  font-weight: 500;
  max-width: min(48ch, 100%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn[disabled],
.btn-ghost[disabled] {
  opacity: 0.4;
  cursor: not-allowed;
}
.fine {
  font-size: 12.5px;
  color: var(--ink-3);
}
.sub-h {
  font-size: 15px;
  font-weight: 600;
}
.notice-info {
  background: var(--info-soft);
}
.notice-info .notice-ico {
  background: var(--for);
  color: #fff;
}

/* index */
.home {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 34px;
  padding-block: 34px 80px;
}
.hero {
  display: grid;
  gap: 14px;
  max-width: 980px;
}
.hero-title {
  font-size: clamp(44px, 7vw, 76px);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1;
}
.hero-lede {
  font-size: clamp(17px, 2vw, 20px);
  color: var(--ink-2);
  max-width: 60ch;
  line-height: 1.5;
}
.persona-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
  margin-top: 6px;
}
.pcard {
  display: grid;
  gap: 4px;
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 16px 18px;
}
.pcard:hover {
  border-color: var(--ink-3);
}
.pcard.is-on {
  border-color: var(--ink);
  box-shadow: var(--shadow);
}
.pcard-kicker {
  font: 600 12px/1.2 var(--f-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.pcard-title {
  font: 600 19px/1.25 var(--f-display);
}
.pcard-body {
  font-size: 14px;
  color: var(--ink-2);
}
.qs {
  display: grid;
  gap: 14px;
}
.qs-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.qs-head h2 {
  font-size: 22px;
  font-weight: 600;
}
.q-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
  gap: 12px;
}
.q-list > li:first-child {
  grid-column: 1 / -1;
}
.q-card {
  height: 100%;
  display: grid;
  gap: 10px;
  align-content: start;
  padding: 18px 20px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  color: inherit;
  text-decoration: none;
}
.q-card.is-live {
  border: 1.5px solid var(--ink);
  box-shadow: var(--shadow);
  padding: 22px 24px;
}
.q-card.is-live:hover .q-cta {
  text-decoration: underline;
}
.q-card.is-example {
  background: var(--surface-2);
  border-style: dashed;
}
.q-card.is-example .q-title {
  color: var(--ink-2);
}
.q-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.q-title {
  font: 600 17px/1.3 var(--f-display);
}
.q-card.is-live .q-title {
  font-size: clamp(20px, 2.4vw, 26px);
}
.q-meta {
  font-size: 13px;
  color: var(--ink-3);
}
.q-cta {
  font-weight: 600;
  color: var(--accent);
  font-size: 14.5px;
}
.q-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  flex-wrap: wrap;
}
.bar {
  flex: none;
  width: 140px;
  height: 6px;
  border-radius: 6px;
  background: var(--sunk);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--me);
  border-radius: 6px;
}

/* question overview */
.ov {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
@media (max-width: 900px) {
  .ov {
    grid-template-columns: minmax(0, 1fr);
  }
}
.ov-main {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.ov-main .inq-meta {
  margin-top: 8px;
}
.ov-title {
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 600;
}
.ov-box {
  display: grid;
  gap: 12px;
  justify-items: start;
  padding: 18px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
}
.ov-lede {
  font-size: 15px;
  line-height: 1.55;
}
.ov-lede q {
  quotes: '“' '”';
  font-weight: 600;
}
.ptabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.ptab {
  padding: 10px 14px;
  font-weight: 600;
  font-size: 14.5px;
  color: var(--ink-2);
  text-decoration: none;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.ptab:hover {
  color: var(--ink);
}
.ptab[aria-current='page'] {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.ct {
  font: 600 11.5px/1 var(--f-body);
  padding: 3px 6px;
  border-radius: 999px;
  background: var(--sunk);
  color: var(--ink-2);
}
.tab-body {
  display: grid;
  gap: 18px;
}

/* claim list */
.cl-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.cl-row {
  display: grid;
  gap: 14px 18px;
  align-items: center;
  padding: 16px 4px;
  border-top: 1px solid var(--line);
}
.cl-row:last-child {
  border-bottom: 1px solid var(--line);
}
.cl-expert {
  grid-template-columns: 28px minmax(0, 1fr) minmax(220px, auto);
}
.cl-funder {
  grid-template-columns: 28px minmax(0, 1.1fr) 140px minmax(0, 1.4fr) 180px;
}
.cl-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--bg);
  font: 600 12.5px/1 var(--f-body);
  align-self: start;
}
.cl-expert.is-done .cl-num {
  background: var(--me);
  color: #fff;
}
.cl-main {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.cl-title {
  font: 600 16.5px/1.3 var(--f-display);
  color: var(--ink);
  text-decoration: none;
}
.cl-title:hover {
  text-decoration: underline;
}
.cl-stmt {
  font-size: 13.5px;
  color: var(--ink-2);
  max-width: 70ch;
}
.cl-state {
  display: grid;
  gap: 8px;
  justify-items: end;
}
.cl-you {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.cl-figs {
  font-size: 13px;
  color: var(--ink-2);
}
.cl-btns {
  display: flex;
  gap: 12px;
  align-items: center;
}
.cl-act {
  display: grid;
  gap: 8px;
  justify-items: start;
}
@media (max-width: 1100px) {
  .cl-funder {
    grid-template-columns: 28px minmax(0, 1fr) 130px;
  }
  .cl-funder .rc-strip,
  .cl-funder .cl-act {
    grid-column: 2 / -1;
  }
}
@media (max-width: 640px) {
  .cl-expert,
  .cl-funder {
    grid-template-columns: 28px minmax(0, 1fr);
  }
  .cl-expert .cl-state,
  .cl-funder .rc-fig,
  .cl-funder .rc-strip,
  .cl-funder .cl-act {
    grid-column: 2 / -1;
    justify-items: start;
  }
  .cl-you {
    justify-content: flex-start;
  }
}

/* panel list & avatars */
.av {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--sunk);
  color: var(--ink-2);
  font: 600 13px/1 var(--f-body);
  border: 1px solid var(--line);
}
.av-me {
  background: var(--me);
  color: #fff;
  border-color: var(--me);
}
.av-lg {
  width: 68px;
  height: 68px;
  font-size: 22px;
}
.pn-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.pn-row {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 170px 170px auto;
  gap: 14px;
  align-items: center;
  padding: 12px 4px;
  border-top: 1px solid var(--line);
}
.pn-row.pn-me {
  background: var(--me-soft);
  border-radius: var(--r-md);
  padding-inline: 10px;
  border-top: 0;
  margin-bottom: 6px;
}
.pn-main {
  display: grid;
  gap: 2px;
  min-width: 0;
}
.pn-name {
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
}
a.pn-name:hover {
  text-decoration: underline;
}
.pn-sub,
.pn-count {
  font-size: 13px;
  color: var(--ink-2);
}
@media (max-width: 860px) {
  .pn-row {
    grid-template-columns: 38px minmax(0, 1fr);
  }
  .pn-count,
  .pn-flag,
  .pn-row > .btn-link,
  .pn-row > .btn-ghost {
    grid-column: 2;
  }
}

/* assessment form: a full-screen takeover */
body.is-taken-over {
  overflow: hidden;
}
.wiz-back {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
}
.wiz {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg);
}
.wiz-in {
  max-width: 1320px;
  margin: 0 auto;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.wiz-head {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) 14px;
}
.wiz-head .wiz-in {
  display: grid;
  gap: 8px;
}
.wiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.wiz-claim {
  font-size: 24px;
  font-weight: 600;
}
.wprog {
  display: flex;
  gap: 5px;
  margin-top: 6px;
}
.wseg {
  flex: 1;
  height: 7px;
  border: 0;
  padding: 0;
  border-radius: 7px;
  background: var(--sunk);
}
.wseg.is-done {
  background: var(--me);
}
.wseg.is-cur {
  background: var(--ink);
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink);
}
.wseg.is-done.is-cur {
  background: var(--me);
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--me);
}
.wiz-body {
  overflow: auto;
}
.wiz-cols {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px max(28px, env(safe-area-inset-right, 0px)) 40px max(28px, env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  gap: 32px;
  align-items: start;
}
.wiz-main {
  display: grid;
  grid-auto-rows: max-content;
  gap: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 26px 28px;
  min-width: 0;
}
.wiz-main .ev-title {
  font-size: 20px;
}
.wiz-main .ev-sum {
  font-size: 15px;
}
.wiz-main .seg {
  height: 40px;
}
.wiz-main .q-label {
  font-size: 15px;
}
.wiz-side {
  position: sticky;
  top: 0;
}
.wiz-side-in {
  display: grid;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 16px 14px;
}
.wiz-foot {
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
}
.wiz-foot-in {
  display: flex;
  align-items: center;
  gap: 14px;
}
.wiz-foot .btn,
.wiz-foot .btn-ghost {
  padding: 10px 20px;
  font-size: 15px;
}
.wiz-spacer {
  flex: 1;
}
@media (max-width: 960px) {
  .wiz-cols {
    grid-template-columns: minmax(0, 1fr);
  }
  .wiz-side {
    position: static;
  }
}
.wq {
  font-size: 20px;
  font-weight: 600;
}
.rv-fig {
  display: flex;
  gap: 14px;
  align-items: center;
}
.rv-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.rv-list li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 12px;
  align-items: baseline;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
}
.rv-ans {
  font-weight: 600;
  text-align: right;
}
/* claim page */
.claim-hero {
  display: grid;
  gap: 8px;
}
.claim-tools {
  align-items: center;
}
.cta-card {
  border: 1.5px solid var(--ink);
  box-shadow: var(--shadow);
}
.ev-preview {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.locked {
  display: flex;
  gap: 12px;
  align-items: center;
}
.lock-ico {
  font-size: 22px;
}
.yvp {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.yvp-main,
.yvp-path {
  display: grid;
  gap: 10px;
  min-width: 0;
}
@media (max-width: 900px) {
  .yvp {
    grid-template-columns: minmax(0, 1fr);
  }
}
.as-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.as-item {
  border-top: 1px solid var(--line);
}
.as-item summary {
  list-style: none;
  cursor: pointer;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 130px minmax(0, 190px) 70px;
  gap: 12px;
  align-items: center;
  padding: 10px 4px;
}
.as-item summary::-webkit-details-marker {
  display: none;
}
.as-item summary:hover {
  background: var(--surface-2);
}
.as-item.is-me summary {
  background: var(--me-soft);
}
.as-who {
  display: grid;
  min-width: 0;
}
.as-name {
  font-weight: 600;
}
.as-sub,
.as-rel,
.as-notes {
  font-size: 12.5px;
  color: var(--ink-2);
}
.as-path {
  font-size: 13.5px;
}
.as-body {
  padding: 4px 4px 16px 54px;
  display: grid;
  gap: 8px;
}
.as-note {
  font-size: 12.5px;
  color: var(--ink-2);
  font-style: italic;
  white-space: normal;
  margin-top: 3px;
}
.as-body td:first-child {
  white-space: normal;
  min-width: 260px;
}
td.mute {
  color: var(--ink-3);
}
@media (max-width: 760px) {
  .as-item summary {
    grid-template-columns: 38px minmax(0, 1fr) auto;
  }
  .as-rel,
  .as-notes {
    grid-column: 2 / -1;
  }
  .as-body {
    padding-left: 4px;
  }
}

/* profile */
.prof {
  gap: 20px;
}
.prof-head {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.prof-id {
  display: grid;
  gap: 4px;
  flex: 1;
  min-width: 220px;
  justify-items: start;
}
.prof-sub {
  color: var(--ink-2);
}
.prof-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 24px;
}
@media (max-width: 760px) {
  .prof-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.interests {
  display: grid;
  gap: 6px;
  align-content: start;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.interests.has {
  background: var(--warn-soft);
  border-color: var(--warn);
}
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.link-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
}
a.link-chip:hover {
  border-color: var(--ink-3);
}
.link-chip.is-sample {
  color: var(--ink-3);
  border-style: dashed;
  cursor: not-allowed;
}
.pa-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.pa-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px minmax(0, 240px) 120px;
  gap: 8px 16px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
}
.pa-claim {
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--ink);
  font-weight: 600;
  text-decoration: none;
}
.pa-claim:hover {
  text-decoration: underline;
}
.pa-none {
  grid-column: 2 / -1;
  color: var(--ink-3);
}
.pa-rel,
.pa-n {
  color: var(--ink-2);
}
.pa-notes {
  grid-column: 1 / -1;
  list-style: none;
  margin: 0;
  padding: 0 0 0 30px;
  display: grid;
  gap: 6px;
}
.pa-notes li {
  font-style: italic;
  color: var(--ink-2);
}
.pa-note-ev {
  display: block;
  font-style: normal;
  font-weight: 600;
  font-size: 12px;
  color: var(--ink-3);
}
@media (max-width: 760px) {
  .pa-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .pa-rel,
  .pa-n,
  .pa-none {
    grid-column: 1 / -1;
  }
}

    <script>
/*
 * Credence — maths, state, storage and panel aggregation.
 *
 * Credence is stored in decibans (dB): 10 · log10(odds).
 *   0 dB = 50%, +10 dB = 10:1 on (91%), −10 dB = 1:10 (9%).
 * Evidence multiplies the odds, so in decibans it simply adds:
 *   conclusion = starting belief + Σ (strength × trust)
 */
(function () {
  const C = (window.C = window.C || {});

  /* ---------- maths ---------- */
  const D = 25; // charts span ±25 dB ≈ 0.3% … 99.7%
  const STEPS = [-25, -17, -12, -7, -4, -2, 0, 2, 4, 7, 12, 17, 25];
  const TRUST = [
    { v: 0, label: 'Not at all', hint: 'Discount it entirely' },
    { v: 0.33, label: 'Doubtful', hint: 'Counts for a third' },
    { v: 0.67, label: 'Mostly', hint: 'Counts for two thirds' },
    { v: 1, label: 'Fully', hint: 'Counts in full' },
  ];

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const M = (C.math = {
    D,
    STEPS,
    TRUST,
    clamp,
    toDb(p) {
      p = clamp(p, 1e-9, 1 - 1e-9);
      return 10 * Math.log10(p / (1 - p));
    },
    toP(db) {
      return 1 / (1 + Math.pow(10, -db / 10));
    },
    factor(db) {
      return Math.pow(10, db / 10);
    },
    pct(p) {
      const v = p * 100;
      if (v < 1) return (v < 0.1 ? '<0.1' : v.toFixed(1)) + '%';
      if (v > 99) return (v > 99.9 ? '>99.9' : v.toFixed(1)) + '%';
      return Math.round(v) + '%';
    },
    pctDb(db) {
      return M.pct(M.toP(db));
    },
    chance(p) {
      const n = (x) => (x >= 1000 ? Math.round(x / 100) * 100 : x).toLocaleString('en-GB');
      if (p <= 0.5) {
        const k = Math.round(1 / p);
        return k <= 2 ? 'about 1 in 2' : 'about 1 in ' + n(k);
      }
      const k = Math.round(1 / (1 - p));
      return k <= 2 ? 'about 1 in 2' : 'about ' + n(k - 1) + ' in ' + n(k);
    },
    // IPCC calibrated language: familiar to scientists and readable by funders.
    verbal(p) {
      // judge the rounded value people actually see, so “90%” never reads “Likely”
      if (p > 0.01 && p < 0.99) p = Math.round(p * 100) / 100;
      if (p >= 0.99) return 'Virtually certain';
      if (p >= 0.95) return 'Extremely likely';
      if (p >= 0.9) return 'Very likely';
      if (p >= 0.66) return 'Likely';
      if (p > 0.33) return 'About as likely as not';
      if (p > 0.1) return 'Unlikely';
      if (p > 0.05) return 'Very unlikely';
      if (p > 0.01) return 'Extremely unlikely';

    verbalDb(db) {

    strengthWord(db) {

      if (a < 5) return 'Weak';
      if (a < 10) return 'Moderate';
      if (a < 15) return 'Strong';
      if (a < 20) return 'Very strong';
      return 'Decisive';
    },
    strengthLabel(db) {

    },
    factorText(db) {

      return (db > 0 ? 'multiplies the odds by about ' : 'divides the odds by about ') + r.toLocaleString('en-GB');
    },

      let best = TRUST[0];
      for (const x of TRUST) if (Math.abs(x.v - t) < Math.abs(best.v - t)) best = x;
      return best.label;
    },
    snap(v, arr) {

      for (const x of arr) if (Math.abs(x - v) < Math.abs(best - v)) best = x;

    },
    quantile(arr, q) {

      const s = [...arr].sort((a, b) => a - b);
      const pos = (s.length - 1) * q;
      const lo = Math.floor(pos);
      const hi = Math.ceil(pos);

    else if (st.postIqr > SPLIT) st.status = 'contested';
    else if (Math.abs(st.postMed) < OPEN) st.status = 'open';
    else st.status = st.postMed > 0 ? 'settled-true' : 'settled-false';
    return st;
  };

  C.STATUS = {
    contested: { label: 'Contested', short: 'contested', action: 'Fund a decisive test', tone: 'warn' },
    open: { label: 'Open question', short: 'open', action: 'Fund exploration', tone: 'info' },
    'settled-true': { label: 'Consensus: likely true', short: 'agreed likely true', action: 'Low priority', tone: 'calm' },
    'settled-false': { label: 'Consensus: likely false', short: 'agreed likely false', action: 'Low priority', tone: 'calm' },
    insufficient: { label: 'Too few assessors', short: 'need more assessors', action: 'Recruit assessors', tone: 'mute' },
  };

  /* Ranked list of where money would most change expert minds. */
  C.opportunities = function (all) {
    const out = [];
    for (const s of all) {
      if (s.status === 'contested') {
        out.push({ type: 'settle', score: 10 + s.postIqr, stats: s, ev: s.crux });
      }
      if (s.repl) {
        out.push({ type: 'replicate', score: 6 + s.repl.unrealised, stats: s, ev: s.repl });
      }
      if (s.status === 'open') {
        out.push({ type: 'explore', score: 8 + (OPEN - Math.abs(s.postMed)), stats: s, ev: null });
      }
    }
    return out.sort((a, b) => b.score - a.score);
  };

  /* ---------- import / export ---------- */
  C.exportMine = function () {
    return {
      format: 'credence.ratings.v1',
      exportedAt: new Date().toISOString(),
      inquiryId: S.inquiry.id,
      assessor: { ...C.myProfile(), name: S.me.name || 'Anonymous' },
      ratings: C.myDoneRatings(),
    };
  };

  C.exportInquiry = function () {
    const assessors = [...S.imported.assessors];
    const ratings = { ...S.imported.ratings };
    if (C.anyComplete()) {
      assessors.push({ ...C.myProfile(), name: S.me.name || 'Anonymous' });
      ratings[S.me.id] = C.myDoneRatings();
    }
    return { format: 'credence.inquiry.v1', exportedAt: new Date().toISOString(), inquiry: S.inquiry, assessors, ratings };
  };

  /* Returns a short human message describing what was imported. */
  C.importData = function (obj) {
    if (!obj || typeof obj !== 'object') throw new Error('That file is not Credence data.');
    if (obj.format === 'credence.ratings.v1') {
      const a = obj.assessor || {};
      if (!a.id) throw new Error('The ratings file has no assessor id.');
      if (a.id === S.me.id) throw new Error('That file holds your own ratings; they are already here.');
      const i = S.imported.assessors.findIndex((x) => x.id === a.id);
      const entry = {
        id: a.id,
        name: a.name || 'Assessor',
        discipline: a.discipline || '',
        affiliation: a.affiliation || '',
        role: a.role || '',
        bio: a.bio || '',
        interests: a.interests || '',
        links: a.links || {},
      };
      if (i >= 0) S.imported.assessors[i] = entry;
      else S.imported.assessors.push(entry);
      S.imported.ratings[a.id] = obj.ratings || {};
      C.save();
      return 'Added ratings from ' + entry.name + '.';
    }
    if (obj.format === 'credence.inquiry.v1') {
      if (!obj.inquiry || !Array.isArray(obj.inquiry.claims)) throw new Error('The inquiry file has no claims.');
      S.inquiry = obj.inquiry;
      S.imported = { assessors: (obj.assessors || []).filter((a) => a.id !== S.me.id), ratings: obj.ratings || {} };
      if (obj.ratings && obj.ratings[S.me.id]) S.me.ratings = obj.ratings[S.me.id];
      C.save();
      return 'Loaded “' + (S.inquiry.title || 'inquiry') + '” with ' + S.imported.assessors.length + ' assessors.';
    }
    throw new Error('Unrecognised file. Expected a Credence ratings or inquiry export.');
  };
})();

</script>
    <script>
/*
 * Credence — hand-built SVG charts. No libraries.
 * Every chart draws credence on the same log-odds axis, labelled in percent.
 */
(function () {
  const C = (window.C = window.C || {});
  const M = C.math;

  const esc = (C.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  });

  const TICKS_WIDE = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99];
  const TICKS_NARROW = [0.01, 0.1, 0.5, 0.9, 0.99]; // evenly spaced in decibans
  let TICKS = TICKS_WIDE;
  const useTicks = (w) => (TICKS = w < 460 ? TICKS_NARROW : TICKS_WIDE);
  const tickLabel = (p) => Math.round(p * 100) + '%';
  const r1 = (v) => Math.round(v * 10) / 10;

  function scaleX(left, width, D) {
    D = D || M.D;
    return (db) => left + ((M.clamp(db, -D, D) + D) / (2 * D)) * width;
  }

  function truncate(text, maxChars) {
    if (text.length <= maxChars) return text;
    return text.slice(0, Math.max(0, maxChars - 1)).trimEnd() + '…';
  }

  function grid(x, top, bottom, opts) {
    opts = opts || {};
    let out = '';
    for (const p of TICKS) {
      const db = M.toDb(p);
      const xx = r1(x(db));
      out += `<line x1="${xx}" x2="${xx}" y1="${top}" y2="${bottom}" class="${p === 0.5 ? 'g-mid' : 'g-line'}"/>`;
      if (opts.labels !== false) {
        out += `<text x="${xx}" y="${opts.labelY}" class="g-tick" text-anchor="middle">${tickLabel(p)}</text>`;
      }
    }
    return out;
  }

  function arrow(x1, x2, y, cls) {
    const dir = x2 > x1 ? 1 : -1;
    const head = Math.min(7, Math.abs(x2 - x1));
    const xb = x2 - dir * head;
    return (
      `<line x1="${r1(x1)}" x2="${r1(xb)}" y1="${y}" y2="${y}" class="${cls}-line"/>` +
      `<path d="M${r1(x2)},${y} L${r1(xb)},${y - 4.5} L${r1(xb)},${y + 4.5} Z" class="${cls}-head"/>`
    );
  }

  const C_ = (C.charts = {});

  /* ------------------------------------------------------------------
   * Belief path: the assessor's own reasoning, read top to bottom.
   * ------------------------------------------------------------------ */
  C_.beliefPath = function (el, claim, mine, panel, opts) {
    opts = opts || {};
    const W = Math.max(260, el.clientWidth || 340);
    const padL = 12;
    const padR = 12;
    const w = W - padL - padR;
    const x = scaleX(padL, w);
    const RH = 42;
    const top = 30;
    const items = claim.evidence;
    const rowsN = items.length + 2;
    const H = top + rowsN * RH + (panel ? 26 : 8);
    const chars = Math.floor(w / 6.4);
    useTicks(w);

    if (!mine || mine.prior == null) {
      el.innerHTML = `<div class="path-empty">Set your starting belief to see how the evidence moves you.</div>`;
      return;
    }

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Your belief path for this claim">`;
    svg += `<text x="${padL}" y="12" class="g-cap">← less likely</text><text x="${W - padR}" y="12" class="g-cap" text-anchor="end">more likely →</text>`;
    svg += grid(x, top - 4, H - (panel ? 26 : 8), { labelY: 25 });

    let cum = mine.prior;
    let pc = panel ? panel.priorMed : null;
    const panelPts = [];
    let y = top;

    // start row
    let my = y + 28;
    svg += `<text x="${padL}" y="${y + 13}" class="p-label strong">Starting belief · ${M.pctDb(cum)}</text>`;
    let prevY = my;
    let prevX = x(cum);
    if (panel && pc != null) panelPts.push([x(pc), my]);
    svg += `<circle cx="${r1(prevX)}" cy="${my}" r="5" class="p-dot"/>`;
    y += RH;

    items.forEach((e) => {
      const r = mine.ev && mine.ev[e.id];
      my = y + 28;
      const evStat = panel && panel.ev.find((v) => v.e.id === e.id);
      if (panel && evStat && evStat.n) {
        pc += evStat.impMed;
        panelPts.push([x(pc), my]);
      }
      if (!r || r.s == null) {
        const what = r && r.skipped ? 'skipped' : opts.pending || 'not rated';
        svg += `<g class="p-row${opts.hot === e.id ? ' is-hot' : ''}" data-ev="${esc(e.id)}"><rect x="0" y="${y + 1}" width="${W}" height="${RH - 2}" class="p-hit"/>`;
        svg += `<text x="${padL}" y="${y + 13}" class="p-label mute">${esc(truncate(e.title, chars - 10))} · ${what}</text></g>`;
        svg += `<line x1="${r1(prevX)}" x2="${r1(prevX)}" y1="${prevY + 6}" y2="${my + 6}" class="p-conn"/>`;
        prevY = my;
        y += RH;
        return;
      }
      const t = r.t != null ? r.t : 1;
      const impact = r.s * t;
      const x1 = x(cum);
      const x2 = x(cum + impact);
      const word = M.strengthLabel(impact);
      svg += `<line x1="${r1(x1)}" x2="${r1(x1)}" y1="${prevY + 6}" y2="${my}" class="p-conn"/>`;
      svg += `<g class="p-row${opts.hot === e.id ? ' is-hot' : ''}" data-ev="${esc(e.id)}" data-tip="${esc('<b>' + e.title + '</b><br>' + word + ' · ' + M.pctDb(cum) + ' → ' + M.pctDb(cum + impact))}">`;
      svg += `<rect x="0" y="${y + 1}" width="${W}" height="${RH - 2}" class="p-hit"/>`;
      svg += `<text x="${padL}" y="${y + 13}" class="p-label">${esc(truncate(e.title, chars))}</text>`;
      if (Math.abs(x2 - x1) < 3) {
        svg += `<circle cx="${r1(x1)}" cy="${my}" r="3.5" class="p-none"/>`;
      } else {
        svg += arrow(x1, x2, my, impact > 0 ? 'a-for' : 'a-against');
      }
      svg += `</g>`;
      cum += impact;
      prevX = x(cum);
      prevY = my;
      y += RH;
    });

    // end row
    my = y + 28;
    if (panel && pc != null) panelPts.push([x(pc), my]);
    svg += `<line x1="${r1(prevX)}" x2="${r1(prevX)}" y1="${prevY + 6}" y2="${my}" class="p-conn"/>`;
    if (panelPts.length > 1) {
      svg += `<polyline points="${panelPts.map((p) => r1(p[0]) + ',' + p[1]).join(' ')}" class="p-panel"/>`;
      const last = panelPts[panelPts.length - 1];
      svg += `<circle cx="${r1(last[0])}" cy="${last[1]}" r="5" class="p-panel-end"/>`;
      const anchor = last[0] > W - 90 ? 'end' : last[0] < 90 ? 'start' : 'middle';
      svg += `<text x="${r1(last[0])}" y="${my + 22}" class="p-label mute" text-anchor="${anchor}">Panel median · ${M.pctDb(pc)}</text>`;
    }
    const endX = x(cum);
    const unfinished = items.some((e) => !(mine.ev && mine.ev[e.id] && (mine.ev[e.id].s != null || mine.ev[e.id].skipped)));
    const endLabel = opts.pending && unfinished ? 'So far' : 'Your conclusion';
    svg += `<text x="${padL}" y="${y + 13}" class="p-label strong">${endLabel} · ${M.pctDb(cum)} · ${esc(M.verbalDb(cum))}</text>`;
    svg += `<circle cx="${r1(endX)}" cy="${my}" r="7.5" class="p-end"/>`;
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  /* ------------------------------------------------------------------
   * Panel strip: one dot per assessor's conclusion, middle half shaded.
   * ------------------------------------------------------------------ */
  C_.strip = function (el, st, opts) {
    opts = opts || {};
    const W = Math.max(240, el.clientWidth || 420);
    const padL = 12;
    const padR = 12;
    const H = opts.compact ? 54 : 62;
    if (!st.n) {
      el.innerHTML = `<div class="path-empty" style="padding:14px">No ratings yet</div>`;
      return;
    }
    const x = scaleX(padL, W - padL - padR);
    useTicks(W - padL - padR);
    const base = opts.compact ? 26 : 30;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(
      'Conclusions of ' + st.n + ' assessors. Median ' + M.pctDb(st.postMed)
    )}">`;
    svg += grid(x, 4, H - 14, { labelY: H - 2 });
    if (st.n >= 2) {
      const a = x(st.postQ1);
      const b = x(st.postQ3);
      svg += `<rect x="${r1(a)}" y="${base - 15}" width="${r1(Math.max(2, b - a))}" height="30" rx="5" class="s-band"/>`;
    }
    // shift arrow from starting-belief median to conclusion median
    if (st.n >= 3 && Math.abs(st.shift) > 0.8) {
      svg += `<circle cx="${r1(x(st.priorMed))}" cy="5" r="3" class="s-prior"/>`;
      svg += arrow(x(st.priorMed), x(st.postMed), 5, st.shift > 0 ? 'a-for' : 'a-against');
    }
    // beeswarm
    const placed = [];
    const rows = [...st.rows].sort((a, b) => (a.isMe ? 1 : 0) - (b.isMe ? 1 : 0) || a.post - b.post);
    const offsets = [0, -8, 8, -15, 15, -4, 4, -11, 11];
    for (const r of rows) {
      const cx = x(r.post);
      let cy = base;
      for (const o of offsets) {
        const yy = base + o;
        if (!placed.some((p) => Math.abs(p[0] - cx) < 8.5 && Math.abs(p[1] - yy) < 8.5)) {
          cy = yy;
          break;
        }
      }
      placed.push([cx, cy]);
      const tip = `<b>${esc(r.name)}</b>${r.discipline ? ' · ' + esc(r.discipline) : ''}<br>Start ${M.pctDb(r.prior)} → conclusion ${M.pctDb(
        r.post
      )}<br>${r.n} of ${st.claim.evidence.length} pieces of evidence rated`;
      svg += `<circle cx="${r1(cx)}" cy="${cy}" r="${r.isMe ? 5.5 : 4.2}" class="${r.isMe ? 's-me' : 's-dot'}" data-tip="${esc(tip)}" tabindex="-1"/>`;
      if (r.isMe) svg += `<text x="${r1(cx)}" y="${cy - 9}" class="s-me-label" text-anchor="middle">You</text>`;
    }
    if (st.n >= 1) {
      const mx = r1(x(st.postMed));
      svg += `<line x1="${mx}" x2="${mx}" y1="${base - 17}" y2="${base + 17}" class="s-median"/>`;
    }
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  /* ------------------------------------------------------------------
   * Funding map: credence × disagreement, one bubble per claim.
   * ------------------------------------------------------------------ */
  C_.map = function (el, list, onPick) {
    const W = Math.max(300, el.clientWidth || 560);
    const H = Math.round(Math.min(380, Math.max(280, W * 0.62)));
    const padL = 44;
    const padR = 16;
    const padT = 14;
    const padB = 44;
    const w = W - padL - padR;
    const h = H - padT - padB;
    const x = scaleX(padL, w);
    useTicks(w);
    const YMAX = 30;
    const y = (iqr) => padT + h - (M.clamp(iqr, 0, YMAX) / YMAX) * h;
    const { SPLIT, OPEN } = C.thresholds;
    const ySplit = y(SPLIT);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Map of claims by panel credence and disagreement">`;
    // zones
    svg += `<rect x="${padL}" y="${padT}" width="${w}" height="${r1(ySplit - padT)}" class="z-contested"/>`;
    svg += `<rect x="${padL}" y="${r1(ySplit)}" width="${r1(x(-OPEN) - padL)}" height="${r1(padT + h - ySplit)}" class="z-false"/>`;
    svg += `<rect x="${r1(x(-OPEN))}" y="${r1(ySplit)}" width="${r1(x(OPEN) - x(-OPEN))}" height="${r1(padT + h - ySplit)}" class="z-open"/>`;
    svg += `<rect x="${r1(x(OPEN))}" y="${r1(ySplit)}" width="${r1(padL + w - x(OPEN))}" height="${r1(padT + h - ySplit)}" class="z-true"/>`;
    svg += grid(x, padT, padT + h, { labelY: padT + h + 16 });
    svg += `<text x="${padL + 8}" y="${padT + 18}" class="z-label">Contested · experts split</text>`;
    svg += `<text x="${padL + 8}" y="${padT + h - 10}" class="z-label">Agreed: likely false</text>`;
    svg += `<text x="${r1((x(-OPEN) + x(OPEN)) / 2)}" y="${padT + h - 10}" class="z-label" text-anchor="middle">Open</text>`;
    svg += `<text x="${padL + w - 8}" y="${padT + h - 10}" class="z-label" text-anchor="end">Agreed: likely true</text>`;
    // y axis, in words rather than decibans
    svg += `<text x="12" y="${r1(padT + h / 2)}" class="g-cap" transform="rotate(-90 12 ${r1(padT + h / 2)})" text-anchor="middle">Disagreement →</text>`;
    svg += `<text x="${padL - 6}" y="${r1(padT + h - 2)}" class="g-tick" text-anchor="end">low</text>`;
    svg += `<text x="${padL - 6}" y="${r1(padT + 10)}" class="g-tick" text-anchor="end">high</text>`;
    svg += `<line x1="${padL}" x2="${padL + w}" y1="${r1(ySplit)}" y2="${r1(ySplit)}" class="g-mid"/>`;
    svg += `<text x="${r1(padL + w / 2)}" y="${H - 6}" class="g-cap" text-anchor="middle">Panel’s median credence →</text>`;
    // bubbles: numbered to match the claim list; titles live in the key below and the tooltip
    const placed = [];
    list.forEach((st, i) => {
      if (st.n < 3) return; // too few assessors to place on the map
      const cx = x(st.postMed);
      let cy = y(st.postIqr);
      while (placed.some((p) => Math.hypot(p[0] - cx, p[1] - cy) < 22)) cy -= 6;
      placed.push([cx, cy]);
      const tip = `<b>${esc(st.claim.title)}</b><br>Median ${M.pctDb(st.postMed)} · middle half ${M.pctDb(st.postQ1)}–${M.pctDb(st.postQ3)}<br>${
        C.STATUS[st.status].label
      }`;
      svg += `<g class="m-pt" data-claim="${esc(st.claim.id)}" data-tip="${esc(tip)}" tabindex="0" role="button" aria-label="${esc(st.claim.title)}">`;
      svg += `<circle cx="${r1(cx)}" cy="${r1(cy)}" r="12" class="m-dot m-${st.status}"/>`;
      svg += `<text x="${r1(cx)}" y="${r1(cy + 4)}" class="m-num" text-anchor="middle">${i + 1}</text>`;
      svg += `</g>`;
    });
    svg += `</svg>`;
    el.innerHTML = svg;
    if (onPick) {
      el.querySelectorAll('.m-pt').forEach((g) => {
        g.addEventListener('click', () => onPick(g.dataset.claim));
        g.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            onPick(g.dataset.claim);
          }
        });
      });
    }
  };

  /* ------------------------------------------------------------------
   * Slopegraph: each assessor's start → conclusion.
   * ------------------------------------------------------------------ */
  C_.slope = function (el, st) {
    const W = Math.max(280, el.clientWidth || 520);
    const padL = 12;
    const padR = 12;
    const H = 232;
    const yA = 44;
    const yB = 178;
    const x = scaleX(padL, W - padL - padR);
    useTicks(W - padL - padR);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="How each assessor moved from starting belief to conclusion">`;
    svg += `<text x="${padL}" y="14" class="g-cap strong">Before weighing evidence</text>`;
    svg += `<text x="${padL}" y="${H - 4}" class="g-cap strong">After weighing evidence</text>`;
    for (const p of TICKS) {
      const xx = r1(x(M.toDb(p)));
      svg += `<line x1="${xx}" x2="${xx}" y1="${yA}" y2="${yB}" class="${p === 0.5 ? 'g-mid' : 'g-line'}"/>`;
      svg += `<text x="${xx}" y="${yA - 14}" class="g-tick" text-anchor="middle">${tickLabel(p)}</text>`;
      svg += `<text x="${xx}" y="${yB + 22}" class="g-tick" text-anchor="middle">${tickLabel(p)}</text>`;
    }
    if (st.n >= 2) {
      svg += `<rect x="${r1(x(st.priorQ1))}" y="${yA - 7}" width="${r1(Math.max(2, x(st.priorQ3) - x(st.priorQ1)))}" height="14" rx="7" class="s-band"/>`;
      svg += `<rect x="${r1(x(st.postQ1))}" y="${yB - 7}" width="${r1(Math.max(2, x(st.postQ3) - x(st.postQ1)))}" height="14" rx="7" class="s-band"/>`;
    }
    const rows = [...st.rows].sort((a, b) => (a.isMe ? 1 : 0) - (b.isMe ? 1 : 0));
    for (const r of rows) {
      const tip = `<b>${esc(r.name)}</b>${r.discipline ? ' · ' + esc(r.discipline) : ''}<br>${M.pctDb(r.prior)} → ${M.pctDb(r.post)}`;
      svg += `<g data-tip="${esc(tip)}" class="${r.isMe ? 'sl-me' : 'sl-row'}">`;
      svg += `<line x1="${r1(x(r.prior))}" y1="${yA}" x2="${r1(x(r.post))}" y2="${yB}"/>`;
      svg += `<circle cx="${r1(x(r.prior))}" cy="${yA}" r="${r.isMe ? 5 : 3.5}"/><circle cx="${r1(x(r.post))}" cy="${yB}" r="${r.isMe ? 5 : 3.5}"/>`;
      svg += `</g>`;
    }
    if (st.n >= 1) {
      svg += `<g class="sl-med"><line x1="${r1(x(st.priorMed))}" y1="${yA}" x2="${r1(x(st.postMed))}" y2="${yB}"/>`;
      svg += `<circle cx="${r1(x(st.priorMed))}" cy="${yA}" r="6"/><circle cx="${r1(x(st.postMed))}" cy="${yB}" r="6"/></g>`;
    }
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  /* ------------------------------------------------------------------
   * Evidence impact: one row per piece of evidence.
   * Outline = weight if fully trusted; fill = weight as the panel trusts it.
   * ------------------------------------------------------------------ */
  const IMP_D = 25;
  C_.impactScale = function (W) {
    const padL = 8;
    const padR = 8;
    return scaleX(padL, W - padL - padR, IMP_D);
  };

  C_.impactHeader = function (el) {
    const W = Math.max(200, el.clientWidth || 320);
    const x = C_.impactScale(W);
    const H = 34;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`;
    svg += `<text x="8" y="12" class="g-cap">← opposes</text><text x="${W - 8}" y="12" class="g-cap" text-anchor="end">supports →</text>`;
    const marks = [
      [-20, 'Decisive'],
      [-10, 'Strong'],
      [0, 'None'],
      [10, 'Strong'],
      [20, 'Decisive'],
    ];
    for (const [v, l] of marks) svg += `<text x="${r1(x(v))}" y="29" class="g-tick" text-anchor="middle">${l}</text>`;
    svg += `</svg>`;
    el.innerHTML = svg;
  };

  C_.impactRow = function (el, v, opts) {
    opts = opts || {};

    const x = C_.impactScale(W);
    const H = 34;

    svg += `<line x1="${r1(x0)}" x2="${r1(x0)}" y1="0" y2="${H}" class="g-mid"/>`;

      const icls = v.impMed >= 0 ? 'for' : 'against';
      if (iw >= 1) svg += `<rect x="${r1(ia)}" y="${yc - 7}" width="${r1(iw)}" height="14" rx="3" class="i-fill i-${icls}"/>`;
      if (v.n >= 3) {
        const a = x(v.impQ1);
        const b = x(v.impQ3);
        svg += `<line x1="${r1(a)}" x2="${r1(b)}" y1="${yc + 13}" y2="${yc + 13}" class="i-iqr"/>`;
        svg += `<line x1="${r1(a)}" x2="${r1(a)}" y1="${yc + 9}" y2="${yc + 17}" class="i-iqr"/><line x1="${r1(b)}" x2="${r1(b)}" y1="${yc + 9}" y2="${yc + 17}" class="i-iqr"/>`;

      const mx = r1(x(v.mine.impact));
      svg += `<path d="M${mx},${yc - 8} l-5,-6 h10 z" class="i-me"/>`;
    }
    svg += `</svg>`;
    el.innerHTML = svg;

  /* ------------------------------------------------------------------
   * Mini comparison inside an evidence card (after you have rated it).
   * ------------------------------------------------------------------ */
  C_.miniCompare = function (el, v) {
    const W = Math.max(200, el.clientWidth || 300);
    const x = C_.impactScale(W);
    const H = 40;
    const yc = 16;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Your weighting compared with the panel">`;
    svg += `<line x1="${r1(x(0))}" x2="${r1(x(0))}" y1="2" y2="${H - 12}" class="g-mid"/>`;
    for (const g of [-20, -10, 10, 20]) svg += `<line x1="${r1(x(g))}" x2="${r1(x(g))}" y1="2" y2="${H - 12}" class="g-line"/>`;
    if (v.n >= 2) {
      svg += `<rect x="${r1(x(v.impQ1))}" y="${yc - 9}" width="${r1(Math.max(2, x(v.impQ3) - x(v.impQ1)))}" height="18" rx="5" class="s-band"/>`;
    }
    const placed = [];
    for (const imp of [...v.impacts].sort((a, b) => a - b)) {
      const cx = x(imp);
      let cy = yc;
      for (const o of [0, -6, 6, -11, 11]) {
        if (!placed.some((p) => Math.abs(p[0] - cx) < 6.5 && Math.abs(p[1] - (yc + o)) < 6.5)) {
          cy = yc + o;
          break;

      placed.push([cx, cy]);
      svg += `<circle cx="${r1(cx)}" cy="${cy}" r="3.2" class="s-dot"/>`;
